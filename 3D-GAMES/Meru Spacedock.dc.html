<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#04050b}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent)}button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}</style>
</helmet>
<div style="position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#04050b;font-family:var(--font-body);user-select:none;-webkit-user-select:none;touch-action:none" data-screen-label="Meru Dock">
  <div ref="{{ stageRef }}" style="position:absolute;left:0;right:0;top:{{ stageTop }};bottom:0;overflow:hidden"></div>
  <div data-hud-host="1" style="position:absolute;inset:0;pointer-events:none"><dc-import name="Game HUD" game="{{ engine }}" hud="{{ stdHud }}" started="{{ started }}" busy="{{ hudBusy }}" on-hud="{{ onHud }}" world="Meru" keys="{{ dockKeys }}" skip-keys="{{ skipKeys }}" hint-size="100%,100%" style="position:absolute;inset:0;pointer-events:none"></dc-import></div>
  <sc-if value="{{ showSkip }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ skip }}" style="position:absolute;right:max(12px, env(safe-area-inset-right));bottom:max(12px, env(safe-area-inset-bottom));min-height:48px;min-width:120px;border:2px solid #ffd23a;border-radius:0;background:#000;color:#fff;font:800 15px var(--font-heading);text-align:left;padding:10px 14px;display:flex;justify-content:space-between;gap:16px;cursor:pointer;z-index:3" style-hover="background:#2a2826"><span>Skip</span><span>→</span></button>
  </sc-if>
  <sc-if value="{{ showNote }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:12px;right:12px;top:{{ noteTop }};display:flex;justify-content:center;pointer-events:none;z-index:2">
      <div style="background:#000;border:2px solid #ffd23a;padding:8px 14px;display:flex;flex-direction:column;gap:2px;max-width:min(420px,100%)"><span style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ffd23a">{{ hud.note.title }}</span><span style="font-size:14px;line-height:1.35;color:#fff;text-wrap:pretty">{{ hud.note.sub }}</span></div>
    </div>
  </sc-if>
  <sc-if value="{{ showPrompt }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;align-items:{{ prAlign }};justify-content:flex-start;padding:{{ prPad }};box-sizing:border-box;overflow:auto;background:rgba(3,6,10,0.45);z-index:9">
      <div style="width:min(480px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:#000;color:#fff;border:2px solid #ffd23a;padding:{{ prInner }};display:flex;flex-direction:column;gap:14px">
        <div style="font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase">Meru Dock</div>
        <h2 style="font-family:var(--font-heading);font-weight:800;font-size:{{ prTitle }};line-height:0.95;letter-spacing:-0.03em;margin:0;color:#ffd23a;text-wrap:balance">{{ hud.prompt.title }}</h2>
        <div style="display:flex;flex-direction:column;gap:10px;border-top:2px solid #3a3836;padding-top:14px">
          <sc-for list="{{ promptButtons }}" as="b" hint-placeholder-count="2">
            <button onClick="{{ b.pick }}" style="display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:14px 20px;background:{{ b.bg }};color:{{ b.fg }};border:2px solid {{ b.bd }};border-radius:0;font:800 17px var(--font-heading);text-align:left;cursor:pointer"><span>{{ b.label }}</span><span>→</span></button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ showStart }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;top:0;left:0;bottom:0;width:min(520px,100%);overflow:auto;background:var(--color-accent);color:var(--color-bg);display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:clamp(20px, 5vh, 40px) clamp(20px, 5vw, 40px);box-sizing:border-box;border-right:2px solid var(--color-text);z-index:10">
      <div style="font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase">8 Gates · Meru</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <h1 style="font-family:var(--font-heading);font-weight:800;font-size:clamp(40px, min(11vw, 13vh), 104px);line-height:0.9;letter-spacing:-0.04em;margin:0;color:var(--color-bg);text-wrap:balance">{{ startTitle }}</h1>
        <p style="font-size:16px;line-height:1.5;margin:0;max-width:360px;text-wrap:pretty">{{ startBody }}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <button onClick="{{ start }}" disabled="{{ notReady }}" style="display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:16px 20px;background:var(--color-bg);color:var(--color-text);border:2px solid var(--color-text);border-radius:0;font:800 18px var(--font-heading);text-align:left;cursor:pointer" style-hover="background:var(--color-neutral-200)"><span>{{ startLabel }}</span><span>→</span></button>
        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:13px;background:var(--color-text);color:var(--color-bg);padding:8px 10px">{{ error }}</div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;followCam&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Camera&quot;},&quot;outlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;quality&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;high&quot;,&quot;options&quot;:[&quot;high&quot;,&quot;low&quot;],&quot;tsType&quot;:&quot;'high'|'low'&quot;,&quot;section&quot;:&quot;Look&quot;}}">
class Component extends DCLogic {
  state = { ready: false, error: null, vw: 1200, vh: 800, hud: null, hi: { pad: false, menu: false, split: false, bar: 0 } };
  stageRef = React.createRef();
  coarse() { return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches); }
  opts() { return { outlines: this.props.outlines ?? true, followCam: this.props.followCam ?? true, quality: this.props.quality ?? (this.coarse() ? 'low' : 'high') }; }
  onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });
  onHud = hi => this.setState({ hi });
  async componentDidMount() {
    window.addEventListener('resize', this.onResize); this.onResize();
    import(new URL('engine/save.js', document.baseURI).href).then(m => { this.save = m.save; this.forceUpdate(); }).catch(() => {});
    try {
      const mod = await import(new URL('meru-spacedock.js', document.baseURI).href);
      if (this.unmounted) return;
      this.game = await mod.createDock({ container: this.stageRef.current, options: this.opts(), onState: hud => this.setState({ hud }), onNavigate: url => { window.location.href = encodeURI(url); } });
      this.setState({ ready: true });
    } catch (e) { console.error(e); this.setState({ error: 'Could not start 3D: ' + (e && e.message || e) }); }
  }
  componentDidUpdate() { if (this.game) this.game.setOptions(this.opts()); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); this.unmounted = true; if (this.game) this.game.destroy(); }
  renderVals() {
    const S = this.state, { hud, vw, vh, error, ready } = S, g = this.game;
    const h = hud || { quest: {}, items: [] };
    const blur = e => e && e.currentTarget && e.currentTarget.blur && e.currentTarget.blur();
    const phone = Math.min(vw, vh) < 520, land = phone && vw > vh, bar = S.hi.bar || 0, sv = this.save && this.save.data;
    const pr = h.prompt, free = h.phase === 'free';
    const stdHud = { hp: 100, hpMax: 100, en: 100, gold: sv ? sv.gold : 0, hour: 12, day: sv && sv.stats ? sv.stats.worldDay || 1 : 1, items: h.items || [], place: 'Meru · Meru Dock', quest: { text: (h.quest && h.quest.title ? h.quest.title + ' · ' : '') + (h.quest && h.quest.text || '') }, prompt: free && h.talk && !h.dialog && !pr ? 'Talk to ' + h.talk : null, toast: h.toast, muted: !!h.muted, weather: 'Clear', boat: false, inCave: true, weapons: [], dialog: h.dialog };
    return {
      stageRef: this.stageRef, engine: g, stdHud, hud: h,
      started: !!hud && h.phase !== 'start', hudBusy: !!pr || !free, onHud: this.onHud,
      stageTop: S.hi.split ? 'calc(' + bar + 'px + (100% - ' + bar + 'px) / 2)' : bar + 'px',
      dockKeys: [['WASD', 'move'], ['Drag', 'look'], ['E', 'talk'], ['Space', 'jump'], ['M', 'map'], ['I', 'menu'], ['Wheel', 'zoom']],
      skipKeys: ['KeyT', 'KeyO', 'KeyH', 'KeyV'],
      showSkip: !!hud && ['flying', 'settling', 'stepping'].includes(h.phase), skip: e => { blur(e); g && g.skip(); },
      showNote: !!h.note && !pr && !S.hi.menu, noteTop: phone ? (land ? '56px' : '38%') : '96px',
      showPrompt: !!pr, prAlign: phone && !land ? 'flex-end' : 'center', prPad: phone ? '12px' : '32px', prInner: phone ? '20px' : '32px', prTitle: land ? '30px' : phone ? '36px' : '48px',
      promptButtons: pr ? pr.buttons.map((label, i) => ({ label, bg: i ? '#ec3013' : '#000', fg: '#fff', bd: i ? '#ec3013' : '#ffd23a', pick: e => { blur(e); g && g.promptPick(i); } })) : [],
      showStart: !hud || h.phase === 'start' || !!error,
      startTitle: h.won ? 'King Might has escaped' : 'Meru Dock',
      startBody: h.won ? 'The light puts you down on the teleporter. Your flagship is in her berth at the end of the gantry.' : 'Your ship is coming in to the dock above Meru, on the day of King Might\u2019s Birthday.',
      startLabel: !ready ? 'Loading…' : h.won ? 'Continue' : 'Dock', notReady: !ready,
      start: e => { blur(e); g && g.start(); },
      hasError: !!error, error,
    };
  }
}
</script>
</body>
</html>
