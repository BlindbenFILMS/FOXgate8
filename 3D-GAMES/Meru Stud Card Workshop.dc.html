<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Workshop · Five Card Stud</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&amp;display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#12060c}a{color:#ffd23a}a:hover{color:#ec3013}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ffd23a;outline-offset:2px}input[type=color]{-webkit-appearance:none;appearance:none;padding:0;border:2px solid #ffffff;border-radius:0;width:56px;height:40px;background:none;cursor:pointer}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:0}input[type=range]{accent-color:#ffd23a}</style>
</helmet>
<div ref="{{ rootRef }}" style="position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#12060c;color:#ffffff;font-family:Archivo, Arial, sans-serif;display:flex;flex-direction:column" data-screen-label="Card Workshop">
  <div style="flex:none;display:flex;align-items:center;gap:8px;padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));border-bottom:2px solid #3a3836;background:#000000">

      <span style="font:800 11px Archivo, sans-serif;letter-spacing:0.1em;color:#ffd23a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">FIVE CARD STUD · MERU CASINO</span>
    </div>
    <div style="flex:1"></div>
    <button onClick="{{ doSave }}" disabled="{{ notReady }}" style="min-height:44px;padding:0 14px;border:0;border-radius:0;background:{{ saveBg }};color:#ffffff;font:900 13px Archivo, sans-serif;letter-spacing:0.1em;cursor:pointer;white-space:nowrap" style-hover="filter:brightness(1.12)">{{ saveTxt }}</button>
  </div>

  <div style="flex:1;min-height:0;display:flex;flex-direction:{{ dir }}">
    <div style="flex:{{ prevFlex }};min-height:0;min-width:0;display:flex;flex-direction:column;background:#1c0a12;border-bottom:{{ prevBorderB }};border-right:{{ prevBorderR }}">
      <div ref="{{ stageRef }}" aria-label="Card previews" style="flex:1;min-height:0;display:flex;align-items:center;gap:12px;padding:12px;overflow-x:auto;overflow-y:hidden;flex-wrap:{{ wrap }};justify-content:{{ justify }};align-content:center"></div>
      <div role="group" aria-label="Play an animation" style="flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid #3a3836">

      </div>

      <div role="tablist" aria-label="What to edit" style="flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:2px solid #3a3836">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5"><button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.go }}" style="min-height:46px;border:0;border-right:{{ t.sep }};border-radius:0;background:{{ t.bg }};color:{{ t.fg }};font:900 11px Archivo, sans-serif;letter-spacing:0.08em;cursor:pointer">{{ t.label }}</button></sc-for>
      </div>
      <div style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch">

          <sc-if value="{{ r.isColor }}" hint-placeholder-val="{{ true }}"><label style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #2a2826;min-height:52px"><span style="flex:1;font:800 13px Archivo, sans-serif">{{ r.label }}</span><span style="font:700 11px Archivo, sans-serif;color:#9b958f;letter-spacing:0.06em;text-transform:uppercase">{{ r.val }}</span><input type="color" value="{{ r.val }}" onChange="{{ r.on }}" aria-label="{{ r.label }}"></label></sc-if>
          <sc-if value="{{ r.isText }}" hint-placeholder-val="{{ false }}"><label style="display:flex;flex-direction:column;gap:4px;padding:8px 12px;border-bottom:1px solid #2a2826"><span style="font:800 13px Archivo, sans-serif">{{ r.label }}</span><input value="{{ r.val }}" onChange="{{ r.on }}" onKeyDown="{{ stopKey }}" maxlength="28" spellcheck="false" style="min-height:44px;padding:0 10px;border:2px solid #3a3836;border-radius:0;background:#1a1918;color:#ffffff;font:900 15px Archivo, sans-serif;letter-spacing:0.06em;outline:none;box-sizing:border-box"></label></sc-if>

          <sc-if value="{{ r.isRange }}" hint-placeholder-val="{{ false }}"><label style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #2a2826;min-height:52px"><span style="flex:1;font:800 13px Archivo, sans-serif">{{ r.label }}</span><input type="range" min="{{ r.min }}" max="{{ r.max }}" step="{{ r.step }}" value="{{ r.val }}" onChange="{{ r.on }}" aria-label="{{ r.label }}" style="width:42%"><span style="width:36px;text-align:right;font:900 13px Archivo, sans-serif;color:#ffd23a">{{ r.val }}</span></label></sc-if>

      </div>
      <sc-if value="{{ impOn }}" hint-placeholder-val="{{ false }}">
        <div style="flex:none;border-top:2px solid #ffd23a;padding:10px 12px;display:flex;flex-direction:column;gap:8px">

          <textarea value="{{ impText }}" onChange="{{ impType }}" onKeyDown="{{ stopKey }}" rows="4" spellcheck="false" aria-label="Style JSON" style="width:100%;box-sizing:border-box;border:2px solid #3a3836;border-radius:0;background:#1a1918;color:#ffffff;font:700 12px ui-monospace, monospace;padding:8px;resize:vertical"></textarea>

      </div>
    </div>
  </div>

    <div style="position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;padding:16px;box-sizing:border-box;background:#12060c">
      <div style="display:flex;flex-direction:column;gap:6px;max-width:440px">
        <div style="font:900 11px Archivo, sans-serif;letter-spacing:0.14em;color:#ffd23a">CARD WORKSHOP</div>
        <div style="font:900 26px Archivo, sans-serif;line-height:1">{{ loadHead }}</div>
        <div style="font:700 13px Archivo, sans-serif;line-height:1.4;color:#e7e2dc">{{ loadTxt }}</div>

      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

      if (d.type === 'text') return { ...base, val: String(val ?? ''), on: e => this.setVal(d.path, String(e.target.value || '').toUpperCase().slice(0, 28)) };
      if (d.type === 'range') return { ...base, val: +val, min: d.min, max: d.max, step: d.step, on: e => this.setVal(d.path, +e.target.value) };
      return { ...base, pressed: !!val, chip: val ? 'ON' : 'OFF', chipBg: val ? '#ffd23a' : '#2a2826', chipFg: val ? '#000000' : '#cfcac4', on: e => { blur(e); this.setVal(d.path, !val); } }; });
    const plays = [['auto', 'AUTO'], ['wave', 'WAVE'], ['wink', 'WINK'], ['grin', 'GRIN'], ['fly', 'LAUNCH']].map(([k, label], i) => ({ k, label, pressed: k === 'auto' ? S.play === 'auto' : false, bg: k === 'auto' && S.play === 'auto' ? '#ffd23a' : '#000000', fg: k === 'auto' && S.play === 'auto' ? '#000000' : '#ffffff', sep: i < 4 ? '2px solid #3a3836' : '0', on: e => { blur(e); this.playNow(k); } }));
    return {
      rootRef: this.rootRef, stageRef: this.stageRef, dir: land ? 'row' : 'column', prevFlex: land ? '1 1 58%' : '0 0 42%', ctrlFlex: land ? '0 0 min(420px, 42%)' : '1 1 auto',
      prevBorderB: land ? '0' : '2px solid #3a3836', prevBorderR: land ? '2px solid #3a3836' : '0', wrap: land ? 'wrap' : 'nowrap', justify: land ? 'center' : 'flex-start',
      gameHref: 'Meru Five Card Stud.dc.html', plays, rows, stopKey: e => e.stopPropagation(),
      tabs: tabKeys.map((k, i) => ({ k, label: TABS[k].label, on: S.tab === k, bg: S.tab === k ? '#ffd23a' : '#000000', fg: S.tab === k ? '#000000' : '#ffffff', sep: i < tabKeys.length - 1 ? '2px solid #3a3836' : '0', go: e => { blur(e); this.setState({ tab: k }); } })),
      notReady: !S.ready, saveBg: S.saved ? '#2a2826' : '#ec3013', saveTxt: S.saved ? 'IN GAME ✓' : 'SAVE',
      doSave: e => { blur(e); const ok = this.CA.saveStyle(S.style); this.setState({ saved: ok, msg: ok ? 'These cards are in the game on this device. An open poker table changes over within a couple of seconds. Use EXPORT FILE to give them to every player.' : 'This browser would not let me save. Use EXPORT FILE instead.', msgCol: ok ? '#86efac' : '#ff9a8a' }); },
      doExport: async e => { blur(e); const txt = JSON.stringify(S.style, null, 2); let copied = false; try { await navigator.clipboard.writeText(txt); copied = true; } catch (er) {}
        try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = 'stud-cards.json'; document.body.appendChild(a); a.click(); a.remove(); } catch (er) {}
        this.setState({ msg: 'stud-cards.json ' + (copied ? 'downloaded and copied. ' : 'downloaded. ') + 'Put it in minigames/meru/ in the game folder and every player gets these cards.', msgCol: '#86efac' }); },
      doImport: e => { blur(e); this.setState({ imp: true, impText: '' }); }, impOn: S.imp, impText: S.impText, impType: e => this.setState({ impText: e.target.value }),
      impApply: e => { blur(e); try { const o = JSON.parse(S.impText); this.setState({ imp: false }); this.apply(o, 'Style loaded and sent to the game on this device.'); } catch (er) { this.setState({ msg: 'That is not a style file. Paste the whole stud-cards.json text.', msgCol: '#ff9a8a' }); } },
      impClose: e => { blur(e); this.setState({ imp: false }); },
      doReset: e => { blur(e); this.apply(this.CA.DEFAULT_CARD_STYLE, 'Back to the original cards, in the game too.'); },
      doClear: e => { blur(e); this.CA.clearSavedStyle(); this.setState({ msg: 'Unsaved. The table goes back to stud-cards.json, or the original cards if there is no file. Your next edit saves again.', msgCol: '#cfcac4', saved: false }); },
      msgOn: !!S.msg, msg: S.msg, msgCol: S.msgCol,
      loadOn: !S.ready, loadHead: S.err ? 'The workshop did not load' : 'Laying out the deck…', loadTxt: S.err ? S.err + '. Check that vendor/three, fox-kit.js and minigames/meru/stud-cards.js sit beside this page.' : 'Kane is photographing the fox portraits.', errOn: !!S.err,
      retry: e => { blur(e); this.boot(); },
    };
  }
}
</script>
