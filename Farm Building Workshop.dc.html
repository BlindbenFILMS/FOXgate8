<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#201e1d}a{color:#f3f2f2}a:hover{color:var(--color-accent)}button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}</style>
</helmet>
<div style="position:fixed;inset:0;display:flex;flex-direction:column;font-family:var(--font-body);color:var(--color-bg);background:var(--color-text)" data-screen-label="Farm Building Workshop">
  <div style="display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:2px;padding:10px 14px;border-bottom:2px solid var(--color-bg);flex:none">
    <div style="font-family:var(--font-heading);font-weight:800;font-size:18px;letter-spacing:0.02em">FARM BUILDING WORKSHOP</div>
    <div style="font-size:13px;text-wrap:pretty">The 7 trade buildings of the Player Planet · drag to turn · pinch or scroll to zoom</div>
  </div>
  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow-y:auto;align-content:stretch">
    <div ref="{{ stage }}" style="flex:1 1 420px;min-height:300px;position:relative;cursor:grab"></div>
    <div style="flex:1 1 300px;max-width:100%;max-height:100%;min-height:0;overflow-y:auto;border-left:2px solid var(--color-bg);display:flex;flex-direction:column">
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:2px solid var(--color-bg)">
        <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="8">
          <button onClick="{{ k.pick }}" style="min-height:52px;padding:6px 12px;text-align:left;font:800 14px var(--font-body);letter-spacing:0.04em;background:{{ k.bg }};color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;cursor:pointer" style-hover="background:var(--color-accent-900)" style-active="background:var(--color-accent-700)">{{ k.name }}</button>
        </sc-for>
      </div>
      <div style="padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--color-bg)">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:22px">{{ selName }}</div>
        <div style="font-size:15px;line-height:1.4;text-wrap:pretty">{{ selWhy }}</div>
        <div style="font-size:13px;font-weight:700;letter-spacing:0.04em">{{ selSize }}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr))">
        <button onClick="{{ front }}" style="min-height:52px;padding:8px 14px;text-align:left;font:800 14px var(--font-body);background:transparent;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;cursor:pointer" style-hover="background:var(--color-accent-900)" style-active="background:var(--color-accent-700)">FRONT VIEW</button>
        <button onClick="{{ spin }}" style="min-height:52px;padding:8px 14px;text-align:left;font:800 14px var(--font-body);background:transparent;color:#f3f2f2;border:0;border-bottom:2px solid #f3f2f2;cursor:pointer" style-hover="background:var(--color-accent-900)" style-active="background:var(--color-accent-700)">SPIN · {{ spinTxt }}</button>
        <button onClick="{{ dayNight }}" style="min-height:52px;padding:8px 14px;text-align:left;font:800 14px var(--font-body);background:transparent;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;cursor:pointer" style-hover="background:var(--color-accent-900)" style-active="background:var(--color-accent-700)">{{ dayTxt }}</button>
        <a href="Player Planet.dc.html" style="min-height:52px;padding:8px 14px;display:flex;align-items:center;font:800 14px var(--font-body);color:#f3f2f2;text-decoration:none;border-bottom:2px solid #f3f2f2;background:var(--color-accent)" style-hover="background:var(--color-accent-600)">PLAYER PLANET</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sel: 'apiary', all: false, spin: true, day: true, ready: false };
  stage = React.createRef();
  async componentDidMount() {
    const m = await import('./worlds/farm-workshop.js?v=s601e');
    if (this.unmounted) return;
    this.ws = m.startFarmWorkshop(this.stage.current); window.__farmWorkshop = this.ws;
    this.setState({ ready: true });
  }
  componentWillUnmount() { this.unmounted = true; this.ws && this.ws.destroy(); }
  renderVals() {
    const ws = this.ws, { sel, all } = this.state, keys = ws ? ws.keys : ['apiary', 'greenhouse', 'sheepfold', 'goatshed', 'camelpen', 'weaver', 'kiln'];
    const nm = k => ws ? ws.name(k) : k.toUpperCase(), sz = ws && ws.size(sel);
    const kinds = keys.map(k => ({ name: nm(k), bg: !all && k === sel ? '#ec3013' : 'transparent', pick: () => { ws && ws.pick(k); this.setState({ sel: k, all: false }); } }));
    kinds.push({ name: 'ALL IN A ROW', bg: all ? '#ec3013' : 'transparent', pick: () => { ws && ws.showAll(); this.setState({ all: true }); } });
    return {
      stage: this.stage, kinds,
      selName: all ? 'ALL 7 BUILDINGS' : nm(sel),
      selWhy: all ? 'Side by side at their real sizes, doors facing you.' : ws ? ws.why(sel) : '',
      selSize: all || !sz ? '' : sz[0] + ' x ' + sz[1] + ' M FOOTPRINT · ' + sz[2] + ' M TALL',
      spinTxt: this.state.spin ? 'ON' : 'OFF', dayTxt: this.state.day ? 'DAY · TAP FOR NIGHT' : 'NIGHT · TAP FOR DAY',
      front: () => { ws && ws.front(); this.setState({ spin: false }); },
      spin: () => { if (ws) this.setState({ spin: ws.toggleSpin() }); },
      dayNight: () => { const d = !this.state.day; ws && ws.setTime(d); this.setState({ day: d }); }
    };
  }
}
</script>
</body>
</html>
