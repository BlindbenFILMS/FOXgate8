<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#03040a}a{color:#f3f2f2}a:hover{color:var(--color-accent)}button:focus-visible,input:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}input[type=range]{accent-color:#ec3013}</style>
</helmet>
<div style="position:relative;width:100%;height:100vh;height:100dvh;display:flex;overflow:hidden;background:#03040a;font-family:var(--font-body)" data-screen-label="Space Battle Workshop">
  <div style="position:relative;flex:1 1 auto;min-width:0;height:100%">
    <iframe ref="{{ frameRef }}" src="Space Map.dc.html?arena=vmoth" title="Battle arena" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#03040a"></iframe>
    <sc-if value="{{ showTuneBtn }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ openSheet }}" style="position:absolute;right:max(10px, env(safe-area-inset-right));top:calc(max(10px, env(safe-area-inset-top)) + 120px);min-width:96px;height:48px;padding:0 14px;border:2px solid #f3f2f2;border-radius:0;background:#201e1d;color:#f3f2f2;font:900 15px var(--font-heading);letter-spacing:0.08em;text-align:left;cursor:pointer;z-index:5" style-active="background:var(--color-accent-700)">TUNE</button>
    </sc-if>
  </div>
  <sc-if value="{{ panelOn }}" hint-placeholder-val="{{ true }}">
    <div style="background:#201e1d;color:#f3f2f2;display:flex;flex-direction:column;box-sizing:border-box;z-index:6;position:{{ ps.pos }};left:{{ ps.l }};right:{{ ps.r }};top:{{ ps.t }};bottom:{{ ps.b }};width:{{ ps.w }};height:{{ ps.h }};flex:{{ ps.flex }};border-left:{{ ps.bl }};border-top:{{ ps.bt }};padding-bottom:{{ ps.pb }}">
      <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid #f3f2f2;flex:0 0 auto">
        <div style="display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0">
          <span style="font:900 20px var(--font-heading);letter-spacing:0.02em;color:#f3f2f2">BATTLE WORKSHOP</span>
          <span style="font:700 14px var(--font-heading);letter-spacing:0.08em;color:#ec3013">ENEMY · {{ enemyName }}</span>
        </div>
        <sc-if value="{{ showClose }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ closeSheet }}" aria-label="Close" style="width:48px;height:48px;border:2px solid #f3f2f2;border-radius:0;background:transparent;color:#f3f2f2;font:900 20px var(--font-heading);cursor:pointer" style-hover="background:var(--color-accent-900)" style-active="background:var(--color-accent-700)">✕</button>
        </sc-if>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:2px solid #f3f2f2;flex:0 0 auto;min-width:0">
        <span style="font:900 13px var(--font-heading);letter-spacing:0.12em;color:#f3f2f2">SUMMON WHO · SWIPE FOR MORE</span>
        <div style="display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:thin">
          <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="2">
            <button onClick="{{ k.pick }}" style="flex:0 0 auto;white-space:nowrap;min-height:44px;padding:0 12px;border:2px solid #f3f2f2;border-radius:0;background:{{ k.bg }};color:{{ k.fg }};font:900 13px var(--font-heading);letter-spacing:0.06em;text-align:left;cursor:pointer" style-active="background:var(--color-accent-700)">{{ k.label }}</button>
          </sc-for>
        </div>
        <div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px">
          <button onClick="{{ summon }}" style="height:48px;padding:0 14px;border:2px solid #ec3013;border-radius:0;background:#ec3013;color:#f3f2f2;font:900 17px var(--font-heading);letter-spacing:0.08em;text-align:left;cursor:pointer" style-hover="background:var(--color-accent-600)" style-active="background:var(--color-accent-700)">SUMMON</button>
          <button onClick="{{ clear }}" style="height:48px;padding:0 12px;border:2px solid #f3f2f2;border-radius:0;background:transparent;color:#f3f2f2;font:900 14px var(--font-heading);letter-spacing:0.06em;text-align:left;cursor:pointer" style-hover="background:var(--color-accent-900)" style-active="background:var(--color-accent-700)">CLEAR ALL</button>
          <button onClick="{{ kill }}" style="height:48px;padding:0 12px;border:2px solid #f3f2f2;border-radius:0;background:transparent;color:#f3f2f2;font:900 14px var(--font-heading);letter-spacing:0.06em;text-align:left;cursor:pointer" style-hover="background:var(--color-accent-900)" style-active="background:var(--color-accent-700)">DEFEAT</button>
        </div>
        </div>
      <div style="flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 16px">
        <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:12px;padding:14px 0;border-bottom:2px solid #f3f2f2">
            <span style="font:900 14px var(--font-heading);letter-spacing:0.12em;color:#ec3013">{{ sec.name }}</span>
            <sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="3">
              <label style="display:flex;flex-direction:column;gap:6px">
                <span style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><span style="font:700 15px var(--font-heading);color:#f3f2f2;letter-spacing:0.02em">{{ r.label }}</span><span style="font:900 16px var(--font-heading);color:{{ r.valCol }};min-width:44px;text-align:right">{{ r.val }}</span></span>
                <input type="range" min="{{ r.min }}" max="{{ r.max }}" step="{{ r.step }}" value="{{ r.v }}" onInput="{{ r.set }}" style="width:100%;height:32px;margin:0;cursor:pointer">
              </label>
            </sc-for>
          </div>
        </sc-for>
        <div style="display:flex;flex-direction:column;gap:10px;padding-top:14px">
          <button onClick="{{ reset }}" style="height:48px;padding:0 14px;border:2px solid #f3f2f2;border-radius:0;background:transparent;color:#f3f2f2;font:900 14px var(--font-heading);letter-spacing:0.08em;text-align:left;cursor:pointer" style-hover="background:var(--color-accent-900)" style-active="background:var(--color-accent-700)">{{ resetLabel }}</button>
          <span style="font:700 13px var(--font-heading);letter-spacing:0.06em;color:#7fd0ff">YOU ARE INVINCIBLE IN THE ARENA</span>
          <span style="font:500 14px/1.4 var(--font-body);color:#f3f2f2;text-wrap:pretty">Every change applies live and is saved; the real Space Map uses the same numbers. Yellow = changed from the default.</span>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { vw: 1200, vh: 800, open: false, god: false, P: null, vals: null };
  frameRef = React.createRef();
  async componentDidMount() {
    this.onResize = () => this.setState({ vw: innerWidth, vh: innerHeight }); this.onResize(); addEventListener('resize', this.onResize);
    try { const M = await import(new URL('worlds/space-battle-tune.js?v=s598y', location.href).href); this.M = M; this.setState({ all: M.loadTune() }); } catch (e) { console.warn('tune', e); }
  }
  componentWillUnmount() { removeEventListener('resize', this.onResize); }
  post(msg) { const f = this.frameRef.current; try { f && f.contentWindow && f.contentWindow.postMessage({ type: '8g:arena', fam: this.fam(), ...msg }, '*'); } catch (e) {} }
  fam() { return (this.state.kind && this.state.kind.fam) || 'vmoth'; }
  setVal(k, v, f0) { const f = f0 || this.fam(), vals = { ...(this.state.all || {})[f], [k]: v }; this.setState({ all: { ...this.state.all, [f]: vals } }); this.M.saveTune(f, vals); this.post({ cmd: 'tune' }); }
  renderVals() {
    const S = this.state, narrow = S.vw < 760, portrait = S.vh > S.vw, fam = this.fam(), E = this.M ? this.M.ENEMIES[fam] : null, P = E ? E.params : [], V = (S.all || {})[fam] || {};
    const dec = st => (String(st).split('.')[1] || '').length;
    const secs = [], groups = fam === 'pirPair' ? [['pirPair', ''], ['pirGunner', 'CIRCLER · '], ['pirFighter', 'FLY-BY · ']] : [[fam, '']];   /* s598t the PAIR shows both ships sliders */
    for (const [gf, pre] of groups) { const GE = this.M ? this.M.ENEMIES[gf] : null, GV = (S.all || {})[gf] || {}; for (const p of (GE ? GE.params : [])) { const nm = pre + p.sec; let s = secs.find(x => x.name === nm); if (!s) secs.push(s = { name: nm, rows: [] }); const v = GV[p.k] ?? p.def;
      s.rows.push({ label: p.label, min: p.min, max: p.max, step: p.step, v, val: Number(v).toFixed(dec(p.step)), valCol: v !== p.def ? '#ffd23a' : '#f3f2f2', set: e => this.setVal(p.k, parseFloat(e.target.value), gf) }); } }
    const rule = '2px solid #f3f2f2', A = 'auto';
    const ps = !narrow ? { pos: 'relative', l: A, r: A, t: A, b: A, w: '380px', h: '100%', flex: '0 0 380px', bl: rule, bt: '0', pb: '0' }
      : portrait ? { pos: 'absolute', l: '0', r: '0', t: A, b: '0', w: A, h: '58%', flex: 'none', bl: '0', bt: rule, pb: 'env(safe-area-inset-bottom)' }
      : { pos: 'absolute', l: A, r: '0', t: '0', b: '0', w: 'min(340px, 52vw)', h: A, flex: 'none', bl: rule, bt: '0', pb: '0' };
    return {
      frameRef: this.frameRef, sections: secs, panelOn: !narrow || S.open, showTuneBtn: narrow && !S.open, showClose: narrow, ps,
      openSheet: () => this.setState({ open: true }), closeSheet: () => this.setState({ open: false }),
      kinds: (() => { const out = []; const E = this.M ? this.M.ENEMIES : {}; for (const fam in E) for (const [role, label] of (E[fam].summon || [[null, E[fam].name]])) { const on = S.kind ? (S.kind.fam === fam && S.kind.role === role) : out.length === 0; out.push({ label, bg: on ? '#f3f2f2' : 'transparent', fg: on ? '#201e1d' : '#f3f2f2', pick: () => this.setState({ kind: { fam, role } }, () => this.post({ cmd: 'clear' })), fam, role, on }); } return out; })(),
      summon: () => { const k = S.kind || { fam: 'vmoth', role: 'circle' }; if (!S.kind) this.setState({ kind: k }); this.post({ cmd: 'spawn', n: 1, fam: k.fam, role: k.role }); },   /* s598i: one NPC per tap; the list grows as ships are added to ENEMIES */
      clear: () => this.post({ cmd: 'clear' }), kill: () => this.post({ cmd: 'kill' }),   /* s598m: watch the death animation */
      reset: () => { if (!this.M) return; const all = { ...S.all }; for (const f of (fam === 'pirPair' ? ['pirPair', 'pirGunner', 'pirFighter'] : [fam])) { const d = this.M.defaults(f); all[f] = d; this.M.saveTune(f, d); } this.setState({ all }); this.post({ cmd: 'tune' }); },
      enemyName: E ? E.name : 'VOID MOTH', resetLabel: 'RESET ' + (E ? E.name : 'VOID MOTH') + ' TO DEFAULTS',
    };
  }
}
</script>
</body>
</html>
