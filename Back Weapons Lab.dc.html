<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000000}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent)}button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}input[type=range]{accent-color:#ec3013}</style>
</helmet>
<div style="--color-bg:#000000;--color-text:#f3f2f2;--color-neutral-700:#b8b5b3;--color-accent-100:#3a0f08;position:fixed;inset:0;display:flex;flex-direction:column;font-family:var(--font-body);color:var(--color-text);background:var(--color-bg)" data-screen-label="Back Weapons Lab">
  <div style="display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;row-gap:2px;padding:10px 14px;border-bottom:2px solid var(--color-text)">
    <div style="font-family:var(--font-heading);font-weight:800;font-size:18px;letter-spacing:0.02em">BACK WEAPONS LAB · BEN</div>
    <div style="font-size:13px;color:var(--color-neutral-700)">{{ status }}</div>
  </div>
  <div style="flex:1;min-height:0;position:relative">
    <div ref="{{ stage }}" style="position:absolute;inset:0;touch-action:none"></div>
  </div>
  <div style="border-top:2px solid var(--color-text);max-height:46vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column">
    <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--color-text)">
      <button onClick="{{ onMelee }}" style="min-height:44px;padding:0 14px;text-align:left;font:800 14px var(--font-heading);background:{{ meleeBg }};color:{{ meleeFg }};border:0;border-right:2px solid var(--color-text);cursor:pointer">MELEE · ON THE BACK</button>
      <button onClick="{{ onRanged }}" style="min-height:44px;padding:0 14px;text-align:left;font:800 14px var(--font-heading);background:{{ rangedBg }};color:{{ rangedFg }};border:0;cursor:pointer">RANGED · WORN</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));border-bottom:2px solid var(--color-text)">
      <sc-for list="{{ weapons }}" as="w" hint-placeholder-count="8">
        <button onClick="{{ w.pick }}" style="min-height:48px;padding:0 12px;text-align:left;font:700 13px var(--font-body);background:{{ w.bg }};color:{{ w.fg }};border:0;border-right:2px solid var(--color-text);border-bottom:2px solid var(--color-text);margin:0 -2px -2px 0;cursor:pointer" style-hover="background:var(--color-accent-100)">{{ w.name }}</button>
      </sc-for>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px;border-bottom:2px solid var(--color-text)">
      <button onClick="{{ onAll }}" style="min-height:44px;padding:0 14px;text-align:left;font:700 13px var(--font-body);background:{{ allBg }};color:{{ allFg }};border:2px solid var(--color-text);cursor:pointer">SHOW ALL {{ count }}</button>
      <button onClick="{{ onHand }}" style="min-height:44px;padding:0 14px;text-align:left;font:700 13px var(--font-body);background:{{ handBg }};color:{{ handFg }};border:2px solid var(--color-text);cursor:pointer">{{ handLabel }}</button>
      <button onClick="{{ onSwing }}" style="min-height:44px;min-width:120px;padding:0 14px;text-align:left;font:800 14px var(--font-heading);background:var(--color-accent);color:#ffffff;border:2px solid var(--color-accent);cursor:pointer" style-hover="background:var(--color-accent-700);border-color:var(--color-accent-700)">{{ swingLabel }}</button>
      <button onClick="{{ onView }}" style="min-height:44px;padding:0 14px;text-align:left;font:700 13px var(--font-body);background:transparent;color:var(--color-text);border:2px solid var(--color-text);cursor:pointer" style-hover="background:var(--color-accent-100)">VIEW · {{ viewLabel }}</button>
      <button onClick="{{ onSpin }}" style="min-height:44px;padding:0 14px;text-align:left;font:700 13px var(--font-body);background:transparent;color:var(--color-text);border:2px solid var(--color-text);cursor:pointer" style-hover="background:var(--color-accent-100)">{{ spinLabel }}</button>
      <sc-if value="{{ canFit }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ onReset }}" style="min-height:44px;padding:0 14px;text-align:left;font:700 13px var(--font-body);background:var(--color-accent);color:#ffffff;border:2px solid var(--color-accent);cursor:pointer">RESET {{ selName }}</button>
      </sc-if>
    </div>
    <sc-if value="{{ canFit }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));column-gap:16px;padding:6px 14px 10px">
        <sc-for list="{{ sliders }}" as="s" hint-placeholder-count="5">
          <label style="display:grid;grid-template-columns:86px minmax(0,1fr) 48px;align-items:center;gap:8px;min-height:40px;font:700 12px var(--font-body)">
            <span>{{ s.label }}</span>
            <input type="range" min="{{ s.min }}" max="{{ s.max }}" step="{{ s.step }}" value="{{ s.v }}" onInput="{{ s.set }}" style="width:100%"></input>
            <span style="color:var(--color-neutral-700);font-weight:400">{{ s.txt }}</span>
          </label>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false, sel: 'racket', all: false, vi: 0, spin: false, n: 0, mode: 'melee' };
  stage = React.createRef();
  views = ['back', 'three', 'side'];
  names = { back: 'BACK', three: '3/4', side: 'SIDE' };
  async componentDidMount() {
    const m = await import('./engine/back-weapons-lab.js?v=s662i');
    this.lab = await m.startBackLab(this.stage.current); window.__backLab = this.lab; this.setState({ ready: true });
    let rg = /[?&]mode=ranged/.test(location.search); try { if (sessionStorage.getItem('backlab.mode') === 'ranged') { rg = true; sessionStorage.removeItem('backlab.mode'); } } catch (e) {}
    if (rg) { this.lab.setMode('ranged'); this.setState({ mode: 'ranged', sel: this.lab.sel, all: false, vi: 0 }); }   // s339: open on RANGED
  }
  componentWillUnmount() { this.lab && this.lab.destroy(); }
  renderVals() {
    const L = this.lab, s = this.state, W = L ? L.weapons : [];
    const cur = W.find(w => w.key === s.sel), f = L && L.fit()[s.sel];
    const set = (k, v) => { L.setFit(s.sel, { [k]: v }); this.setState({ n: s.n + 1 }); };
    const SL = [['x', 'LEFT / RIGHT', -0.6, 0.6, 0.005, v => v.toFixed(2)], ['y', 'UP / DOWN', 0.6, 1.8, 0.01, v => v.toFixed(2)], ['z', 'IN / OUT', -0.75, 0.3, 0.005, v => v.toFixed(2)], ['ang', 'ANGLE', -180, 180, 1, v => Math.round(v) + '°'], ['lean', 'TILT', -90, 110, 1, v => Math.round(v) + '°'], ['twist', 'TWIST', -180, 180, 1, v => Math.round(v || 0) + '°'], ['s', 'SIZE', 0.6, 1.5, 0.01, v => Math.round(v * 100) + '%']];
    const hf = L && s.hand && !s.all ? L.hold(s.sel) : null, dg = v => Math.round(v) + '°';
    const HL = [['ax', 'ARM UP', -160, 40, 1, dg], ['az', 'ARM OUT', -20, 90, 1, dg], ['el', 'ELBOW', -150, 0, 1, dg], ['ro', 'ROLL', -90, 90, 1, dg], ['sd', 'SIDE', -30, 30, 1, dg], ['fl', 'WRIST', -60, 60, 1, dg], ['tw', 'TWIST', -180, 180, 1, dg], ['sl', 'SLIDE', -0.6, 0.6, 0.01, v => v.toFixed(2)], ...(s.sel === 'staffR' ? [['lean', 'LEAN OUT', -30, 40, 1, dg]] : [])];
    const m2 = v => v.toFixed(2), HL2 = [['x', 'SIDE (R → L)', -0.7, 0.4, 0.01, m2], ['y', 'HEIGHT', 0.6, 1.7, 0.01, m2], ['z', 'FORWARD', 0, 0.7, 0.01, m2], ['yaw', 'TURN', -90, 120, 1, dg], ['pitch', 'TILT UP', -70, 80, 1, dg], ['roll', 'ROLL', -180, 180, 1, dg]];
    return {
      stage: this.stage, count: W.length,
      onMelee: () => { if (!L) return; L.setMode('melee'); this.setState({ mode: 'melee', sel: L.sel, all: false, vi: 0, hand: false }); }, onRanged: () => { if (!L) return; L.setMode('ranged'); this.setState({ mode: 'ranged', sel: L.sel, all: false, vi: 1, hand: false }); },
      meleeBg: s.mode === 'melee' ? 'var(--color-text)' : 'transparent', meleeFg: s.mode === 'melee' ? 'var(--color-bg)' : 'var(--color-text)', rangedBg: s.mode === 'ranged' ? 'var(--color-text)' : 'transparent', rangedFg: s.mode === 'ranged' ? 'var(--color-bg)' : 'var(--color-text)',
      status: !s.ready ? 'Loading Ben…' : s.all ? 'All ' + W.length + ' side by side · drag to turn' : (cur ? cur.name + ' · ' + cur.from : '') + ' · drag to turn',
      weapons: W.map(w => ({ name: w.name, bg: !s.all && w.key === s.sel ? 'var(--color-text)' : 'transparent', fg: !s.all && w.key === s.sel ? 'var(--color-bg)' : 'var(--color-text)', pick: () => { L.pick(w.key); this.setState({ sel: w.key, all: false }); } })),
      onAll: () => { if (!L) return; this.setState({ all: L.showAll() }); }, allBg: s.all ? 'var(--color-text)' : 'transparent', allFg: s.all ? 'var(--color-bg)' : 'var(--color-text)',
      onView: () => { const vi = (s.vi + 1) % this.views.length; this.setState({ vi }); L && L.view(this.views[vi]); }, viewLabel: this.names[this.views[s.vi]],
      onSwing: () => { if (!L) return; L.swing(); if (!s.hand) this.setState({ hand: true }); }, swingLabel: s.mode === 'ranged' ? 'FIRE' : 'SWING',
      onHand: () => L && this.setState({ hand: L.hand() }), handLabel: s.hand ? 'IN HAND · ON' : 'IN HAND · OFF', handBg: s.hand ? 'var(--color-text)' : 'transparent', handFg: s.hand ? 'var(--color-bg)' : 'var(--color-text)',
      onSpin: () => L && this.setState({ spin: L.spin() }), spinLabel: s.spin ? 'TURNTABLE · ON' : 'TURNTABLE · OFF',
      canFit: !!(L && !s.all && (s.hand ? hf : f)), selName: (s.hand ? 'HOLD · ' : '') + (cur ? cur.name : ''),
      onReset: () => { if (s.hand) L.resetHold(s.sel); else L.resetFit(s.sel); this.setState({ n: s.n + 1 }); },
      sliders: s.hand ? (!hf ? [] : (L.holdKind(s.sel) === 'two' ? HL2 : HL).map(([k, label, min, max, step, fmt]) => ({ label, min, max, step, v: hf[k] ?? 0, txt: fmt(hf[k] ?? 0), set: e => { L.setHold(s.sel, { [k]: +e.target.value }); this.setState({ n: s.n + 1 }); } }))) : !f ? [] : SL.map(([k, label, min, max, step, fmt]) => ({ label, min, max, step, v: f[k] ?? 0, txt: fmt(f[k] ?? 0), set: e => set(k, +e.target.value) })),
    };
  }
}
</script>
</body>
</html>
