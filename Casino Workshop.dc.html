<style>html,body{margin:0;min-height:100%;background:#201e1d}a{color:var(--color-accent-300)}a:hover{color:var(--color-accent)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}svg,canvas{touch-action:none;user-select:none;-webkit-user-select:none}input[type=color]{-webkit-appearance:none;appearance:none;border:2px solid #f3f2f2;padding:0;width:44px;height:32px;background:none;cursor:pointer}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0}</style>

<div style="min-height:100dvh;background:#201e1d;font-family:var(--font-body);color:#f3f2f2;display:flex;flex-direction:column" data-screen-label="Casino Workshop">

      <button onClick="{{ vBoth }}" style="min-height:44px;border:0;background:{{ bgBoth }};color:{{ inkBoth }};font:800 13px var(--font-body);letter-spacing:0.06em;text-align:left;padding:0 14px;cursor:pointer">BOTH</button>
    </div>
    <a href="Meru 2 Blockout.dc.html?walk=1" style="display:flex;align-items:center;padding:0 16px;min-height:44px;font-weight:800;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;color:#f3f2f2;white-space:nowrap">Open Meru 2 →</a>

        <svg ref="{{ svgRef }}" viewBox="-151 -33 47 66" style="width:100%;height:auto;max-height:calc(100dvh - 90px);background:#2a1424;display:block" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" onPointerLeave="{{ onUp }}">

      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:2px solid #f3f2f2">
        <button onClick="{{ addSlot }}" style="min-height:44px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:700 13px var(--font-body);text-align:left;padding:0 10px;cursor:pointer;color:#f3f2f2">+ Slot</button>

        <button onClick="{{ addTop }}" style="min-height:44px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:700 13px var(--font-body);text-align:left;padding:0 10px;cursor:pointer;color:#f3f2f2">+ High-top</button>
        <button onClick="{{ addStatue }}" style="min-height:44px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:700 13px var(--font-body);text-align:left;padding:0 10px;cursor:pointer;color:#f3f2f2">+ Gold 8</button>
        <button onClick="{{ addKiosk }}" style="min-height:44px;border:0;background:transparent;font:700 13px var(--font-body);text-align:left;padding:0 10px;cursor:pointer;color:#f3f2f2">+ Kiosk</button>

      <div style="padding:12px 14px 4px;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-300)">Colours</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));border-bottom:2px solid #f3f2f2">
        <sc-for list="{{ colors }}" as="c" hint-placeholder-count="9">
          <label style="display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer">

          </label>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">
        <button onClick="{{ save }}" style="min-height:52px;border:0;border-right:2px solid #f3f2f2;background:var(--color-accent);color:#ffffff;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer">{{ saveLabel }}</button>
        <button onClick="{{ copy }}" style="min-height:52px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">{{ copyLabel }}</button>
        <button onClick="{{ reset }}" style="min-height:52px;border:0;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">Reset all</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
