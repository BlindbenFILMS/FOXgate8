<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;min-height:100%;background:#201e1d}a{color:var(--color-accent-300)}a:hover{color:var(--color-accent)}button:focus-visible,a:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}svg{touch-action:none;user-select:none;-webkit-user-select:none}</style>
</helmet>
<div style="min-height:100dvh;background:#201e1d;font-family:var(--font-body);color:#f3f2f2;display:flex;flex-direction:column">
  <div style="display:flex;align-items:stretch;border-bottom:2px solid #f3f2f2">
    <div style="padding:10px 14px;display:flex;flex-direction:column;gap:2px;border-right:2px solid #f3f2f2;flex:1;min-width:0">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-300)">Meru Lanes</div>
      <div style="font-family:var(--font-heading);font-size:20px;font-weight:800;line-height:1.05">Arcade Workshop</div>
    </div>
    <a href="Meru 2 Blockout.dc.html?walk=1" style="display:flex;align-items:center;padding:0 16px;min-height:44px;font-weight:800;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;color:#f3f2f2;white-space:nowrap">Open Meru 2 →</a>
  </div>
  <div style="display:flex;flex-wrap:wrap;flex:1;min-height:0">
    <div style="flex:1 1 380px;min-width:0;display:flex;align-items:flex-start;justify-content:center;padding:10px;border-bottom:2px solid #f3f2f2;box-sizing:border-box">
      <svg ref="{{ svgRef }}" viewBox="104 -39 47 50" style="width:100%;height:auto;max-height:calc(100dvh - 90px);background:#1b1830;display:block" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" onPointerLeave="{{ onUp }}" onPointerDown="{{ onBg }}">
        <sc-for list="{{ statics }}" as="s" hint-placeholder-count="0">
          <rect x="{{ s.x }}" y="{{ s.y }}" width="{{ s.w }}" height="{{ s.h }}" fill="{{ s.fill }}" stroke="#f3f2f2" stroke-width="0.06"></rect>
        </sc-for>
        <text x="127.2" y="-35.6" style="fill:#9a96b8;font-size:1.3px;font-weight:800;font-family:Archivo, sans-serif;pointer-events:none">LANES</text>
        <text x="108.4" y="-9.8" style="fill:#9a96b8;font-size:1.1px;font-weight:800;font-family:Archivo, sans-serif;pointer-events:none">SHOE DESK</text>
        <text x="129.6" y="8.8" style="fill:#ffffff;font-size:1.1px;font-weight:800;font-family:Archivo, sans-serif;pointer-events:none">DINER</text>
        <text x="105.6" y="-15.8" style="fill:#ec3013;font-size:1.1px;font-weight:800;font-family:Archivo, sans-serif;pointer-events:none">DOOR</text>
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="0">
          <g transform="{{ it.tf }}" onPointerDown="{{ it.down }}" style="cursor:grab">
            <rect x="{{ it.rx }}" y="{{ it.ry }}" width="{{ it.rw }}" height="{{ it.rh }}" fill="{{ it.fill }}" stroke="{{ it.stroke }}" stroke-width="{{ it.sw }}"></rect>
            <polygon points="{{ it.arrow }}" fill="#ffffff"></polygon>
          </g>
        </sc-for>
      </svg>
    </div>
    <div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;border-left:2px solid #f3f2f2;box-sizing:border-box">
      <div style="padding:14px;border-bottom:2px solid #f3f2f2;display:flex;flex-direction:column;gap:6px">
        <div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-300)">Selected</div>
        <div style="font-family:var(--font-heading);font-size:22px;font-weight:800;line-height:1.1">{{ selName }}</div>
        <div style="font-size:14px;font-variant-numeric:tabular-nums">{{ selInfo }}</div>
        <sc-if value="{{ selWarn }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:13px;font-weight:800;color:var(--color-accent-300)">Overlaps something. Move it clear so you can walk past.</div>
        </sc-if>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:2px solid #f3f2f2">
        <button onClick="{{ rotL90 }}" style="min-height:48px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">⟲ 90°</button>
        <button onClick="{{ rotL15 }}" style="min-height:48px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">⟲ 15°</button>
        <button onClick="{{ rotR15 }}" style="min-height:48px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">⟳ 15°</button>
        <button onClick="{{ rotR90 }}" style="min-height:48px;border:0;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">⟳ 90°</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:2px solid #f3f2f2">
        <button onClick="{{ nW }}" style="min-height:48px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">← W</button>
        <button onClick="{{ nN }}" style="min-height:48px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">↑ N</button>
        <button onClick="{{ nS }}" style="min-height:48px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">↓ S</button>
        <button onClick="{{ nE }}" style="min-height:48px;border:0;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">→ E</button>
      </div>
      <button onClick="{{ toWall }}" style="min-height:48px;border:0;border-bottom:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 14px;cursor:pointer;color:#f3f2f2">Back to nearest wall · face the room</button>
      <sc-if value="{{ selIsCab }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ cycleGame }}" style="min-height:48px;border:0;border-bottom:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 14px;cursor:pointer;color:#f3f2f2">Change game · {{ selGame }}</button>
      </sc-if>
      <div style="display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto;border-bottom:2px solid #f3f2f2">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <button onClick="{{ it.pick }}" style="min-height:44px;border:0;border-bottom:1px solid #5a5654;background:{{ it.rowBg }};font:700 14px var(--font-body);text-align:left;padding:0 14px;cursor:pointer;color:{{ it.rowInk }};display:flex;align-items:center;gap:10px">
            <span style="width:14px;height:14px;background:{{ it.fill }};flex:none"></span><span style="flex:1;min-width:0">{{ it.name }}</span><span style="font-variant-numeric:tabular-nums;font-weight:600">{{ it.short }}</span>
          </button>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">
        <button onClick="{{ save }}" style="min-height:52px;border:0;border-right:2px solid #f3f2f2;background:var(--color-accent);color:#ffffff;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer">{{ saveLabel }}</button>
        <button onClick="{{ copy }}" style="min-height:52px;border:0;border-right:2px solid #f3f2f2;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">{{ copyLabel }}</button>
        <button onClick="{{ reset }}" style="min-height:52px;border:0;background:transparent;font:800 14px var(--font-body);text-align:left;padding:0 12px;cursor:pointer;color:#f3f2f2">Reset all</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lay: null, sel: 'dance', saved: false, copied: false };
  svgRef = React.createRef();
  drag = null;
  GAMES = ['MARSH BLASTER', 'HUMAN COMBAT', 'TANK RANGE', 'SUBMARINE', 'SURF', 'DUSTY GULCH'];
  async componentDidMount() {
    try { const m = await import(new URL('worlds/meru2-funrooms.js', document.baseURI).href); this.mod = m; this.setState({ lay: m.lanesLayout() }); }
    catch (e) { console.warn('layout load failed', e); }
    this.onKey = e => { const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key]; if (k) { e.preventDefault(); this.nudge(k[0], k[1], e.shiftKey ? 1 : 0.25); } if (e.key === 'q') this.rot(-15); if (e.key === 'e') this.rot(15); };
    addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { removeEventListener('keydown', this.onKey); }
  SIZE = { dance: [2.8, 2.55], cab: [0.63, 0.67], pin: [0.55, 1.2], claw: [0.9, 0.9] };
  COL = { dance: '#ff3d9a', cab: '#7c3aed', pin: '#38bdf8', claw: '#facc15' };
  list(L) { const out = [{ id: 'dance', kind: 'dance', o: L.dance, name: 'Fox Dance (x2, back to back)' }];
    L.cabs.forEach((c, i) => out.push({ id: 'cab' + i, kind: 'cab', o: c, name: 'Cabinet ' + (i + 1) + ' · ' + c.game }));
    L.pins.forEach((c, i) => out.push({ id: 'pin' + i, kind: 'pin', o: c, name: 'Pinball ' + (i + 1) }));
    L.claws.forEach((c, i) => out.push({ id: 'claw' + i, kind: 'claw', o: c, name: 'Claw Crane ' + (i + 1) })); return out; }
  aabb(it) { const [hw, hd] = this.SIZE[it.kind], r = it.o.a * Math.PI / 180, c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r)), ex = hw * c + hd * s, ez = hw * s + hd * c; return [it.o.x - ex, it.o.x + ex, it.o.z - ez, it.o.z + ez]; }
  STATIC = [
    [126.45, 149.6, -37.6, -15.0, '#2a2648', 'LANES'], [115.35, 116.3, -36.8, -18.8, '#3a3448'], [108, 118, -9.45, -8.35, '#3a3448', 'SHOE DESK'], [108, 118, -5.95, -5.25, '#3a3448'],
    [124, 140, 6.95, 9.6, '#c42d3c', 'DINER'], [148.1, 149.6, 1.15, 5.25, '#3a3448'], [119, 120, -35.6, -32.6, '#c42d3c'], [119, 120, -28.0, -25.0, '#c42d3c'], [119, 120, -20.4, -17.4, '#c42d3c'],
    [111.45, 112.55, 1.45, 2.55, '#3a3448'], [117.45, 118.55, 1.45, 2.55, '#3a3448'], [111.45, 112.55, 5.95, 7.05, '#3a3448'], [117.45, 118.55, 5.95, 7.05, '#3a3448'], [126.45, 127.55, 1.45, 2.55, '#3a3448'], [134.45, 135.55, 1.45, 2.55, '#3a3448']];
  hits(a, b) { return a[0] < b[1] && a[1] > b[0] && a[2] < b[3] && a[3] > b[2]; }
  pt(e) { const svg = this.svgRef.current; if (!svg) return null; const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : null; }
  find(id) { const L = this.state.lay; if (!L) return null; return this.list(L).find(i => i.id === id) || null; }
  edit(fn) { const L = JSON.parse(JSON.stringify(this.state.lay)); const it = this.list(L).find(i => i.id === this.state.sel); if (!it) return; fn(it.o, it); this.setState({ lay: L, saved: false }); }
  nudge(dx, dz, s = 0.25) { this.edit(o => { o.x = Math.round((o.x + dx * s) * 100) / 100; o.z = Math.round((o.z + dz * s) * 100) / 100; }); }
  rot(d) { this.edit(o => { o.a = ((o.a + d) % 360 + 360) % 360; }); }
  renderVals() {
    const S = this.state, L = S.lay, blur = e => e && e.currentTarget && e.currentTarget.blur && e.currentTarget.blur();
    const statics = this.STATIC.map(([x0, x1, z0, z1, fill]) => ({ x: x0, y: z0, w: x1 - x0, h: z1 - z0, fill }));
    statics.unshift({ x: 105, y: -38, w: 45, h: 48, fill: '#24203c' }, { x: 104.4, y: -15.2, w: 0.8, h: 2.4, fill: '#ec3013' });
    const labels = this.STATIC.filter(s => s[5]).map(([x0, , z0, , , t]) => ({ x: x0 + 0.4, y: z0 + 1.4, txt: t })).concat([{ x: 105.6, y: -15.8, txt: 'DOOR' }]);
    let items = [], sel = null;
    if (L) { const all = this.list(L), boxes = all.map(i => this.aabb(i)), stat = this.STATIC.map(s => s.slice(0, 4));
      items = all.map((it, i) => { const [hw, hd] = this.SIZE[it.kind], on = it.id === S.sel, bad = stat.some(b => this.hits(boxes[i], b)) || boxes.some((b, j) => j !== i && this.hits(boxes[i], b)) || boxes[i][0] < 105 || boxes[i][1] > 150 || boxes[i][2] < -38 || boxes[i][3] > 10;
        const row = { ...it, bad, tf: 'translate(' + it.o.x + ' ' + it.o.z + ') rotate(' + (-it.o.a) + ')', rx: -hw, ry: -hd, rw: hw * 2, rh: hd * 2, fill: this.COL[it.kind], stroke: bad ? '#ec3013' : on ? '#ffffff' : '#201e1d', sw: on || bad ? 0.22 : 0.08,
          arrow: '-0.35,' + (hd - 0.75) + ' 0.35,' + (hd - 0.75) + ' 0,' + (hd - 0.1), short: it.o.x.toFixed(1) + ', ' + it.o.z.toFixed(1) + ' · ' + it.o.a + '°',
          rowBg: on ? '#f3f2f2' : 'transparent', rowInk: on ? '#201e1d' : '#f3f2f2',
          pick: e => { blur(e); this.setState({ sel: it.id }); },
          down: e => { e.stopPropagation(); const p = this.pt(e); if (!p) return; this.setState({ sel: it.id }); this.drag = { id: it.id, ox: p.x - it.o.x, oz: p.y - it.o.z }; try { e.currentTarget.ownerSVGElement.setPointerCapture(e.pointerId); } catch (x) {} } };
        if (on) sel = row; return row; }); }
    const face = a => ({ 0: 'faces south (café)', 90: 'faces east', 180: 'faces north (lanes)', 270: 'faces west' }[a] || 'turned ' + a + '°');
    return {
      svgRef: this.svgRef, statics, labels, items,
      onBg: () => {}, onMove: e => { if (!this.drag) return; const p = this.pt(e); if (!p) return; const d = this.drag; const Lz = JSON.parse(JSON.stringify(this.state.lay)); const it = this.list(Lz).find(i => i.id === d.id); if (!it) return;
        it.o.x = Math.round((p.x - d.ox) * 20) / 20; it.o.z = Math.round((p.y - d.oz) * 20) / 20; this.setState({ lay: Lz, saved: false }); },
      onUp: () => { this.drag = null; },
      selName: sel ? sel.name : 'Loading…', selInfo: sel ? 'x ' + sel.o.x.toFixed(2) + ' · z ' + sel.o.z.toFixed(2) + ' · ' + face(sel.o.a) : '', selWarn: !!(sel && sel.bad),
      selIsCab: !!(sel && sel.kind === 'cab'), selGame: sel && sel.kind === 'cab' ? sel.o.game : '',
      toWall: e => { blur(e); this.edit((o, it) => { const hd = this.SIZE[it.kind][1], g = 0.1;
          const W = [{ d: o.x - 105, set: () => { o.x = 105 + g + hd; o.a = 90; } }, { d: 150 - o.x, set: () => { o.x = 150 - g - hd; o.a = 270; } }, { d: o.z + 38, set: () => { o.z = -38 + g + hd; o.a = 0; } }, { d: 10 - o.z, set: () => { o.z = 10 - g - hd; o.a = 180; } }];
          if (o.x > 126.45 && o.z > -15) W.push({ d: o.z + 14.9, set: () => { o.z = -14.9 + g + hd; o.a = 0; } });
          W.sort((p, q) => p.d - q.d)[0].set(); o.x = Math.round(o.x * 100) / 100; o.z = Math.round(o.z * 100) / 100; }); },
      cycleGame: e => { blur(e); this.edit(o => { o.game = this.GAMES[(this.GAMES.indexOf(o.game) + 1) % this.GAMES.length]; }); },
      rotL90: e => { blur(e); this.rot(-90); }, rotL15: e => { blur(e); this.rot(-15); }, rotR15: e => { blur(e); this.rot(15); }, rotR90: e => { blur(e); this.rot(90); },
      nW: e => { blur(e); this.nudge(-1, 0); }, nE: e => { blur(e); this.nudge(1, 0); }, nN: e => { blur(e); this.nudge(0, -1); }, nS: e => { blur(e); this.nudge(0, 1); },
      saveLabel: S.saved ? 'Saved. Meru 2 uses this' : 'Save layout',
      save: e => { blur(e); if (!this.mod || !L) return; localStorage.setItem(this.mod.LANES_LAYOUT_KEY, JSON.stringify(L)); this.setState({ saved: true }); },
      copyLabel: S.copied ? 'Copied' : 'Copy for Claude',
      copy: e => { blur(e); if (!L) return; const t = JSON.stringify(L); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => prompt('Copy:', t)); this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1600); },
      reset: e => { blur(e); if (!this.mod) return; this.setState({ lay: JSON.parse(JSON.stringify(this.mod.LANES_LAYOUT_DEFAULT)), saved: false }); },
    };
  }
}
</script>
</body>
</html>
