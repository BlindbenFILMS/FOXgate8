<div style="min-height:100dvh;background:#201e1d;font-family:var(--font-body);color:#f3f2f2;display:flex;flex-direction:column" data-screen-label="Tavern Workshop">

    </div>
  </div>
</div>

        const lanes = all.filter(a => /^darts/.test(a.kind)).map(a => { const [fx, fz] = this.mod.frontOf(a.o, 3.2); return this.mod.rotBox({ x: fx, z: fz, a: a.o.a || 0 }, 0.9, 3.0); });

      onUp: () => { this.drag = null; },

      copyLabel: S.copied ? 'Copied' : 'Copy for Claude',
      copy: e => { blur(e); if (!L) return; const t = JSON.stringify(L); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => prompt('Copy:', t)); this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1600); },
      reset: e => { blur(e); if (!this.mod) return; this.setState({ lay: JSON.parse(JSON.stringify(this.mod.TAVERN_DEFAULT)), saved: false }); },
    };
  }
