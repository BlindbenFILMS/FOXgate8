<style>
  :root{
    --bg:#0d0f1f; --panel:rgba(13,15,31,.88); --ink:#fff; --soft:#c9cbe0;
    --gold:#ffcf5a; --sky:#7fdcff; --orange:#ff8a3d; --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Atkinson Hyperlegible',system-ui,sans-serif;overflow:hidden;
    -webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ── intro ── */
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:env(safe-area-inset-top) 22px calc(24px + env(safe-area-inset-bottom));text-align:center;gap:18px;z-index:20;background:#000;overflow:auto}
  /* the intro film: a square at the very top, edge to edge on a phone, looping silently */
  #intro .film{display:block;flex:none;width:min(100vw,50vh,560px);aspect-ratio:1/1;height:auto;margin:0 -22px 4px;object-fit:cover;background:#000;pointer-events:none}
  #intro h1{margin:0;max-width:15em;font-family:Archivo,'Atkinson Hyperlegible',Arial,sans-serif;font-weight:900;
    font-size:clamp(22px,6.6vw,34px);line-height:1.15;letter-spacing:.01em;color:#fff}
  #intro .art{color:#fff;opacity:.75;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  #intro p{margin:0;max-width:30em;color:var(--soft);font-size:17px;line-height:1.5}
  #start{min-width:240px;min-height:64px;padding:16px 34px;border:0;border-radius:0;background:#fff;color:#000;
    font-family:Archivo,'Atkinson Hyperlegible',Arial,sans-serif;font-size:clamp(18px,6.2vw,24px);font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  #start:focus-visible,.btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  @media (orientation:landscape) and (max-height:520px){
    #intro{gap:8px} #intro .film{width:min(44vh,320px);margin:0} #intro h1{max-width:30em;font-size:clamp(18px,3.4vw,24px)} #start{min-height:52px;padding:10px 28px;font-size:20px}}
  #intro .small{font-size:15px;color:var(--soft)}
  /* the two intro lines: always exactly two lines; each scales with the screen between a minimum and a maximum */
  #introText{width:100%;max-width:none;text-transform:uppercase;line-height:1.08}
  #introText span{display:block;width:max-content;max-width:none;white-space:nowrap;margin:0 auto}
  #introText .l1{font-size:clamp(20px,calc((100vw - 44px) / 12.5),44px)}
  #introText .l2{font-size:clamp(14px,calc((100vw - 44px) / 16.5),30px);margin-top:.3em;color:#e9e9e9}
  @media (orientation:landscape) and (max-height:520px){#introText .l1{font-size:clamp(18px,5.4vh,30px)} #introText .l2{font-size:clamp(14px,4.2vh,22px)}}
  #intro a{color:var(--sky)}
  #pick{display:flex;flex-direction:column;gap:10px;width:min(420px,100%)}
  #pick a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-size:18px}

  /* ── AR view ── */
  #ar{position:fixed;inset:0;overflow:hidden}
  #ar video{object-fit:cover}
  #ar{touch-action:none}
  /* ── the camera view's controls: one row at the bottom (Play game · Artist · Sound) that appears only while a
     painting is found (or a game is on), and the Blindness Spectrum filter banner at the top, always there ── */
  #topBar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:none;gap:6px;
    padding:0 calc(8px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
  #topBar.on{display:flex}
  #topBar button{flex:1 1 0;min-width:0;height:52px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;
    border:2px solid #fff;border-radius:0;background:#000;color:#fff;cursor:pointer;white-space:nowrap;line-height:1;text-align:center;
    font-family:Archivo,'Atkinson Hyperlegible',Arial,sans-serif;font-weight:900;font-size:clamp(12px,3.7vw,16px);letter-spacing:.04em;text-transform:uppercase}
  #topBar button .l{display:block;line-height:1;padding-top:.08em}     /* capitals sit optically centred */
  #topBar button .i{display:block;font-size:.95em;line-height:1}
  #filterBtn{position:fixed;left:0;right:0;top:0;z-index:12;display:none;width:100%;align-items:center;justify-content:center;gap:10px;
    min-height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;border:0;border-bottom:4px solid #ec3013;border-radius:0;
    background:#1f4fd8;color:#fff;cursor:pointer;line-height:1;
    font-family:Archivo,'Atkinson Hyperlegible',Arial,sans-serif;font-weight:900;font-size:clamp(13px,3.9vw,17px);letter-spacing:.05em;text-transform:uppercase}
  #filterBtn.on{display:flex}
  #filterBtn:focus-visible{outline:3px solid #fff;outline-offset:-6px}
  #topBar #gameBtn{background:#ec3013;border-color:#ec3013}
  #topBar #gameBtn.stop{background:#000;border-color:#ec3013}
  #topBar #muteBtn[aria-pressed="true"]{background:#fff;color:#000}
  #topBar button:disabled{opacity:.38;cursor:default}
  #topBar button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  /* screen-reader-only helpers: the status line and a Describe button stay for VoiceOver / TalkBack users */
  #hud{position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden}
  #hud .sr-btn{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;padding:0;border:0}

  #status{align-self:center;padding:10px 18px;border-radius:999px;background:var(--panel);
    border:1px solid var(--line);font-size:17px;font-weight:700;text-align:center;max-width:100%}
  #status.found{color:var(--gold)}
  #caption{display:none;max-height:32vh;overflow:auto;padding:14px 16px;border-radius:16px;background:var(--panel);
    border:1px solid var(--line);font-size:18px;line-height:1.5}
  #caption.show{display:block}
  #explore{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
  #explore.show{display:flex}
  .row{display:flex;gap:10px;justify-content:center}
  .btn{flex:1;max-width:180px;min-height:56px;padding:10px 14px;border-radius:16px;border:1px solid var(--line);
    background:var(--panel);font-size:17px;font-weight:700}
  .btn[aria-pressed="true"]{background:var(--sky);color:#00202b;border-color:transparent}
  .chip{min-height:48px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:16px;font-weight:700}

  /* scanning frame */
  #scan{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;pointer-events:none}
  #scan{flex-direction:column;gap:18px;z-index:7}
  #visionLayer{position:fixed;inset:0;z-index:6;pointer-events:none}
  #eyeBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:11;display:none;
    min-height:48px;padding:0 16px;background:#000;color:#fff;border:2px solid #fff;border-radius:0;
    font-family:Archivo,'Atkinson Hyperlegible',Arial,sans-serif;font-weight:900;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
  #eyeBtn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  #scan .cue{background:#000;color:#fff;padding:10px 18px 9px;font-family:Archivo,'Atkinson Hyperlegible',Arial,sans-serif;
    font-weight:900;font-size:clamp(22px,6.4vw,30px);line-height:1.1;letter-spacing:.04em;text-align:center}
  #scan .box{width:min(70vw,360px,40vh);aspect-ratio:3/4;border-radius:22px;position:relative}
  /* while searching, the big cue does the talking; the status pill stays for screen readers only */
  #status:not(.found){position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #scan .box::before,#scan .box::after{content:"";position:absolute;inset:0;border-radius:22px;
    border:3px solid var(--sky);opacity:.85;
    -webkit-mask:linear-gradient(#000 0 0) top/100% 22% no-repeat,linear-gradient(#000 0 0) bottom/100% 22% no-repeat;
            mask:linear-gradient(#000 0 0) top/100% 22% no-repeat,linear-gradient(#000 0 0) bottom/100% 22% no-repeat}
  #scan .box::after{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.04);opacity:.35}}

  #loading{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:var(--bg);font-size:19px}
  .spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #err{display:none;color:#ffb4b4;max-width:30em}
  @media (prefers-reduced-motion:reduce){#scan .box::after,.spinner{animation:none}}
</style>
</head>
<body>

<main id="intro">
  <video class="film" id="introFilm" src="media/bcp-intro.mp4" poster="media/bcp-intro-poster.jpg" autoplay muted loop playsinline webkit-playsinline preload="auto" aria-hidden="true"></video>
  <span class="sr">Blind Canvas Project</span>
  <h1 id="introText"><span class="l1">This art comes alive</span><span class="l2">Center phone camera on art</span></h1>
  <div class="art" id="introArt"></div>
  <button id="start" type="button">Enter gallery</button>
  <p class="small" id="introHelp">Turn your sound on. Your phone will ask to use the camera.</p>
  <p id="err" role="alert"></p>
  <nav id="pick" aria-label="Choose a room or an artwork" hidden></nav>
</main>

<div id="loading" role="status"><div class="spinner" aria-hidden="true"></div><div>Starting camera…</div></div>
<div id="ar" aria-hidden="true"></div>
<div id="visionLayer"></div>
<button id="filterBtn" type="button" aria-label="Enable the Blindness Spectrum filter: see through the eyes of someone with a vision condition">Enable Blindness Spectrum filter</button>
<nav id="topBar" aria-label="Controls">
  <button id="gameBtn" type="button" disabled><span class="i" aria-hidden="true">&#9654;</span><span class="l">Play game</span></button>
  <button id="artistBtn" type="button" disabled><span class="i" aria-hidden="true">&#8599;</span><span class="l">Artist</span></button>
  <button id="muteBtn" type="button" aria-pressed="false"><span class="l">Sound on</span></button>
</nav>
<div id="scan" aria-hidden="true"><div class="cue">CENTER ART IN CAMERA</div><div class="box"></div></div>

<section id="hud" aria-label="Artwork">
  <div id="status" role="status" aria-live="polite">Center the art in your camera</div>
  <div id="caption" aria-live="off"></div>
  <div id="explore" role="group" aria-label="Explore parts of the artwork"></div>
  <button class="sr-btn" id="describe" type="button">Describe the painting</button>
</section>

<script>
/* One switch for every sound on the page. Every Web Audio context (the games' sounds, Ben's recorded lines)
   is remembered so Mute can pause them all; every video or audio that starts playing while muted starts muted. */
(function () {
  const AC = window.AudioContext || window.webkitAudioContext; window.__acs = [];
  if (AC) {
    const Wrapped = function (...a) { const c = new AC(...a); window.__acs.push(c); if (window.__muted) c.suspend().catch(() => {}); return c; };
    Wrapped.prototype = AC.prototype;
    window.AudioContext = Wrapped; if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
    const resume = AC.prototype.resume;   // a game asking to resume while muted stays quiet
    AC.prototype.resume = function () { return window.__muted ? Promise.resolve() : resume.call(this); };
  }
  const play = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () { if (window.__muted && !this.muted) { this.muted = true; this.dataset.unmute = '1'; } return play.call(this); };
})();
</script>
<script type="importmap">
{ "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/addons/",
    "mindar-image-three": "./lib/mindar/mindar-image-three.prod.js"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import * as DATA from './artworks.js';
import { visionOverlay } from './lib/gallery-vision.js';
import { GAMES } from './lib/minigames/index.js';
const ARTWORKS = DATA.ARTWORKS, EXHIBITIONS = DATA.EXHIBITIONS || [];

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const byId = id => ARTWORKS.find(a => a.id === id);

/* What are we showing? ?show=<exhibition> (many works) or ?art=<artwork> (one work).
   Either way we end up with: a tracking file + the list of artworks in the order it was built. */
let show = null;
if (params.get('show')) {
  const ex = EXHIBITIONS.find(e => e.id === params.get('show'));
  // A room can have its own combined tracking file (target), or none: then the phone joins
  // each artwork's own tracking file together (see loadTargets), so rooms need no extra files.
  if (ex) show = { title: ex.title, subtitle: ex.artworks.length + ' artworks', target: ex.target || null,
                   works: ex.artworks.map(byId).filter(Boolean) };
} else if (params.get('art')) {
  const a = byId(params.get('art'));
  if (a) show = { title: a.title, subtitle: a.artist, target: a.target, works: [a] };
}

/* ── intro ─────────────────────────────────────────── */
function fitIntroLines() {
  for (const el of document.querySelectorAll('#introText span')) {
    el.style.fontSize = '';
    const room = el.parentElement.clientWidth, w = el.scrollWidth;
    if (room && w > room) el.style.fontSize = Math.max(12, parseFloat(getComputedStyle(el).fontSize) * room / w * 0.98) + 'px';
  }
}
fitIntroLines(); addEventListener('resize', fitIntroLines);
if (document.fonts) document.fonts.ready.then(fitIntroLines);
if (!show) {
  $('introArt').textContent = 'Choose a room or an artwork';
  $('introText').hidden = true; $('start').hidden = true; $('introHelp').hidden = true;
  const pick = $('pick'); pick.hidden = false;
  const add = (href, text) => { const l = document.createElement('a'); l.href = href; l.textContent = text; pick.appendChild(l); };
  for (const e of EXHIBITIONS) add('?show=' + encodeURIComponent(e.id), e.title + ' — ' + e.artworks.length + ' artworks');
  for (const a of ARTWORKS) add('?art=' + encodeURIComponent(a.id), a.title + (a.artist ? ' — ' + a.artist : ''));
} else {
  document.title = show.title + ' · Blind Canvas AR';
  $('introArt').textContent = show.title + (show.subtitle ? ' — ' + show.subtitle : '');
}

/* ── speech + sound ────────────────────────────────── */
const synth = window.speechSynthesis;
let voice = null;
function pickVoice() {
  const vs = synth ? synth.getVoices() : [];
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /natural|samantha|google|aria|jenny/i.test(v.name))
       || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

const audios = new Map();          // artwork id → recorded narration
function stopTalking() {
  if (synth) synth.cancel();
  for (const a of audios.values()) a.pause();
}
function say(text) {
  if (window.__muted) return;
  stopTalking();
  if (!synth || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.rate = 0.95; synth.speak(u);
}
function describe(work) {
  setCaption(work.description);
  const a = audios.get(work.id);
  if (a) { stopTalking(); a.currentTime = 0; a.play().catch(() => say(work.description)); }
  else say(work.description);
}
function buzz(p) { if (navigator.vibrate) navigator.vibrate(p); }

/* ── HUD ───────────────────────────────────────────── */
let current = null;                // the artwork most recently found
function setStatus(text, found) { const s = $('status'); s.textContent = text; s.classList.toggle('found', !!found); }
function setCaption(text) { $('caption').textContent = text || ''; }
let allScenes = [];
const storyMedia = sc => sc && (sc.clip || sc.audio);
function stopStories(except) { const keep = storyMedia(except); for (const s of allScenes) { const m = storyMedia(s); if (m && m !== keep) m.pause(); } }
function playStory(sc, fromStart) {   // the artist's clip (or sound) for this painting
  const m = storyMedia(sc); if (!m) return;
  bindMedia(sc);
  stopTalking(); stopStories(sc);
  if (fromStart || m.ended) m.currentTime = 0;
  m.play().catch(() => {});
  setCaption(sc.work.quote || ''); setStatus(sc.work.title + ' · ' + sc.work.artist, true);
}
$('describe').onclick = () => { if (!current) return; stopStories(); describe(current.work); };

/* ── the top bar: Play game · Artist · Sound ─────────── */
// each artist's page on blindcanvasproject.com (an artwork can also set its own `link` in artworks.js)
const BCP = 'https://blindcanvasproject.com/';
const ARTIST_PAGES = {
  'ben fox': 'ben-fox/', 'bill mccann': 'bill-mccann/', 'april & melissa': 'april-and-mellissa/', 'morten bonde': 'morten-bonde/',
  'marcus roberts': 'marcus-roberts/', 'shardasia hadley': 'shardasia-hadley/', 'will hollimon': 'will-hollimon/',
  'wayne pearcy': 'wayne-pearcy/', 'dave steele': 'dave-steele/', 'craig ellis': 'craig-ellis/', 'raquel alim': 'raquel-alim/',
  'steven mccoy': 'steven-mccoy/', 'rusty perez': 'rusty-perez/', 'ricky ruzicka': 'ricky-ruzicka/', 'alayna lopez': 'alayna-lopez/',
  'academy of music for the blind': 'series',      // the Academy's paintings are the site's Series page
};
const artistLink = w => w && (w.link || (ARTIST_PAGES[(w.artist || '').trim().toLowerCase()] != null ? BCP + ARTIST_PAGES[(w.artist || '').trim().toLowerCase()] : null));
function setGameBtn(state) {   // 'play' | 'stop' | 'again'
  const b = $('gameBtn'), t = { play: ['&#9654;', 'Play game'], stop: ['&#9632;', 'Stop'], again: ['&#8635;', 'Play again'] }[state];
  b.innerHTML = '<span class="i" aria-hidden="true">' + t[0] + '</span><span class="l">' + t[1] + '</span>';
  b.classList.toggle('stop', state === 'stop');
}
function setNowShowing(sc) {   // the painting the buttons act on (null: nothing in view)
  const w = sc && sc.work;
  if (started) $('topBar').classList.toggle('on', !!(w || game));
  $('gameBtn').disabled = !(w && GAMES[w.id]);
  $('gameBtn').setAttribute('aria-label', w && GAMES[w.id] ? (game ? 'Stop the game' : 'Play the game for ' + w.title) : 'Play game: find a painting first');
  const url = artistLink(w);
  $('artistBtn').disabled = !url;
  $('artistBtn').setAttribute('aria-label', url ? 'Visit ' + w.artist + '\u2019s page on the Blind Canvas Project website' : 'Visit the artist\u2019s page: find a painting first');
}
$('artistBtn').onclick = () => {
  const url = artistLink(current && current.work); if (!url) return;
  if (current && current.clip) current.clip.pause();
  stopTalking();
  window.open(url, '_blank', 'noopener');
};
function setMuted(on) {
  window.__muted = on;
  $('muteBtn').setAttribute('aria-pressed', on);
  $('muteBtn').innerHTML = '<span class="l">' + (on ? 'Muted' : 'Sound on') + '</span>';
  $('muteBtn').setAttribute('aria-label', on ? 'Sound is off. Tap to turn sound on' : 'Sound is on. Tap to mute');
  for (const c of window.__acs) (on ? c.suspend() : c.resume()).catch(() => {});
  if (on) { stopTalking(); for (const m of document.querySelectorAll('video,audio')) if (!m.muted) { m.muted = true; m.dataset.unmute = '1'; } }
  const media = [...document.querySelectorAll('video,audio'), ...audios.values(), ...allScenes.flatMap(s => [s.clip, s.audio, s.video])].filter(Boolean);
  for (const m of new Set(media)) {
    if (on) { if (!m.muted) { m.muted = true; m.dataset.unmute = '1'; } }
    else if (m.dataset.unmute) { m.muted = false; delete m.dataset.unmute; }
  }
  buzz(20);
}
$('muteBtn').onclick = () => setMuted(!window.__muted);

function showExplore(scene) {
  const box = $('explore'); box.innerHTML = '';
  for (const hs of scene.work.hotspots || []) {
    const b = document.createElement('button');

/* ── textures ──────────────────────────────────────── */

/* ── the Blind Canvas story layout ─────────────────────

   no clip can have 'audio' (sound only) instead. */
function mkVideo(src, sound, loop) {

  Object.assign(v, { src, loop, playsInline: true, crossOrigin: 'anonymous', preload: 'auto' });
  v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', ''); v.muted = !sound;

/* Shared players: one video for the animated art and one for the artist's clip, used by every painting.

/* ── one artwork's overlay ─────────────────────────────
   MindAR's anchor: the artwork is 1 unit wide, centered at 0,0.
   Each artwork gets its own "scene" object with its own effects. */
function buildScene(work, anchor) {

  sc.type = type;

  if (type === 'story') buildStory(sc, work, h);
  else if (type === 'video') {
    const v = document.createElement('video');
    Object.assign(v, { src: work.overlay.src, loop: true, playsInline: true, crossOrigin: 'anonymous', preload: 'auto' });
    v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');

    const tex = new THREE.VideoTexture(v); tex.colorSpace = THREE.SRGBColorSpace;
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    plane.position.z = 0.003; sc.group.add(plane);

      if (!hs.glow) continue;
      const col = new THREE.Color(hs.color || '#ffcf5a');
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false }));

      sc.animators.push(t => { const k = base * (1 + 0.08 * Math.sin(t * 1.7)); glow.scale.set(k, k, 1);
        glow.material.opacity = 0.55 + 0.25 * Math.sin(t * 1.7); });
      for (let i = 0; i < 3; i++) {
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.96, 1, 64), new THREE.MeshBasicMaterial({
          color: col, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        ring.position.set(px(hs.x), py(hs.y), 0.012); sc.group.add(ring);
        const r0 = pr(hs.r);

    const palette = ['#ffcf5a', '#7fdcff', '#ff7aa8', '#9dffa0', '#ffffff'].map(c => new THREE.Color(c));

}

/* ── joining tracking files ────────────────────────────
   Every .mind file is the same small header followed by a list of artworks. To make one file
   for a room we keep one header and put all the lists together, in room order. */
async function loadTargets(urls, onProgress) {

    while (next < urls.length) {

      bytes += bufs[i].length; onProgress(++done, urls.length, bytes);
    }
  }
  await Promise.all(Array.from({ length: Math.min(6, urls.length) }, worker));
  const HEAD = [0x82, 0xa1, 0x76, 0x02, 0xa8, 100, 97, 116, 97, 76, 105, 115, 116];   // {v:2, dataList:
  let count = 0; const parts = [];
  bufs.forEach((b, i) => {
    for (let k = 0; k < HEAD.length; k++) if (b[k] !== HEAD[k]) throw new Error(urls[i] + ' is not a tracking file this page understands. Rebuild it with add.html.');
    const t = b[13]; let n, start;
    if (t >= 0x90 && t <= 0x9f) { n = t - 0x90; start = 14; }
    else if (t === 0xdc) { n = (b[14] << 8) | b[15]; start = 16; }
    else if (t === 0xdd) { n = ((b[14] << 24) >>> 0) + (b[15] << 16) + (b[16] << 8) + b[17]; start = 18; }
    else throw new Error('Unexpected data in ' + urls[i]);

  const blob = new Blob([new Uint8Array(HEAD), new Uint8Array(head), ...parts], { type: 'application/octet-stream' });
  return { url: URL.createObjectURL(blob), bytes, count };
}

/* ── test readout: add &stats=1 to a link ──────────── */
const stats = (() => {
  const on = params.get('stats') === '1';
  const t0 = performance.now(); let box = null, lines = {}, finds = [];
  const sec = ms => (ms / 1000).toFixed(1) + ' s';
  function draw() {
    if (!on) return;
    if (!box) { box = document.createElement('div'); box.setAttribute('aria-hidden', 'true');
      box.style.cssText = 'position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:30;max-width:70vw;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.72);color:#9dffa0;font:12px/1.45 ui-monospace,Menlo,monospace;pointer-events:none;white-space:pre';

    found(title) { const n = performance.now(); finds.push('found ' + title.slice(0, 22) + ' in ' + sec(n - Math.max(scanStart, lastLost))); draw(); },
    lost() { lastLost = performance.now(); }

/* Phones only let a video play with sound later if it was started inside a tap. We start each player
   muted and stop it at once, inside the Start tap, so nothing is heard until a painting is found. */
function silentUnlock(m) {
  const wasMuted = m.muted;
  m.muted = true;
  const p = m.play(); m.pause();
  if (p) p.catch(() => {});
  m.muted = wasMuted;
}

/* ── "See through their eyes": Ben's vision simulator over the live camera ──
   Pure CSS layers (blur + gradients) laid over the camera and the AR art, so whatever the phone sees,
   including a painting's story, is seen the way someone with that condition would see it.
   The phone's gyroscope steers it: the clear spot leads a little where you turn, floaters lag behind. */

const turn = { yaw: 0, pitch: 0 };                       // rad/s, smoothed

  const r = e.rotationRate; if (!r) return;
  // rotationRate is around the phone's own axes; turn it into "left/right" and "up/down" for how the phone is held
  const th = (((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * Math.PI) / 180;
  const b = ((r.beta || 0) * Math.PI) / 180, g = ((r.gamma || 0) * Math.PI) / 180;
  const yaw = b * Math.sin(th) + g * Math.cos(th);         // turning left is positive

    if (DME && typeof DME.requestPermission === 'function') DME.requestPermission().then(r => { if (r === 'granted') go(); }).catch(() => {});
    else go();

}

  askMotion();

    vision = visionOverlay({ container: $('visionLayer'), onExit: closeVision });
    vision.open('rp');                                     // Tunnel (Retinitis Pigmentosa) first
    let last = performance.now();
    (function loop(now) {
      const dt = Math.min(0.1, (now - last) / 1000); last = now;

/* ── mini games inside a painting (lib/minigames) ────────

/* ── start ─────────────────────────────────────────── */

  allScenes = scenes;

  /* How much of a painting is on the screen (0..1): a 5×5 grid of points on the painting, projected to the screen.
     MindAR keeps tracking a painting from a handful of points, so without this a painting that has mostly left the
     camera stays "found" and blocks the one next to it. */
  const SHOW_AT = 0.55, LET_GO_AT = 0.4, GAME_LET_GO_AT = 0.2;
  const pv = new THREE.Vector3();
  function onScreen(sc) {
    const g = sc.anchor.group; g.updateMatrixWorld(true);
    const r = renderer.domElement.getBoundingClientRect(), h = sc.work.height / sc.work.width;
    let n = 0;
    for (let a = 0; a < 5; a++) for (let b = 0; b < 5; b++) {
      pv.set((a + 0.5) / 5 - 0.5, ((b + 0.5) / 5 - 0.5) * h, 0).applyMatrix4(g.matrixWorld).project(camera);
      const x = r.left + (pv.x + 1) / 2 * r.width, y = r.top + (1 - pv.y) / 2 * r.height;
      if (pv.z < 1 && x >= 0 && x <= innerWidth && y >= 0 && y <= innerHeight) n++;
    }
    return n / 25;
  }
  const resting = new Map();   // painting index → time until which the search skips it (so it can't block its neighbour)
  function letGo(sc) {   // tell MindAR to drop this painting and start searching again
    const ctrl = mindar.controller, st = ctrl && ctrl.trackingStates && ctrl.trackingStates[sc.index];
    if (!st) return;
    resting.set(sc.index, performance.now() + 1200);
    st.isTracking = false; st.showing = false; st.trackMiss = 0; st.trackCount = 0; st.trackingMatrix = null;
    if (ctrl.onUpdate) ctrl.onUpdate({ type: 'updateMatrix', targetIndex: sc.index, worldMatrix: null });
  }

  // tap the art to hear a part of it
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  R3 = { camera, renderer };
  for (const k of ['down', 'move', 'up']) $('ar').addEventListener('pointer' + k, ev => { if (game && gameScene && gameScene.found) game.pointer(k, ev); });
  $('ar').addEventListener('pointerup', ev => {
    if (game) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    for (const s of scenes) if (s.found && s.clipPlane && ray.intersectObject(s.clipPlane)[0]) { if (s.clip.paused) playStory(s, false); else s.clip.pause(); return; }   // tap the clip: pause / play
    const targets = scenes.filter(s => s.found).flatMap(s => s.hotspots);
    if (!targets.length) return;
    const hit = ray.intersectObjects(targets)[0];
    if (hit) { const l = hit.object.userData.label; setCaption(l); say(l); buzz(30); }
  });

  setStatus('Center the art in your camera');
  stats.set('n', show.works.length + ' artworks');
  if (!show.target) {
    const msg = $('loading').lastElementChild, t = performance.now();
    const res = await loadTargets(show.works.map(w => w.target), (d, n, b) => {
      msg.textContent = 'Loading artworks ' + d + ' of ' + n + '\u2026';
      stats.set('dl', 'downloaded ' + (b / 1048576).toFixed(1) + ' MB');
    });
    mindar.imageTargetSrc = res.url;
    stats.set('dl', 'downloaded ' + (res.bytes / 1048576).toFixed(1) + ' MB in ' + ((performance.now() - t) / 1000).toFixed(1) + ' s');
    msg.textContent = 'Starting camera\u2026';
  }
  await mindar.start();
  { // the search skips a painting we just let go of, for a moment, so the one next to it is found first
    const ctrl = mindar.controller, match = ctrl && ctrl._detectAndMatch;
    if (match) ctrl._detectAndMatch = (input, idx) => { const now = performance.now(); const keep = idx.filter(i => !(resting.get(i) > now));
      return keep.length ? match.call(ctrl, input, keep) : Promise.resolve({ targetIndex: -1, modelViewTransform: null }); };
  }
  stats.scanning();

  $('loading').style.display = 'none';
  setGameBtn('play'); setNowShowing(null); $('filterBtn').classList.add('on');
  $('scan').style.display = 'flex';
  $('ar').removeAttribute('aria-hidden');

  /* Sticky overlay (like Artivive): keeps the art glued to the painting. Steady when you hold still, no lag when
     you move: a one-euro filter on the painting's position and rotation, whose smoothing relaxes with speed. */
  const STICK = { minCutoff: 1, beta: 40, dCutoff: 2 };
  const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
  const alpha = (c, dt) => 1 / (1 + 1 / (2 * Math.PI * c * dt));
  function stick(sc, dt) {
    const g = sc.anchor.group; if (!g.visible) { sc.pose = null; return; }
    const st = sc.pose || (sc.pose = { set: null }), now = performance.now();
    if (g.matrix !== st.set) {   // MindAR just measured the painting again
      g.matrix.decompose(_p, _q, _s);
      if (!st.P) { st.P = _p.clone(); st.Q = _q.clone(); st.S = _s.clone(); st.np = _p.clone(); st.nq = _q.clone(); st.ns = _s.clone(); st.dv = 0; st.dw = 0; st.t = now; }
      const dtr = Math.max(0.008, Math.min(0.2, (now - st.t) / 1000)), d = Math.max(1e-6, _p.length());
      const v = _p.distanceTo(st.np) / d / dtr, w = _q.angleTo(st.nq) / dtr;   // speed: share of the distance per second, and turn rate
      st.dv += alpha(STICK.dCutoff, dtr) * (v - st.dv); st.dw += alpha(STICK.dCutoff, dtr) * (w - st.dw);
      st.np.copy(_p); st.nq.copy(_q); st.ns.copy(_s); st.t = now;
    }
    const dts = Math.max(0.004, dt || 1 / 60), a = alpha(STICK.minCutoff + STICK.beta * st.dv, dts), b = alpha(STICK.minCutoff + STICK.beta * st.dw, dts);
    st.P.lerp(st.np, a); st.S.lerp(st.ns, a); st.Q.slerp(st.nq, b);
    const m = st.set || new THREE.Matrix4(); m.compose(st.P, st.Q, st.S); g.matrix = st.set = m;
  }

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime(), nowG = performance.now(), dtG = Math.min(0.05, (nowG - (window.__lastG || nowG)) / 1000); window.__lastG = nowG;
    for (const sc of scenes) stick(sc, dtG);
    if (game) { game.update(dtG); if (params.get('debug')) window.__mg = game.debug; if (game.over && !$('gameBtn').dataset.over) { $('gameBtn').dataset.over = '1'; setGameBtn('again'); } }
    else delete $('gameBtn').dataset.over;
    for (const sc of scenes) {
      if (sc.rejected && sc.anchor.visible) { letGo(sc); continue; }
      if (!sc.found) continue;
      if (onScreen(sc) < (sc.gameOn ? GAME_LET_GO_AT : LET_GO_AT)) { letGo(sc); continue; }
      // video layers stay hidden until their video is really playing (no black flash, and a video that
      // fails to load just shows the painting)
      if (sc.animPlane) sc.animPlane.visible = !sc.gameOn && shared.anim.owner === sc && shared.anim.ready;
      if (sc.clipPlane) sc.clipPlane.visible = !sc.gameOn && shared.clip.owner === sc && shared.clip.ready;
      const k = Math.min(1, (performance.now() - sc.appearT) / 600);   // ease in when found
      sc.group.scale.setScalar(0.92 + 0.08 * (reduceMotion ? 1 : 1 - Math.pow(1 - k, 3)));
      if (!reduceMotion) for (const f of sc.animators) f(t);
      else if (!sc.still) { for (const f of sc.animators) f(2); sc.still = true; }  // one calm still frame
    }
    // seamless loops: jump back to the start just before the end, so a video never sits on its last frame or goes black
    for (const k of ['anim', 'clip']) { const p = shared[k]; if (!p) continue; const v = p.v;
      if (!v.paused && v.duration > 1 && v.currentTime > v.duration - 0.12) v.currentTime = 0; }
    renderer.render(scene, camera);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopTalking(); scenes.forEach(s => { for (const v of [s.video, s.anim, s.clip, s.audio]) if (v) v.pause(); }); }
  });
}
</script>
</body>
</html>
