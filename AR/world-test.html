<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painting games · in a 3D room (test)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Archivo,Arial,sans-serif}#v{position:fixed;inset:0}
#go{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;min-height:64px;padding:0 28px;border:3px solid #000;background:#ec3013;color:#fff;font:900 20px Archivo,Arial;text-transform:uppercase;box-shadow:6px 6px 0 #000;cursor:pointer;white-space:nowrap}
[hidden]{display:none!important}
#tip{position:fixed;left:12px;right:12px;top:calc(14px + env(safe-area-inset-top));z-index:20;margin:0;color:#fff;font:800 15px/1.3 Archivo,Arial;text-align:center;text-shadow:0 2px 6px #000}
#tip a{color:#fff}
/* the host's own two buttons while a game is on, bottom-left, as in the gallery: Leave always, Play again when a run is over */
#bar{position:fixed;z-index:12;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap}
#bar button{min-height:48px;padding:0 18px;border:2px solid #f3f2f2;background:#1d1c1b;color:#f3f2f2;font:800 15px Archivo,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:0}
#bar button.red{background:#ec3013;border-color:#ec3013}
/* the list of all the paintings (shown when the link names no painting) */
#list{position:fixed;inset:0;z-index:30;overflow:auto;-webkit-overflow-scrolling:touch;background:#111;padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#list h1{font:900 26px/1.1 Archivo,Arial;text-transform:uppercase;margin:0 0 6px}
#list p{font:400 16px/1.45 'Atkinson Hyperlegible',Arial,sans-serif;color:#d6d6d6;margin:0 0 16px;max-width:60ch}
#list ol{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
#list a{display:block;min-height:56px;padding:10px 14px;background:#232120;border-left:6px solid #ec3013;color:#fff;text-decoration:none}
#list a:focus-visible,#go:focus-visible,#bar button:focus-visible{outline:3px solid #7fdcff;outline-offset:2px}
#list a b{display:block;font:900 16px/1.2 Archivo,Arial;text-transform:uppercase}
#list a span{display:block;font:400 14px/1.35 'Atkinson Hyperlegible',Arial,sans-serif;color:#d6d6d6;margin-top:3px}</style>
<script type="importmap">{"imports":{"three":"./lib/three/three.module.js"}}</script></head><body><div id="v"></div>
<p id="tip" role="status">Loading the list of games…</p><button id="go" type="button" hidden>Play the game</button>
<div id="bar" role="group" aria-label="Game" hidden></div>
<nav id="list" aria-label="All the painting games" hidden></nav>
<script type="module">
// A stand-in for the 3D gallery: a room, a painting on a side wall, a camera that walks up to it, then the game on the painting.
// It runs ANY of the 70 painting games, read from lib/minigames/gallery-games.json, the same list the gallery reads, and
// starts each one the way the gallery does: only that painting's game file is loaded (by its address, not built in), and
// the game is handed the painting's details (work), a computer voice (say), a buzz, the story button's action and onEnd.
//
//   world-test.html                          the list of all 70 paintings
//   world-test.html?art=napkin-please        one painting, by its AR id or its gallery key (?art=wix_wayne_napkins)
//   …&auto                                   start without pressing Play (for a robot; a phone needs the tap for sound)
//   …&bot=1                                  the game plays itself from start to finish (for testing)
import * as THREE from 'three';
import { playOnPainting } from './lib/minigames/in-world.js';
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const AR = new URL('./', location.href).href;                       // this folder (8GATES-SITE/AR/)
const GAL = new URL('../3D/', AR).href;                             // the gallery's folder, beside it
const tip = $('tip'), go = $('go'), bar = $('bar'), list = $('list');
let LIST = [];
try { LIST = await (await fetch(AR + 'lib/minigames/gallery-games.json', { cache: 'no-cache' })).json(); }
catch (e) { tip.textContent = 'The list of games (lib/minigames/gallery-games.json) did not load.'; throw e; }
window.__list = LIST;
const want = q.get('art');
const E = want ? LIST.find(e => e.id === want || e.key === want) : null;
if (!E) {
  // no painting named (or a name that is not in the list): show them all
  tip.hidden = true; list.hidden = false;
  list.innerHTML = `<h1>Painting games: 3D test room</h1><p>${want ? 'There is no painting called “' + want.replace(/[<&]/g, '') + '” in the list. ' : ''}Choose a painting. Its game plays on the painting in a small test room, started the same way the 3D gallery starts it. ${LIST.length} games.</p><ol></ol>`;
  const ol = list.querySelector('ol');
  for (const e of LIST) { const li = document.createElement('li'), a = document.createElement('a'); a.href = '?art=' + encodeURIComponent(e.id) + (q.has('bot') ? '&bot=' + q.get('bot') : '');
    const b = document.createElement('b'), s = document.createElement('span'); b.textContent = e.title; s.textContent = e.name + ' · ' + e.artist; a.append(b, s); li.append(a); ol.append(li); }
} else {
  document.title = E.name + ' · ' + E.title + ' (3D test room)';
  // the painting's details, as the gallery hands them to the game (full addresses, so they work from any page)
  const work = { id: E.id, title: E.title, artist: E.artist, quote: E.quote, image: new URL(E.image, AR).href,
    overlay: { anim: GAL + 'gallery/anim/' + E.key + '.mp4' } };
  const storyUrl = E.story ? new URL(E.story, AR).href : null;
  // the game's file: asked for as soon as the page opens, so that Play can start the game (and its sound) inside the tap
  let make = null, failed = null;
  const loading = import(AR + 'lib/minigames/' + E.file).then(m => { make = m[E.fn]; if (typeof make !== 'function') throw new Error(E.file + ' does not export ' + E.fn); }).catch(e => { failed = e; console.error(e); });

  const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace;
  $('v').appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#1b1a19'); scene.fog = new THREE.Fog('#1b1a19', 12, 30);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 100);
  scene.add(new THREE.HemisphereLight('#fff6ea', '#3a332c', 1.2));
  // the room: floor, walls; the painting hangs on the right-hand wall (facing -x), its middle 1.7 m up.
  // It is a square canvas, 2 m by 2 m, because every painting in the gallery hangs on a square canvas.
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshLambertMaterial({ color: '#5a4636' })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 5), new THREE.MeshLambertMaterial({ color: '#d9d2c6' })); wall.position.set(6, 2.5, 0); wall.rotation.y = -Math.PI / 2; scene.add(wall);
  const PAINT = { center: new THREE.Vector3(5.97, 1.7, -2), normal: new THREE.Vector3(-1, 0, 0), width: 2, height: 2 };
  const tex = new THREE.TextureLoader().load(work.image); tex.colorSpace = THREE.SRGBColorSpace;
  const art = new THREE.Mesh(new THREE.PlaneGeometry(PAINT.width, PAINT.height), new THREE.MeshBasicMaterial({ map: tex })); art.position.copy(PAINT.center); art.lookAt(PAINT.center.clone().add(PAINT.normal)); scene.add(art);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 0.05), new THREE.MeshLambertMaterial({ color: '#1a1410' })); frame.position.copy(PAINT.center).addScaledVector(PAINT.normal, -0.03); frame.lookAt(PAINT.center.clone().add(PAINT.normal)); scene.add(frame);
  // the camera starts across the room at an angle, as if the fox walked up
  const look = (pos, at) => { camera.position.copy(pos); camera.lookAt(at); };
  const startPos = new THREE.Vector3(0, 1.6, 3), startAt = new THREE.Vector3(5.9, 1.6, -1);
  look(startPos, startAt);
  // standing in front: square on, far enough that the whole picture fits with a little room (whatever the screen shape)
  function frontView() {
    const fov = THREE.MathUtils.degToRad(camera.fov), fitH = PAINT.height * 1.35 / 2 / Math.tan(fov / 2), fitW = PAINT.width * 1.15 / 2 / Math.tan(fov / 2) / camera.aspect;
    return PAINT.center.clone().addScaledVector(PAINT.normal, Math.max(fitH, fitW, 1.2));
  }
  let play = null, move = null, media = null, busy = false;
  window.__says = []; window.__entry = E; window.__work = work;
  function stopMedia() { if (media) { try { media.pause(); } catch (e) {} if (media.remove) media.remove(); media = null; } }
  function story() {   // the artist's own story, over the game (it closes itself at the end, or with Leave)
    stopMedia(); if (!storyUrl) return;
    if (/\.mp4$/.test(storyUrl)) { const v = Object.assign(document.createElement('video'), { src: storyUrl, controls: true, playsInline: true, autoplay: true });
      v.style.cssText = 'position:fixed;inset:8% 4%;width:92%;height:84%;z-index:40;background:#000;border:2px solid #f3f2f2'; v.onended = stopMedia; document.body.appendChild(v); media = v; v.play().catch(() => {}); }
    else { media = new Audio(storyUrl); media.play().catch(() => {}); }
  }
  function showBar(over) {
    bar.innerHTML = ''; bar.hidden = false;
    if (over && E.again) { const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Play again'; b.className = 'red'; b.onclick = () => { if (play) { stopMedia(); play.restart(); showBar(false); } }; bar.appendChild(b); }
    const l = document.createElement('button'); l.type = 'button'; l.textContent = over ? 'Leave the game' : '✕ Leave'; if (over && !E.again) l.className = 'red'; l.onclick = endGame; bar.appendChild(l);
    if (over) l.focus();
  }
  function begin() {
    go.hidden = true; tip.hidden = true;
    move = { from: camera.position.clone(), to: frontView(), t: 0 };
    try {
      play = playOnPainting({ make, scene, camera, renderer, ...PAINT, work,
        say: t => { window.__says.push(t); try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); } catch (e) {} },
        buzz: p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} },
        story, onEnd: () => showBar(true) });
    } catch (e) { console.error(e); play = null; go.hidden = false; tip.hidden = false; tip.textContent = 'Sorry, the game didn’t start: ' + e.message; return; }
    window.__play = play; showBar(false);
  }
  async function startGame() {
    if (busy || play) return;
    if (make) { begin(); return; }                 // (the usual case: the game is already loaded, so it starts inside the tap)
    busy = true; tip.textContent = 'Loading the game…'; await loading; busy = false;
    if (failed || !make) { tip.textContent = 'Sorry, the game didn’t load: ' + (failed ? failed.message : E.file); return; }
    begin();
  }
  function endGame() {
    if (play) { try { play.stop(); } catch (e) { console.error(e); } play = null; window.__play = null; }
    stopMedia(); try { speechSynthesis.cancel(); } catch (e) {}
    bar.hidden = true; bar.innerHTML = '';
    move = { from: camera.position.clone(), to: startPos.clone(), t: 0, back: true };
    go.hidden = false; tip.hidden = false; go.focus();
  }
  window.__start = startGame; window.__leave = endGame;
  tip.innerHTML = ''; tip.append(E.title + ', by ' + E.artist + '. Its game: ' + E.name + '. ');
  { const a = document.createElement('a'); a.href = location.pathname; a.textContent = 'All the games'; tip.append(a); }
  go.hidden = false; go.onclick = startGame;
  addEventListener('keydown', e => { if (play && e.key === 'Escape') endGame(); });
  if (q.has('auto')) loading.then(() => setTimeout(startGame, 400));
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); if (play) { move = null; camera.position.copy(frontView()); camera.lookAt(PAINT.center); } });
  let last = performance.now();
  window.__camera = camera; window.__three = { THREE, renderer, scene, camera, PAINT };
  renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (move) { move.t = Math.min(1, move.t + dt / 1.2); const k = move.t * move.t * (3 - 2 * move.t); camera.position.lerpVectors(move.from, move.to, k);
      const at = move.back ? PAINT.center.clone().lerp(startAt, k) : startAt.clone().lerp(PAINT.center, k); camera.lookAt(at); if (move.t >= 1) move = null; }
    if (play) { try { play.update(dt); } catch (e) { console.error(e); } window.__mg = play.game.debug; }
    renderer.render(scene, camera);
  });
}
</script></body></html>
