<script>
(function(){
  // Everything this page plays ends up connected to ctx.destination. Put a
  // gain node in the way of that connection and it becomes a master volume,
  // without needing to know how any individual sound was made.
  var BOOST = 1.25;
  if (typeof AudioNode === 'undefined' || !AudioNode.prototype.connect) return;
  var connect = AudioNode.prototype.connect;
  AudioNode.prototype.connect = function(dest){
    try {
      if (dest && dest.context && dest === dest.context.destination) {
        var ctx = dest.context;
        if (!ctx.__boost) {
          var g = ctx.createGain();
          g.gain.value = BOOST;
          connect.call(g, ctx.destination);   // the raw connect: no recursion
          ctx.__boost = g;
        }
        return connect.call(this, ctx.__boost);
      }
    } catch (e) {}
    return connect.apply(this, arguments);
  };
})();
</script>
<script>
(function(){
  function rr(x, y, w, h, radii){
    var r = radii;
    if (r == null) r = 0;
    if (typeof r === 'number') r = [r, r, r, r];
    else if (Array.isArray(r)) {
      if (r.length === 1) r = [r[0], r[0], r[0], r[0]];
      else if (r.length === 2) r = [r[0], r[1], r[0], r[1]];
      else if (r.length === 3) r = [r[0], r[1], r[2], r[1]];
    } else r = [0, 0, 0, 0];
    var tl = +r[0] || 0, tr = +r[1] || 0, br = +r[2] || 0, bl = +r[3] || 0;
    // Negative width/height mean the rectangle is drawn the other way round.
    if (w < 0) { x += w; w = -w; }
    if (h < 0) { y += h; h = -h; }
    var m = Math.min(w, h) / 2;
    tl = Math.min(tl, m); tr = Math.min(tr, m); br = Math.min(br, m); bl = Math.min(bl, m);
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    if (tr) this.arcTo(x + w, y, x + w, y + tr, tr);
    this.lineTo(x + w, y + h - br);
    if (br) this.arcTo(x + w, y + h, x + w - br, y + h, br);
    this.lineTo(x + bl, y + h);
    if (bl) this.arcTo(x, y + h, x, y + h - bl, bl);
    this.lineTo(x, y + tl);
    if (tl) this.arcTo(x, y, x + tl, y, tl);
    this.closePath();
  }
  try {
    if (typeof CanvasRenderingContext2D !== 'undefined' &&
        !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = rr;
    }
    if (typeof Path2D !== 'undefined' && !Path2D.prototype.roundRect) {
      Path2D.prototype.roundRect = rr;
    }
  } catch (e) {}
})();

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

9; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }\n  canvas {\n    display: block;\n    max-width: 100%; max-height: 100%;\n    width: auto; height: auto;\n    border-radius: 14px;\n    border: 3px solid #ff8a4c;\n    box-shadow: 0 0 0 3px rgba(5,15,25,0.9), 0 15px 40px rgba(0,0,0,0.6), 0 0 30px rgba(255,138,76,0.15);\n    background: #020a12;\n  }\n  .hint { flex: 0 0 auto; font-size: 0.75rem; color: #6f95a3; letter-spacing: 0.5px; }\n  .hint b { color: #ffb27a; }\n<\/style>\n<\/head>\n<body>\n  \n  <div class=\"layout\">\n  \n    <div class=\"stage\">\n      <canvas id=\"gameCanvas\" width=\"800\" height=\"600\"><\/canvas>\n    <\/div>\n  <\/div>\n<script>\nconst canvas = document.getElementById(\"gameCanvas\");\nconst ctx = canvas.getContext(\"2d\");\n\n// ---- PORTRAIT: the dive, in the shape of the phone -----------------------\n// A phone in portrait gets a canvas of its own proportions instead of the\n// authored 800x600. The world is exactly as wide as the canvas (the diver is\n// clamped to its edges; the camera only scrolls down), so a narrower canvas is\n// simply a narrower lane — which is where the zoom comes from: about 1.6x\n// bigger at the same screen width, and roughly 1150m of the 3000m dive visible\n// at once instead of 600m. Desktop keeps 800x600 exactly.\n// The host states this in the fragment because a framed document cannot read\n// it off its own window — inside the mini-game iframe innerWidth reports the\n// mobile default layout viewport, not the phone. The standalone check stays as\n// a fallback for opening this page directly.\nconst HOSTVIEW = /[#&]8g=portrait,(\\d+),(\\d+)/.exec(location.hash || '');\nconst PORTRAIT = !!HOSTVIEW ||\n  (window.innerWidth <= 620 && window.innerHeight > window.innerWidth * 1.15);\nif (PORTRAIT) {\n  const pad = 22;                       // .layout padding plus the canvas border\n  const vw = Math.max(200, (HOSTVIEW ? +HOSTVIEW[1] : window.innerWidth) - pad);\n  const vh = Math.max(200, (HOSTVIEW ? +HOSTVIEW[2] : window.innerHeight) - pad);\n  // 460 rather than 520: play is vertical, and the extra width was room the fox\n  // never needed. Measured, that leaves 15.3 fox-widths across where the 800\n  // lane gave 26.7 — a corridor rather than a hall, but the anglerfish are 34\n  // across and there is still room to go round them. This is the single dial\n  // for how close the camera sits: smaller is nearer.\n  canvas.width = 460;\n  canvas.height = Math.round(Math.max(900, Math.min(1500, 460 * vh / vw)));\n}\n// The lane's width, and how it compares with the 800 this was all authored\n// against. Positions are written against WW; DISTANCES scale by WSC so they\n// stay the same fraction of the lane rather than quietly growing in relative\n// terms as the lane narrows.\nconst WW = canvas.width;\nconst WSC = WW / 800;\n\nlet score = 0, gemsCollected = 0, pearlsFound = 0;\nlet gameOver = false, gameWon = false, screenShake = 0;\nlet clock = 0;\n\nconst PALETTE = {\n  fur: \"#ea580c\", furLight: \"#f97316\", furDark: \"#c2410c\",\n  belly: \"#ffffff\", earOuter: \"#1e293b\", earInner: \"#2563eb\", nose: \"#0b0f1a\",\n  suit: \"#ffffff\", suitTrim: \"#cbd5e1\", crestRing: \"#38bdf8\", crestFace: \"#070a13\",\n  eyeCyan: \"#06b6d4\", eyeGold: \"#eab308\",\n  goggle: \"#bfeaf5\", goggleFrame: \"#0f172a\",\n  gold: \"#ffd166\", pearl: \"#eafcff\",\n  cyan: \"#5eead4\", coral: \"#ff8a4c\"\n};\n\nconst diver = {\n  x: canvas.width / 2, y: 100, radius: 15,\n  vx: 0, vy: 0,\n  speed: 0.26, drag: 0.95, gravity: 0.07,\n  oxygen: 100, maxOxygen: 100,\n  health: 100, maxHealth: 100,\n  flashTime: 0,\n  facing: 1,\n  tankLevel: 1, hullLevel: 1, gunLevel: 1\n};\n\nlet particles = [], pulses = [], monsters = [], gems = [], plants = [], rocks = [], bubblesAmbient = [], popups = [];\nlet cameraY = 0;\nconst worldHeight = 3000;\nconst keys = {};\nlet mouseX = 0, mouseY = 0;\n\nwindow.addEventListener(\"keydown\", e => {\n  if (startFromTitle()) return;\n  if ((gameOver || gameWon) && (e.key === \"r\" || e.key === \"R\")) restart();\n});\nlet pointerHeld = false, pressTime = 0, lastTapTime = 0;\nfunction updatePointer(e) {\n  const rect = canvas.getBoundingClientRect();\n  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);\n  mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);\n}\ncanvas.addEventListener(\"pointermove\", updatePointer);\ncanvas.addEventListener(\"pointerdown\", e => {\n  e.preventDefault();\n  initAudio();\n  updatePointer(e);\n  if (startFromTitle()) return;\n  if (gameOver || gameWon) { restart(); return; }\n  pointerHeld = true;\n  pressTime = performance.now();\n  canvas.setPointerCapture(e.pointerId);\n});\ncanvas.addEventListener(\"pointerup\", e => {\n  updatePointer(e);\n  pointerHeld = false;\n  if (gameOver || gameWon) return;\n  const now = performance.now();\n  if (now - pressTime < 220) { // quick tap/click\n    if (now - lastTapTime < 350) { firePulse(); lastTapTime = 0; }\n    else lastTapTime = now;\n  }\n});\ncanvas.addEventListener(\"pointercancel\", () => pointerHeld = false);\ncanvas.style.touchAction = \"none\";\n\nlet audioCtx, humOsc, humGain, humFilter, audioStarted = false, lastBeepTime = 0;\nfunction initAudio() {\n  if (audioStarted) return;\n  audioStarted = true;\n  audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n  humOsc = audioCtx.createOscillator();\n  humOsc.type = \"sine\";\n  humOsc.frequency.value = 40;\n  humFilter = audioCtx.createBiquadFilter();\n  humFilter.type = \"lowpass\";\n  humFilter.frequency.value = 180;\n  humGain = audioCtx.createGain();\n  humGain.gain.value = 0;\n  humOsc.connect(humFilter).connect(humGain).connect(audioCtx.destination);\n  humOsc.start();\n}\nfunction playLowAirBeep() {\n  if (!audioCtx) return;\n  const o = audioCtx.createOscillator(), g = audioCtx.createGain();\n  o.type = \"square\"; o.frequency.value = 880;\n  g.gain.value = 0.0001;\n  o.connect(g).connect(audioCtx.destination);\n  const now = audioCtx.currentTime;\n  g.gain.linearRampToValueAtTime(0.11, now + 0.02);\n  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);\n  o.start(now); o.stop(now + 0.2);\n}\n\nfunction spawnParticles(x, y, color, count, speedFactor = 1) {\n  for (let i = 0; i < count; i++) {\n    particles.push({\n      x, y,\n      vx: (Math.random() - 0.5) * 4 * speedFactor,\n      vy: (Math.random() - 0.5) * 4 * speedFactor,\n      radius: Math.random() * 3 + 1,\n      color, alpha: 1, decay: Math.random() * 0.02 + 0.01\n    });\n  }\n}\nfunction spawnPopup(x, y, text, color) {\n  popups.push({ x, y, text, color, alpha: 1, vy: -0.6 });\n}\nfunction firePulse() {\n  // 130 was a third of an 800-wide lane. Left alone it would clear HALF of a\n  // portrait one — the same button quietly becoming a stronger weapon.\n  pulses.push({ x: diver.x, y: diver.y, radius: 6, maxRadius: 130 * WSC, hit: new Set() });\n  spawnParticles(diver.x, diver.y, PALETTE.cyan, 18, 1.6);\n  screenShake = Math.max(screenShake, 2.5);\n}\n\nfunction initWorld() {\n  particles = []; pulses = []; monsters = []; gems = []; plants = []; rocks = []; popups = [];\n  for (let y = 300; y < worldHeight - 200; y += 400) {\n    plants.push({ x: Math.random() * (WW * 0.75) + WW * 0.125, y, sway: Math.random() * 10 });\n  }\n  for (let i = 0; i < 25; i++) {\n    gems.push({ x: Math.random() * (WW - 100) + 50, y: Math.random() * (worldHeight - 400) + 350, isPearl: Math.random() < 0.30, collected: false, bob: Math.random() * 10 });\n  }\n  for (let i = 0; i < 8; i++) spawnMonster();\n  for (let i = 0; i < 40; i++) {\n    rocks.push({ x: Math.random() * (WW + 100) - 50, y: Math.random() * worldHeight, r: Math.random() * 40 + 20, depth: Math.random() * 0.4 + 0.15 });\n  }\n  bubblesAmbient = [];\n  for (let i = 0; i < 30; i++) {\n    bubblesAmbient.push({ x: Math.random() * WW, y: Math.random() * worldHeight, r: Math.random() * 2.5 + 0.5, speed: Math.random() * 0.4 + 0.15, wob: Math.random() * Math.PI * 2 });\n  }\n}\nfunction spawnMonster() {\n  monsters.push({\n    x: Math.random() * (WW - 100) + 50, y: Math.random() * (worldHeight - 500) + 400,\n    vx: (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 1.5 + 1),\n    radius: 17, health: 2, flash: 0, finPhase: Math.random() * 10\n  });\n}\n\nfunction restart() {\n  score = 0; gemsCollected = 0; pearlsFound = 0;\n  gameOver = false; gameWon = false; screenShake = 0;\n  diver.x = WW / 2; diver.y = 100; diver.vx = 0; diver.vy = 0;\n  diver.oxygen = diver.maxOxygen; diver.health = diver.maxHealth; diver.flashTime = 0;\n  cameraY = 0;\n  initWorld();\n}\n\nfunction update() {\n  clock++;\n  // The card holds the dive. The clock still runs, so the light shafts, the\n  // bubbles and the plants keep moving behind it — a still picture would look\n  // like the game had failed to load.\n  if (titleOpen) return;\n  if (gameOver || gameWon) return;\n  if (screenShake > 0) screenShake -= 0.1;\n\n  // hold to swim toward the pointer; quick tap fires\n  if (pointerHeld) {\n    const tx = mouseX - diver.x, ty = (mouseY + cameraY) - diver.y;\n    const dist = Math.hypot(tx, ty);\n    if (dist > 24) {\n      const pull = Math.min(1, (dist - 24) / 80);\n      diver.vx += (tx / dist) * diver.speed * pull;\n      diver.vy += (ty / dist) * diver.speed * pull;\n      if (Math.abs(tx) > 6) diver.facing = tx >= 0 ? 1 : -1;\n    }\n  }\n\n  diver.vy += diver.gravity;\n  diver.vx *= diver.drag;\n  diver.vy *= diver.drag;\n  diver.x += diver.vx;\n  diver.y += diver.vy;\n\n  if (diver.x < diver.radius) { diver.x = diver.radius; diver.vx *= -0.5; }\n  if (diver.x > canvas.width - diver.radius) { diver.x = canvas.width - diver.radius; diver.vx *= -0.5; }\n  if (diver.y < 50) { diver.y = 50; diver.vy = 0; }\n  if (diver.y > worldHeight) diver.y = worldHeight;\n\n  if (Math.abs(diver.vx) > 0.5 || Math.abs(diver.vy) > 0.5) {\n    if (Math.random() < 0.4) {\n      particles.push({\n        x: diver.x - diver.vx * 2, y: diver.y - diver.vy * 2,\n        vx: (Math.random() - 0.5) * 1, vy: Math.random() * 0.5,\n        radius: Math.random() * 2.5 + 0.5,\n        color: \"rgba(200, 240, 255, 0.55)\", alpha: 0.6, decay: 0.015\n      });\n    }\n  }\n\n  cameraY += ((diver.y - canvas.height / 2) - cameraY) * 0.1;\n  cameraY = Math.max(0, Math.min(cameraY, worldHeight - canvas.height));\n\n  if (diver.y < 150) diver.oxygen = Math.min(diver.maxOxygen, diver.oxygen + 1.5);\n  else diver.oxygen -= 0.04 / diver.tankLevel;\n  if (diver.oxygen <= 0) gameOver = true;\n  if (diver.flashTime > 0) diver.flashTime--;\n\n  if (audioCtx) {\n    const depthT2 = Math.min(1, diver.y / worldHeight);\n    const now = audioCtx.currentTime;\n    humGain.gain.linearRampToValueAtTime(0.018 + depthT2 * 0.1, now + 0.2);\n    humOsc.frequency.linearRampToValueAtTime(38 + depthT2 * 34, now + 0.2);\n\n    if (diver.oxygen < 25) {\n      const interval = 180 + (diver.oxygen / 25) * 520;\n      if (performance.now() - lastBeepTime > interval) {\n        playLowAirBeep();\n        lastBeepTime = performance.now();\n      }\n    }\n  }\n\n  pulses.forEach((p, idx) => {\n    p.radius += 7;\n    if (p.radius > p.maxRadius) pulses.splice(idx, 1);\n  });\n  particles.forEach((p, idx) => {\n    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;\n    if (p.alpha <= 0) particles.splice(idx, 1);\n  });\n  popups.forEach((t, idx) => {\n    t.y += t.vy; t.alpha -= 0.012;\n    if (t.alpha <= 0) popups.splice(idx, 1);\n  });\n  bubblesAmbient.forEach(b => {\n    b.y -= b.speed; b.wob += 0.02;\n    if (b.y < -10) { b.y = worldHeight + 10; b.x = Math.random() * WW; }\n  });\n\n  plants.forEach(p => {\n    if (Math.random() < 0.05) {\n      particles.push({\n        x: p.x + (Math.random() - 0.5) * 10, y: p.y - 10,\n        vx: (Math.random() - 0.5) * 0.5, vy: -Math.random() * 1.5 - 0.5,\n        radius: Math.random() * 3 + 1, color: \"rgba(120, 235, 170, 0.6)\", alpha: 0.8, decay: 0.008\n      });\n    }\n    let dist = Math.hypot(diver.x - p.x, diver.y - p.y);\n    if (dist < 50) diver.oxygen = Math.min(diver.maxOxygen, diver.oxygen + 0.3);\n  });\n\n  monsters.forEach((m, mIdx) => {\n    m.x += m.vx; m.finPhase += 0.1;\n    if (m.x < 50 || m.x > canvas.width - 50) m.vx *= -1;\n    if (m.flash > 0) m.flash--;\n\n    let distToPlayer = Math.hypot(diver.x - m.x, diver.y - m.y);\n    if (distToPlayer < diver.radius + m.radius && diver.flashTime === 0) {\n      diver.health -= 25 / diver.hullLevel;\n      diver.flashTime = 40;\n      screenShake = 5;\n      diver.vx = (diver.x - m.x) * 0.5;\n      if (diver.health <= 0) gameOver = true;\n    }\n    pulses.forEach(p => {\n      const d = Math.hypot(p.x - m.x, p.y - m.y);\n      if (Math.abs(d - p.radius) < 16 && !p.hit.has(m)) {\n        p.hit.add(m);\n        m.health--; m.flash = 5;\n        spawnParticles(m.x, m.y, \"#ff5a4d\", 8, 1.2);\n        if (m.health <= 0) {\n          monsters.splice(mIdx, 1);\n          score += 250;\n          spawnPopup(m.x, m.y, \"+250\", PALETTE.coral);\n          spawnMonster();\n        }\n      }\n    });\n  });\n\n  gems.forEach(g => {\n    if (g.collected) return;\n    g.bob += 0.05;\n    let dist = Math.hypot(diver.x - g.x, diver.y - g.y);\n    if (dist < diver.radius + 10) {\n      g.collected = true;\n      if (g.isPearl) {\n        pearlsFound++; score += 1000;\n        spawnParticles(g.x, g.y, PALETTE.pearl, 16);\n        spawnPopup(g.x, g.y, \"+1000\", PALETTE.pearl);\n        if (pearlsFound >= 10) gameWon = true;\n      } else {\n        gemsCollected += 5; score += 100;\n        spawnParticles(g.x, g.y, PALETTE.gold, 9);\n        spawnPopup(g.x, g.y, \"+100\", PALETTE.gold);\n      }\n    }\n  });\n}\n\n// ---------- Drawing ----------\nfunction drawFox(x, y, vx, vy, flashing, facing) {\n  const t = clock * 0.12;\n  const speed = Math.hypot(vx, vy);\n  const tailWag = Math.sin(t) * (0.25 + Math.min(speed * 0.05, 0.3));\n  const finFlap = Math.sin(t * 1.6) * 0.35;\n  const tilt = Math.max(-0.4, Math.min(0.4, vy * 0.05));\n\n  if (flashing && clock % 8 < 4) return; // hit-flicker\n\n  ctx.save();\n  ctx.translate(x, y);\n  ctx.scale(facing, 1);\n  ctx.rotate(tilt * facing);\n\n  // tail — big fox brush with white tip (like the avatar)\n  ctx.save();\n  ctx.translate(-14, 2);\n  ctx.rotate(tailWag);\n  ctx.fillStyle = PALETTE.fur;\n  ctx.beginPath();\n  ctx.moveTo(0, -6);\n  ctx.quadraticCurveTo(-18, -6, -24, 4);\n  ctx.quadraticCurveTo(-16, 11, 0, 6);\n  ctx.closePath();\n  ctx.fill();\n  ctx.fillStyle = \"#ffffff\";\n  ctx.beginPath();\n  ctx.moveTo(-24, 4);\n  ctx.lineTo(-16, -4.5);\n  ctx.lineTo(-12, 2);\n  ctx.quadraticCurveTo(-17, 8, -24, 4);\n  ctx.closePath();\n  ctx.fill();\n  ctx.restore();\n\n  // back flippers (navy, matching his boots)\n  ctx.fillStyle = PALETTE.earOuter;\n  ctx.save();\n  ctx.translate(-4, 12);\n  ctx.rotate(finFlap);\n  ctx.beginPath();\n  ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.restore();\n  ctx.save();\n  ctx.translate(4, 12);\n  ctx.rotate(-finFlap);\n  ctx.beginPath();\n  ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.restore();\n\n  // oxygen tank on back\n  ctx.fillStyle = \"#3a4750\";\n  ctx.beginPath();\n  ctx.roundRect(-13, -10, 8, 18, 3);\n  ctx.fill();\n\n  // body — white dive suit like his avatar suit\n  ctx.fillStyle = PALETTE.suit;\n  ctx.strokeStyle = PALETTE.suitTrim;\n  ctx.lineWidth = 1.5;\n  ctx.beginPath();\n  ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.stroke();\n  // suit collar seam\n  ctx.strokeStyle = \"#e2e8f0\";\n  ctx.lineWidth = 1.2;\n  ctx.beginPath(); ctx.moveTo(4, -10); ctx.lineTo(1, -2); ctx.lineTo(9, -6); ctx.stroke();\n\n  // HOUSE CREST — the \"8\": sky-ringed disc, twin circles, compass points\n  ctx.save();\n  ctx.translate(0, 1);\n  ctx.scale(0.055, 0.055);\n  const R = 160;\n  ctx.fillStyle = PALETTE.crestFace;\n  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = PALETTE.crestRing; ctx.lineWidth = R * 0.1; ctx.stroke();\n  ctx.fillStyle = PALETTE.crestRing;\n  for (let i = 0; i < 4; i++) {\n    ctx.save(); ctx.rotate(i * Math.PI / 2);\n    ctx.beginPath(); ctx.moveTo(0, -R * 0.96); ctx.lineTo(-R * 0.05, -R * 1.1); ctx.lineTo(0, -R * 1.2); ctx.lineTo(R * 0.05, -R * 1.1); ctx.closePath(); ctx.fill();\n    ctx.restore();\n  }\n  ctx.strokeStyle = \"#ffffff\"; ctx.lineCap = \"round\";\n  ctx.lineWidth = R * 0.17;\n  ctx.beginPath(); ctx.arc(0, -R * 0.24, R * 0.26, 0, Math.PI * 2); ctx.stroke();\n  ctx.beginPath(); ctx.arc(0, R * 0.28, R * 0.36, 0, Math.PI * 2); ctx.stroke();\n  ctx.strokeStyle = \"#7dd3fc\"; ctx.lineWidth = R * 0.035;\n  ctx.beginPath(); ctx.arc(0, -R * 0.24, R * 0.26, 0, Math.PI * 2); ctx.stroke();\n  ctx.beginPath(); ctx.arc(0, R * 0.28, R * 0.36, 0, Math.PI * 2); ctx.stroke();\n  ctx.restore();\n\n  // head\n  ctx.fillStyle = PALETTE.fur;\n  ctx.beginPath();\n  ctx.ellipse(13, -3, 10, 9, 0, 0, Math.PI * 2);\n  ctx.fill();\n\n  // ears — navy outer with blue inner, like the avatar\n  ctx.fillStyle = PALETTE.earOuter;\n  ctx.beginPath(); ctx.moveTo(7, -10); ctx.lineTo(5, -20); ctx.lineTo(13, -11); ctx.closePath(); ctx.fill();\n  ctx.beginPath(); ctx.moveTo(16, -10); ctx.lineTo(20, -19); ctx.lineTo(21, -9); ctx.closePath(); ctx.fill();\n  ctx.fillStyle = PALETTE.earInner;\n  ctx.beginPath(); ctx.moveTo(7.5, -12); ctx.lineTo(6.7, -17); ctx.lineTo(11, -12); ctx.closePath(); ctx.fill();\n  ctx.beginPath(); ctx.moveTo(17, -11); ctx.lineTo(19.3, -16.5); ctx.lineTo(19.8, -10.5); ctx.closePath(); ctx.fill();\n\n  // snout patch\n  ctx.fillStyle = PALETTE.belly;\n  ctx.beginPath();\n  ctx.ellipse(19, 0, 5, 4, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.fillStyle = PALETTE.nose;\n  ctx.beginPath();\n  ctx.ellipse(23, -1, 2, 1.6, 0, 0, Math.PI * 2);\n  ctx.fill();\n\n  // cheeks (blush)\n  ctx.fillStyle = \"rgba(255,140,120,0.35)\";\n  ctx.beginPath(); ctx.ellipse(9, 1, 2.4, 1.6, 0, 0, Math.PI * 2); ctx.fill();\n\n  // goggles — clear lens showing his heterochromia eye (cyan front / gold back)\n  ctx.fillStyle = PALETTE.goggleFrame;\n  ctx.beginPath(); ctx.ellipse(15, -5, 5.2, 4.4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"rgba(191,234,245,0.5)\";\n  ctx.beginPath(); ctx.ellipse(15, -5, 3.8, 3.2, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = facing === 1 ? PALETTE.eyeCyan : PALETTE.eyeGold;\n  ctx.beginPath(); ctx.arc(15.5, -5, 1.8, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#000000\";\n  ctx.beginPath(); ctx.ellipse(15.8, -5, 0.7, 1.3, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"rgba(255,255,255,0.85)\";\n  ctx.beginPath(); ctx.arc(14.9, -5.8, 0.5, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = PALETTE.goggleFrame; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(5, -8); ctx.lineTo(10.2, -6.6); ctx.stroke();\n\n  ctx.restore();\n\n  // exhale bubble occasionally\n  if (Math.random() < 0.02) {\n    spawnParticles(x + facing * 20, y - 4, \"rgba(220,245,255,0.7)\", 1, 0.6);\n  }\n}\n\nfunction drawBoat(cx, cy) {\n  ctx.save();\n  ctx.translate(cx, cy);\n  ctx.fillStyle = \"#5b3a22\";\n  ctx.beginPath();\n  ctx.moveTo(-90, 0);\n  ctx.quadraticCurveTo(0, 26, 90, 0);\n  ctx.quadraticCurveTo(60, -14, -60, -14);\n  ctx.closePath();\n  ctx.fill();\n  ctx.strokeStyle = \"#3a2414\"; ctx.lineWidth = 2; ctx.stroke();\n  ctx.fillStyle = \"#8a5a34\";\n  ctx.beginPath(); ctx.moveTo(-58, -14); ctx.lineTo(58, -14); ctx.lineTo(50, -20); ctx.lineTo(-50, -20); ctx.closePath(); ctx.fill();\n  ctx.strokeStyle = \"#3a2414\"; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -70); ctx.stroke();\n  ctx.fillStyle = PALETTE.crestRing;\n  ctx.beginPath(); ctx.moveTo(0, -70); ctx.lineTo(28, -62); ctx.lineTo(0, -54); ctx.closePath(); ctx.fill();\n  ctx.fillStyle = \"#ffffff\";\n  ctx.beginPath(); ctx.arc(10, -62, 3, 0, Math.PI * 2); ctx.fill();\n  ctx.restore();\n\n  ctx.fillStyle = \"rgba(234,246,250,0.85)\";\n  ctx.font = \"700 11px 'Baloo 2', sans-serif\";\n  ctx.textAlign = \"center\";\n  ctx.fillText(\"YOUR BOAT — SURFACE FOR AIR\", cx, cy + 42);\n  ctx.textAlign = \"left\";\n}\n\nfunction drawAnglerfish(m) {\n  const wobble = Math.sin(m.finPhase) * 4;\n  ctx.save();\n  ctx.translate(m.x, m.y);\n  const dir = m.vx >= 0 ? 1 : -1;\n  ctx.scale(dir, 1);\n\n  // fins\n  ctx.fillStyle = m.flash > 0 ? \"#ffffff\" : \"#5b2a6b\";\n  ctx.beginPath();\n  ctx.moveTo(-m.radius * 0.6, 0);\n  ctx.quadraticCurveTo(-m.radius - 10, wobble, -m.radius * 0.7, 8);\n  ctx.closePath(); ctx.fill();\n\n  // body glow\n  const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, m.radius + 6);\n  grad.addColorStop(0, m.flash > 0 ? \"#ffffff\" : \"#7a3b8c\");\n  grad.addColorStop(1, m.flash > 0 ? \"#eeeeee\" : \"#3a1a48\");\n  ctx.fillStyle = grad;\n  ctx.beginPath();\n  ctx.ellipse(0, 0, m.radius, m.radius * 0.82, 0, 0, Math.PI * 2);\n  ctx.fill();\n\n  // teeth\n  ctx.fillStyle = \"#f5f0e6\";\n  for (let i = -1; i <= 1; i++) {\n    ctx.beginPath();\n    ctx.moveTo(m.radius * 0.35 + i * 4, m.radius * 0.35);\n    ctx.lineTo(m.radius * 0.35 + i * 4 + 2, m.radius * 0.35 + 5);\n    ctx.lineTo(m.radius * 0.35 + i * 4 - 2, m.radius * 0.35 + 5);\n    ctx.closePath(); ctx.fill();\n  }\n\n  // eye\n  ctx.fillStyle = \"#ffe066\";\n  ctx.beginPath(); ctx.arc(m.radius * 0.4, -m.radius * 0.15, 3.2, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#1a0a20\";\n  ctx.beginPath(); ctx.arc(m.radius * 0.4 + 1, -m.radius * 0.15, 1.5, 0, Math.PI * 2); ctx.fill();\n\n  // lure\n  const lureBob = Math.sin(m.finPhase * 1.4) * 3;\n  ctx.strokeStyle = \"#5b2a6b\"; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(m.radius * 0.2, -m.radius * 0.7);\n  ctx.quadraticCurveTo(m.radius * 0.5, -m.radius * 1.3, m.radius * 0.75, -m.radius * 1.4 + lureBob);\n  ctx.stroke();\n  const lureGlow = ctx.createRadialGradient(m.radius * 0.75, -m.radius * 1.4 + lureBob, 0, m.radius * 0.75, -m.radius * 1.4 + lureBob, 12);\n  lureGlow.addColorStop(0, \"rgba(120,255,220,0.9)\");\n  lureGlow.addColorStop(1, \"rgba(120,255,220,0)\");\n  ctx.fillStyle = lureGlow;\n  ctx.beginPath(); ctx.arc(m.radius * 0.75, -m.radius * 1.4 + lureBob, 12, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#d8fff2\";\n  ctx.beginPath(); ctx.arc(m.radius * 0.75, -m.radius * 1.4 + lureBob, 3, 0, Math.PI * 2); ctx.fill();\n\n  ctx.restore();\n}\n\nfunction roundRect(x, y, w, h, r) {\n  ctx.beginPath();\n  ctx.roundRect(x, y, w, h, r);\n}\n\nfunction drawIconTank(x, y) {\n  ctx.fillStyle = \"#3a4750\";\n  ctx.beginPath(); ctx.roundRect(x, y - 8, 10, 16, 2); ctx.fill();\n  ctx.fillStyle = PALETTE.cyan;\n  ctx.beginPath(); ctx.roundRect(x + 2, y - 5, 6, 5, 1); ctx.fill();\n}\nfunction drawIconHeart(x, y) {\n  ctx.fillStyle = \"#ff5a6b\";\n  ctx.beginPath();\n  ctx.moveTo(x, y + 5);\n  ctx.bezierCurveTo(x - 10, y - 4, x - 4, y - 11, x, y - 5);\n  ctx.bezierCurveTo(x + 4, y - 11, x + 10, y - 4, x, y + 5);\n  ctx.fill();\n}\nfunction drawIconGem(x, y, color, sc) {\n  const k = sc || 1;\n  ctx.fillStyle = color;\n  ctx.beginPath();\n  ctx.moveTo(x, y - 7 * k); ctx.lineTo(x + 6 * k, y - 1 * k); ctx.lineTo(x, y + 7 * k); ctx.lineTo(x - 6 * k, y - 1 * k);\n  ctx.closePath(); ctx.fill();\n}\n\n\n// ---- Opening instructions -------------------------------------------------\n// One at a time, in the pond's PERFECT CAST idiom: Baloo 2, fat white stroke,\n// coloured fill, bounce in and fade out. Every line is auto-fitted to the\n// canvas width so a long instruction can never run outside the square.\nconst INTRO_STEPS = [\n  { head: \"SWIM\",                homeSub: 1, sub: \"press & hold toward the fox's target\", color: \"#5eead4\" },\n  { head: \"ENERGY PULSE\",        sub: \"double-click / double-tap\",            color: \"#ffd166\" },\n  { head: \"SURFACE AT THE BOAT\", sub: \"for air\",                              color: \"#7dd3fc\" },\n  { head: \"AVOID ANGLERFISH\",    sub: \"\",                                     color: \"#ff8a4c\" }\n];\nconst INTRO_HOLD = 165;            // frames per step, ~2.75s at 60fps\nlet introTick = 0;                 // deliberately NOT reset by restart():\n                                   // the hints teach once per dive, not per death\nfunction introFit(text, weight, px, maxW) {\n  ctx.font = weight + \" \" + px + \"px 'Baloo 2', sans-serif\";\n  const w = ctx.measureText(text).width;\n  return w <= maxW ? px : Math.max(11, Math.floor(px * maxW / w));\n}\nfunction drawIntroSteps() {\n  if (introTick >= INTRO_STEPS.length * INTRO_HOLD) return;\n  const idx = Math.floor(introTick / INTRO_HOLD);\n  const t = introTick % INTRO_HOLD;\n  introTick++;\n  const step = INTRO_STEPS[idx];\n  const pop = t < 12 ? t / 12 : 1;                                  // bounce in\n  const fade = t > INTRO_HOLD - 22 ? (INTRO_HOLD - t) / 22 : 1;     // ease out\n  const wobble = 1 + Math.sin(clock * 0.2) * 0.02;\n  const maxW = canvas.width - 90;\n  const headPx = introFit(step.head, \"800\", 60, maxW);\n  const subPx = step.sub ? introFit(step.sub, \"700\", 25, maxW) : 0;\n  /* ABOVE THE DIVER, NOT ON HIM.\n     This was a fixed `canvas.height * 0.567` and the camera parks the fox at\n     `canvas.height / 2`, so the two sat on each other: measured on the running\n     game, the fox's pixel box was y 290..325 and the text's 297..340.\n\n     It follows him rather than moving to a better fixed number, because there\n     is no better fixed number. The dive OPENS at the surface and he sinks —\n     sampled over the first tip he crosses from 0.17 to 0.52 of the screen — so\n     any fixed anchor in that band is under him at some point.\n\n     BOTTOM of the block, a margin above the TOP of the fox. His box is about\n     36px tall, so 22 clears his ears and the helmet glass.\n\n     Clamped under the banner, which is 62px on desktop and two rows on a\n     phone — asked of the layout rather than assumed, because a phone's is\n     more than twice the height. */\n  const FOX_TOP = (diver.y - cameraY) - 22;\n  const dropBelow = step.sub ? headPx * 0.78 + subPx * 0.25 : 0;\n  const hudBottom = PORTRAIT ? (WW / 520) * 104 : 72;\n  const introY = Math.max(hudBottom + headPx * 0.72 + 12,\n                          FOX_TOP - 16 - dropBelow);\n  ctx.save();\n  ctx.globalAlpha = Math.max(0, Math.min(1, fade));\n  ctx.translate(canvas.width / 2, introY - (1 - pop) * 30);\n  ctx.scale(pop * wobble, pop * wobble);\n  ctx.textAlign = \"center\";\n  ctx.lineJoin = \"round\";\n  ctx.font = \"800 \" + headPx + \"px 'Baloo 2', sans-serif\";\n  ctx.strokeStyle = \"#ffffff\"; ctx.lineWidth = 10;\n  ctx.strokeText(step.head, 0, 0);\n  ctx.fillStyle = step.color;\n  ctx.fillText(step.head, 0, 0);\n  if (step.sub) {\n    // dark outline / light fill for the smaller line — the water behind is dark,\n    // so the head's white-on-colour treatment would muddy at this size\n    ctx.font = \"700 \" + subPx + \"px 'Baloo 2', sans-serif\";\n    ctx.strokeStyle = \"rgba(4,12,22,0.8)\"; ctx.lineWidth = 6;\n    ctx.strokeText(step.sub, 0, headPx * 0.78);\n    ctx.fillStyle = \"#eaf6fa\";\n    ctx.fillText(step.sub, 0, headPx * 0.78);\n  }\n  ctx.restore();\n  ctx.textAlign = \"left\";\n}\n\nfunction draw() {\n  ctx.save();\n  if (screenShake > 0) {\n    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);\n  }\n\n  // background gradient by depth\n  const depthT = Math.min(1, cameraY / worldHeight);\n  let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);\n  bgGrad.addColorStop(0, mixColor(\"#1d4f68\", \"#040a10\", depthT));\n  bgGrad.addColorStop(1, mixColor(\"#0a2338\", \"#010306\", depthT));\n  ctx.fillStyle = bgGrad;\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\n  ctx.translate(0, -cameraY);\n\n  // caustic light rays near surface\n  const rayAlpha = Math.max(0, 0.25 - depthT * 0.3);\n  if (rayAlpha > 0) {\n    for (let i = 0; i < 5; i++) {\n      const rx = WW * 0.125 + i * (WW * 0.2) + Math.sin(clock * 0.01 + i) * 30 * WSC;\n      const rg = ctx.createLinearGradient(rx, cameraY, rx + 60, cameraY + 500);\n      rg.addColorStop(0, `rgba(180,235,255,${rayAlpha})`);\n      rg.addColorStop(1, \"rgba(180,235,255,0)\");\n      ctx.fillStyle = rg;\n      ctx.beginPath();\n      ctx.moveTo(rx, cameraY);\n      ctx.lineTo(rx + 40, cameraY);\n      ctx.lineTo(rx - 30, cameraY + 500);\n      ctx.lineTo(rx - 70, cameraY + 500);\n      ctx.closePath();\n      ctx.fill();\n    }\n  }\n\n  drawBoat(canvas.width / 2, 120);\n\n  // parallax rocks\n  rocks.forEach(r => {\n    const py = r.y - cameraY * (1 - r.depth) - cameraY;\n    ctx.fillStyle = `rgba(10, ${20 + r.depth * 20}, ${35 + r.depth * 25}, ${0.5 + r.depth * 0.3})`;\n    ctx.beginPath();\n    ctx.ellipse(r.x, r.y + cameraY * r.depth, r.r, r.r * 0.7, 0, 0, Math.PI * 2);\n    ctx.fill();\n  });\n\n  // ambient bubbles\n  bubblesAmbient.forEach(b => {\n    ctx.strokeStyle = \"rgba(200,235,245,0.25)\";\n    ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.arc(b.x + Math.sin(b.wob) * 4, b.y, b.r, 0, Math.PI * 2);\n    ctx.stroke();\n  });\n\n  // plants\n  plants.forEach(p => {\n    const sway = Math.sin(clock * 0.03 + p.sway) * 6;\n    ctx.fillStyle = \"#3fd18a\";\n    ctx.beginPath();\n    ctx.moveTo(p.x, p.y);\n    ctx.quadraticCurveTo(p.x - 15 + sway, p.y - 20, p.x - 5 + sway, p.y - 40);\n    ctx.quadraticCurveTo(p.x + 15 + sway, p.y - 20, p.x, p.y);\n    ctx.fill();\n    let plantGlow = ctx.createRadialGradient(p.x, p.y - 20, 5, p.x, p.y - 20, 45);\n    plantGlow.addColorStop(0, \"rgba(63, 209, 138, 0.2)\");\n    plantGlow.addColorStop(1, \"rgba(0,0,0,0)\");\n    ctx.fillStyle = plantGlow;\n    ctx.beginPath(); ctx.arc(p.x, p.y - 20, 45, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = \"rgba(180,255,210,0.9)\";\n    ctx.font = \"700 10px 'Baloo 2', sans-serif\";\n    ctx.textAlign = \"center\";\n    ctx.fillText(\"OXYGEN\", p.x, p.y + 16);\n    ctx.textAlign = \"left\";\n  });\n\n  // gems\n  gems.forEach(g => {\n    if (g.collected) return;\n    const bob = Math.sin(g.bob) * 3;\n    const pulse = g.isPearl ? 1 + Math.sin(clock * 0.08) * 0.08 : 1;\n    ctx.save();\n    ctx.translate(g.x, g.y + bob);\n    ctx.scale(pulse, pulse);\n    ctx.fillStyle = g.isPearl ? PALETTE.pearl : PALETTE.gold;\n    ctx.shadowColor = g.isPearl ? \"#bff3ff\" : \"#ffaa33\";\n    ctx.shadowBlur = 14;\n    if (g.isPearl) {\n      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();\n      ctx.shadowBlur = 0;\n      ctx.fillStyle = \"#eafcff\";\n      ctx.font = \"700 9px 'Baloo 2', sans-serif\";\n      ctx.textAlign = \"center\";\n      ctx.fillText(\"PEARL\", 0, 20);\n      ctx.textAlign = \"left\";\n    } else {\n      ctx.beginPath();\n      ctx.moveTo(0, -7); ctx.lineTo(6, -1); ctx.lineTo(0, 7); ctx.lineTo(-6, -1);\n      ctx.closePath(); ctx.fill();\n    }\n    ctx.shadowBlur = 0;\n    ctx.restore();\n  });\n\n  // energy pulses\n  pulses.forEach(p => {\n    const t = p.radius / p.maxRadius;\n    ctx.strokeStyle = `rgba(94, 234, 212, ${1 - t})`;\n    ctx.lineWidth = 4 * (1 - t) + 1;\n    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.stroke();\n    ctx.strokeStyle = `rgba(220, 255, 250, ${(1 - t) * 0.5})`;\n    ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 0.6, 0, Math.PI * 2); ctx.stroke();\n  });\n\n  monsters.forEach(drawAnglerfish);\n\n  particles.forEach(p => {\n    ctx.fillStyle = p.color;\n    ctx.globalAlpha = p.alpha;\n    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();\n  });\n  ctx.globalAlpha = 1.0;\n\n  drawFox(diver.x, diver.y, diver.vx, diver.vy, diver.flashTime > 0, diver.facing);\n\n  // popups\n  popups.forEach(t => {\n    ctx.globalAlpha = Math.max(0, t.alpha);\n    ctx.fillStyle = t.color;\n    ctx.font = \"700 14px 'Baloo 2', sans-serif\";\n    ctx.textAlign = \"center\";\n    ctx.fillText(t.text, t.x, t.y);\n  });\n  ctx.globalAlpha = 1.0;\n  ctx.textAlign = \"left\";\n\n  ctx.restore();\n\n  // vignette\n  const vg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.35, canvas.width/2, canvas.height/2, canvas.height*0.75);\n  vg.addColorStop(0, \"rgba(0,0,0,0)\");\n  vg.addColorStop(1, \"rgba(0,0,0,0.45)\");\n  ctx.fillStyle = vg;\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\n  // NO HUD BEHIND THE CARD. An attract screen showing a live air gauge and\n  // DEPTH 100m reads as the game already running; the first version did that\n  // and the banner sat straight through the title.\n  if (!titleOpen) drawHUD();\n  // The four opening tips teach once per dive; letting them run behind the\n  // card would spend them on nobody.\n  if (!titleOpen) drawIntroSteps();\n  if (titleOpen) { drawTitleCard(); ctx.restore(); return; }\n\n  if (gameOver) drawEndCard(\"#ff5a6b\", \"🦊💔\", \"SIGNAL LOST\", \"Your fox ran out of air in the deep.\");\n  if (gameWon) drawEndCard(\"#3fd18a\", \"🦊✨\", \"ALL PEARLS RECOVERED!\", \"The abyss has no more secrets to keep.\");\n}\n\nfunction mixColor(a, b, t) {\n  const pa = hexToRgb(a), pb = hexToRgb(b);\n  const r = Math.round(pa.r + (pb.r - pa.r) * t);\n  const g = Math.round(pa.g + (pb.g - pa.g) * t);\n  const bch = Math.round(pa.b + (pb.b - pa.b) * t);\n  return `rgb(${r},${g},${bch})`;\n}\nfunction hexToRgb(hex) {\n  const v = parseInt(hex.slice(1), 16);\n  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };\n}\n\n\n// ---- Rotating gameplay tips, far left of the HUD bar. Flush left so both\n// lines share one edge and the block reads steady as the text rotates.\nconst HUD_TIPS = [\n  [\"SWIM\",         \"press & hold toward the target\"],\n  [\"ENERGY PULSE\", \"double-click / double-tap\"],\n  [\"NEED AIR?\",    \"surface at your boat\"],\n  [\"ANGLERFISH\",   \"keep your distance\"]\n];\nconst TIP_HOLD = 340;   // frames per tip, ~5.7s\nfunction drawHudTip() {\n  const i = Math.floor(clock / TIP_HOLD) % HUD_TIPS.length;\n  const t = clock % TIP_HOLD;\n  const fade = Math.min(1, Math.min(t, TIP_HOLD - t) / 18);\n  const tip = HUD_TIPS[i];\n  ctx.save();\n  ctx.globalAlpha = Math.max(0, fade);\n  ctx.textAlign = \"left\";\n  // 14px, with the two baselines set so there is even breathing room between\n  // the block and the bar's top and bottom edges\n  ctx.font = \"700 14px 'Baloo 2', sans-serif\";\n  ctx.fillStyle = \"#ffb27a\";\n  ctx.fillText(tip[0], 26, 32);\n  ctx.fillStyle = \"#7fb8c9\";\n  ctx.fillText(tip[1], 26, 56);\n  ctx.restore();\n}\n\n// ---- SCORE / gems / PEARLS / DEPTH, all on one line.\n// Everything is measured first and shrunk together until it fits the space,\n// so a seven-digit score can never shove DEPTH off the end of the bar. DEPTH\n// is drawn a notch larger than the rest and lands flush on the right edge.\nconst DEPTH_BIGGER = 1.18;\nfunction drawHudStats(x0, x1, cy, base0, iconPx) {\n  const ICON = iconPx || 13;\n  const avail = x1 - x0, MINGAP = Math.round(13 * (ICON / 13));\n  const scoreTxt = \"SCORE \" + score;\n  const gemTxt = \"\" + gemsCollected;\n  const pearlTxt = pearlsFound + \"/10 PEARLS\";\n  const depthTxt = \"DEPTH \" + Math.floor(diver.y) + \"m\";\n  function widths(px) {\n    ctx.font = \"700 \" + px + \"px 'Baloo 2', sans-serif\";\n    const a = ctx.measureText(scoreTxt).width;\n    const b = ICON + 4 + ctx.measureText(gemTxt).width;\n    const c = ICON + 4 + ctx.measureText(pearlTxt).width;\n    ctx.font = \"700 \" + Math.round(px * DEPTH_BIGGER) + \"px 'Baloo 2', sans-serif\";\n    const d = ctx.measureText(depthTxt).width;\n    return [a, b, c, d];\n  }\n  let base = base0 || 16;\n  let w = widths(base);\n  let total = w[0] + w[1] + w[2] + w[3];\n  if (total + MINGAP * 3 > avail) {\n    base = Math.max(Math.round(ICON * 0.62), Math.floor(base * (avail - MINGAP * 3) / total));\n    w = widths(base);\n    total = w[0] + w[1] + w[2] + w[3];\n  }\n  const gap = Math.max(MINGAP, (avail - total) / 3);\n  const iconY = cy - Math.round(base * 0.32);\n  let x = x0;\n  ctx.save();\n  ctx.textAlign = \"left\";\n  ctx.font = \"700 \" + base + \"px 'Baloo 2', sans-serif\";\n  ctx.fillStyle = \"#eaf6fa\";\n  ctx.fillText(scoreTxt, x, cy);                     x += w[0] + gap;\n  drawIconGem(x + 6 * (ICON / 13), iconY, PALETTE.gold, ICON / 13);\n  ctx.fillText(gemTxt, x + ICON + 4, cy);            x += w[1] + gap;\n  drawIconGem(x + 6 * (ICON / 13), iconY, PALETTE.pearl, ICON / 13);\n  ctx.fillText(pearlTxt, x + ICON + 4, cy);          x += w[2] + gap;\n  ctx.font = \"700 \" + Math.round(base * DEPTH_BIGGER) + \"px 'Baloo 2', sans-serif\";\n  ctx.fillStyle = \"#7fb8c9\";\n  ctx.fillText(depthTxt, x, cy);\n  ctx.restore();\n}\n\n// ---- The fox in a diving bowl: a round glass helmet over his head, sealed\n// at a collar. Drawn head-first so the glass washes over him, which is what\n// sells it as being INSIDE the bowl rather than behind it.\nfunction drawFoxHelmet(x, y, scale) {\n  ctx.save();\n  ctx.translate(x, y);\n  ctx.scale(scale, scale);\n\n  ctx.fillStyle = \"#3a4750\";\n  ctx.beginPath(); ctx.roundRect(-10, 10, 20, 5, 2.5); ctx.fill();\n  ctx.fillStyle = \"#55636d\";\n  ctx.beginPath(); ctx.roundRect(-10, 10, 20, 2, 1); ctx.fill();\n\n  ctx.fillStyle = PALETTE.earOuter;\n  ctx.beginPath(); ctx.moveTo(-6, -7); ctx.lineTo(-9, -15); ctx.lineTo(-1, -10); ctx.closePath(); ctx.fill();\n  ctx.beginPath(); ctx.moveTo(6, -7); ctx.lineTo(9, -15); ctx.lineTo(1, -10); ctx.closePath(); ctx.fill();\n\n  ctx.fillStyle = PALETTE.fur;\n  ctx.beginPath(); ctx.ellipse(0, 1, 10.5, 9.5, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = PALETTE.belly;\n  ctx.beginPath(); ctx.ellipse(0, 4.5, 5, 4, 0, 0, Math.PI * 2); ctx.fill();\n\n  ctx.fillStyle = PALETTE.eyeCyan;\n  ctx.beginPath(); ctx.arc(-4, -1, 1.9, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = PALETTE.eyeGold;\n  ctx.beginPath(); ctx.arc(4, -1, 1.9, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#000000\";\n  ctx.beginPath(); ctx.ellipse(-4, -1, 0.8, 1.3, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(4, -1, 0.8, 1.3, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = PALETTE.nose;\n  ctx.beginPath(); ctx.ellipse(0, 4, 1.7, 1.3, 0, 0, Math.PI * 2); ctx.fill();\n\n  ctx.fillStyle = \"rgba(150, 226, 246, 0.16)\";\n  ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"rgba(191, 234, 245, 0.9)\"; ctx.lineWidth = 1.6 / scale;\n  ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.stroke();\n  ctx.strokeStyle = \"rgba(255,255,255,0.65)\"; ctx.lineWidth = 2 / scale;\n  ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.arc(0, 0, 11, Math.PI * 1.06, Math.PI * 1.42); ctx.stroke();\n  ctx.fillStyle = \"rgba(226, 250, 255, 0.8)\";\n  ctx.beginPath(); ctx.arc(8.5, -8.5, 1.7, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.arc(11.5, -5, 1, 0, Math.PI * 2); ctx.fill();\n  ctx.restore();\n}\n\n// The banner, on a phone.\n//\n// The desktop bar is one 62px row laid out for 800px of width: the rotating tip\n// at the far left, the fox at 252, air and health from 294 to 416, and then\n// SCORE / gems / PEARLS / DEPTH squeezed into what is left. It has an\n// auto-shrink that will take the stats down to 8px rather than overflow, which\n// is precisely why it was unreadable on a phone.\n//\n// Portrait has half the width and height to spare, so the same content goes on\n// two rows at roughly double the size — air and health across the full width on\n// top, the four readouts beneath — with the rotating tip lifted out of the box\n// entirely and set underneath it as a caption, where it can be read at a glance\n// instead of being the thing crowding everything else.\n//\n// Everything is in units of u, a 520-wide lane's worth, so the layout holds its\n// proportions on a narrow phone and a wide one alike.\nfunction drawHUDPhone() {\n  const u = WW / 520;\n  const pad = 12 * u, boxW = WW - pad * 2;\n  const rowH = 46 * u, boxH = rowH * 2;\n\n  ctx.save();\n  ctx.fillStyle = \"rgba(8, 22, 34, 0.82)\";\n  ctx.beginPath(); ctx.roundRect(pad, pad, boxW, boxH, 14 * u); ctx.fill();\n  ctx.strokeStyle = \"rgba(255,138,76,0.5)\"; ctx.lineWidth = 1.5 * u;\n  ctx.stroke();\n\n  // ---- row one: the fox, then air over health, full width ---------------\n  drawFoxHelmet(pad + 34 * u, pad + rowH * 0.52, 2.0 * u);\n  const barX = pad + 86 * u, barW = boxW - 86 * u - 14 * u, barH = 15 * u;\n  drawIconTank(pad + 66 * u, pad + 15 * u);\n  ctx.fillStyle = \"rgba(255,255,255,0.12)\";\n  ctx.beginPath(); ctx.roundRect(barX, pad + 8 * u, barW, barH, barH / 2); ctx.fill();\n  const oxPct = diver.oxygen / diver.maxOxygen;\n  ctx.fillStyle = oxPct > 0.3 ? PALETTE.cyan : \"#ff5a4d\";\n  ctx.beginPath(); ctx.roundRect(barX, pad + 8 * u, barW * oxPct, barH, barH / 2); ctx.fill();\n\n  drawIconHeart(pad + 71 * u, pad + 36 * u);\n  ctx.fillStyle = \"rgba(255,255,255,0.12)\";\n  ctx.beginPath(); ctx.roundRect(barX, pad + 29 * u, barW, barH, barH / 2); ctx.fill();\n  ctx.fillStyle = \"#ff5a6b\";\n  ctx.beginPath(); ctx.roundRect(barX, pad + 29 * u, barW * (diver.health / diver.maxHealth), barH, barH / 2); ctx.fill();\n\n  // ---- row two: the four readouts, at nearly double the desktop size ----\n  drawHudStats(pad + 14 * u, WW - pad - 14 * u, pad + rowH + 28 * u,\n               Math.round(25 * u), Math.round(19 * u));\n  ctx.restore();\n\n  // ---- and the rotating tip, as a caption under the banner --------------\n  const i = Math.floor(clock / TIP_HOLD) % HUD_TIPS.length;\n  const t = clock % TIP_HOLD;\n  const tip = HUD_TIPS[i];\n  ctx.save();\n  ctx.globalAlpha = Math.max(0, Math.min(1, Math.min(t, TIP_HOLD - t) / 18));\n  ctx.textAlign = \"center\";\n  // Under the picture, not under the banner: the banner's shadow is where the\n  // boat sits at the surface, and the surface is where the tips get read.\n  // Kept clear of the main game's BACK TO LAKE button along the bottom edge.\n  const capY = canvas.height - 132 * u;\n  // a soft plate, so the caption stays legible over bright water\n  ctx.font = \"700 \" + Math.round(23 * u) + \"px 'Baloo 2', sans-serif\";\n  const cwid = Math.max(ctx.measureText(tip[0]).width,\n    (ctx.font = \"700 \" + Math.round(17 * u) + \"px 'Baloo 2', sans-serif\", ctx.measureText(tip[1]).width)) + 34 * u;\n  ctx.fillStyle = \"rgba(8, 22, 34, 0.55)\";\n  ctx.beginPath(); ctx.roundRect(WW / 2 - cwid / 2, capY - 24 * u, cwid, 54 * u, 12 * u); ctx.fill();\n  ctx.font = \"700 \" + Math.round(23 * u) + \"px 'Baloo 2', sans-serif\";\n  ctx.fillStyle = \"#ffb27a\";\n  ctx.fillText(tip[0], WW / 2, capY);\n  ctx.font = \"700 \" + Math.round(17 * u) + \"px 'Baloo 2', sans-serif\";\n  ctx.fillStyle = \"#9fd0de\";\n  ctx.fillText(tip[1], WW / 2, capY + 24 * u);\n  ctx.restore();\n}\n\nfunction drawHUD() {\n  if (PORTRAIT) return drawHUDPhone();\n  ctx.save();\n  ctx.fillStyle = \"rgba(8, 22, 34, 0.82)\";\n  ctx.beginPath(); ctx.roundRect(10, 10, canvas.width - 20, 62, 12); ctx.fill();\n  ctx.strokeStyle = \"rgba(255,138,76,0.5)\"; ctx.lineWidth = 1.5;\n  ctx.stroke();\n\n  // ---- far left: the rotating tips ------------------------------------\n  drawHudTip();\n\n  // ---- then the fox in his diving bowl ---------------------------------\n  drawFoxHelmet(252, 41, 1.45);\n\n  // ---- then AIR (top) and HP (bottom), stacked -------------------------\n  const barW = 98, barX = 318;\n  drawIconTank(294, 22);\n  ctx.fillStyle = \"rgba(255,255,255,0.12)\";\n  ctx.beginPath(); ctx.roundRect(barX, 16, barW, 12, 6); ctx.fill();\n  const oxPct = diver.oxygen / diver.maxOxygen;\n  ctx.fillStyle = oxPct > 0.3 ? PALETTE.cyan : \"#ff5a4d\";\n  ctx.beginPath(); ctx.roundRect(barX, 16, barW * oxPct, 12, 6); ctx.fill();\n\n  drawIconHeart(300, 50);\n  ctx.fillStyle = \"rgba(255,255,255,0.12)\";\n  ctx.beginPath(); ctx.roundRect(barX, 44, barW, 12, 6); ctx.fill();\n  const hpPct = diver.health / diver.maxHealth;\n  ctx.fillStyle = \"#ff5a6b\";\n  ctx.beginPath(); ctx.roundRect(barX, 44, barW * hpPct, 12, 6); ctx.fill();\n\n  // ---- SCORE, gems, PEARLS, DEPTH: one line, auto-fitted ---------------\n  drawHudStats(438, canvas.width - 26, 47);\n  ctx.restore();\n\n  ctx.restore();\n}\n\nfunction drawEndCard(color, emoji, title, subtitle) {\n  ctx.save();\n  ctx.fillStyle = \"rgba(3, 8, 14, 0.72)\";\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\n  const cw = Math.min(460, canvas.width - 40), ch = 230, cx = canvas.width / 2 - cw / 2, cy = canvas.height / 2 - ch / 2;\n  ctx.fillStyle = \"rgba(10, 26, 38, 0.95)\";\n  ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 20); ctx.fill();\n  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();\n\n  ctx.textAlign = \"center\";\n  ctx.font = \"42px sans-serif\";\n  ctx.fillText(emoji, canvas.width / 2, cy + 62);\n\n  ctx.font = \"800 24px 'Baloo 2', sans-serif\";\n  ctx.fillStyle = color;\n  ctx.fillText(title, canvas.width / 2, cy + 108);\n\n  ctx.font = \"600 14px 'Nunito', sans-serif\";\n  ctx.fillStyle = \"#cfe8ef\";\n  ctx.fillText(subtitle, canvas.width / 2, cy + 135);\n\n  ctx.font = \"700 13px 'Baloo 2', sans-serif\";\n  ctx.fillStyle = \"#ffb27a\";\n  ctx.fillText(PORTRAIT ? \"Tap to dive again\" : \"Click or press R to dive again\",\n               canvas.width / 2, cy + 180);\n\n  ctx.textAlign = \"left\";\n  ctx.restore();\n}\n\n\n/* ---------------------------------------------- PEARL DIVER, the attract card\n\n   An arcade opening: the name, what you are diving for, the cabinet's best,\n   the player himself, and a prompt that blinks until you press. The water\n   behind it keeps moving because update() still advances the clock.\n\n   Laid out in fractions of the canvas and sized through introFit, so the same\n   card fits the desktop frame and a phone held upright. The high scores are ONE\n   LINE on purpose: as a plate they collided with the diver.  */\nlet titleOpen = true, titleTick = 0;\nlet titleStats = null;\n\nfunction anglerSilhouette(x, y, s, a) {\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;\n  ctx.fillStyle = '#04131e';\n  ctx.beginPath(); ctx.moveTo(38, 0); ctx.quadraticCurveTo(6, -26, -34, -12);\n  ctx.quadraticCurveTo(-52, 0, -34, 12); ctx.quadraticCurveTo(6, 26, 38, 0); ctx.fill();\n  ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(-62, -16); ctx.lineTo(-58, 16); ctx.closePath(); ctx.fill();\n  ctx.strokeStyle = '#04131e'; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(22, -16); ctx.quadraticCurveTo(46, -40, 54, -22); ctx.stroke();\n  ctx.globalAlpha = Math.min(1, a * 2.2); ctx.fillStyle = PALETTE.gold;\n  ctx.beginPath(); ctx.arc(55, -21, 4, 0, 6.29); ctx.fill();\n  ctx.restore();\n}\n\nfunction drawTitleCard() {\n  const W = canvas.width, H = canvas.height, t = titleTick;\n  const u = Math.min(W / 800, H / 600);\n  ctx.save();\n\n  /* DARK ENOUGH TO SWALLOW THE WORLD'S OWN LABELS. The first version opened\n     at 0.30 in the middle and the pond read straight through it: the kelp\n     OXYGEN tag, the PEARL tag, a live anglerfish and the boat mast all sat on\n     the card, and a mast through the title reads as a bug rather than a\n     backdrop. The same complaint as the HUD showing through, one layer down.\n     At 0.62 the water still moves behind the card — the shafts and the bubbles\n     are there — but nothing in it is legible as UI any more. */\n  const vg = ctx.createRadialGradient(W / 2, H * 0.44, H * 0.12, W / 2, H * 0.44, H * 0.85);\n  vg.addColorStop(0, 'rgba(2,10,18,0.62)');\n  vg.addColorStop(1, 'rgba(2,10,18,0.95)');\n  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);\n\n  // two of what you are diving past, in silhouette\n  anglerSilhouette((t * 0.55) % (W + 260) - 130, H * 0.52 + Math.sin(t * 0.02) * 14, u * 1.15, 0.55);\n  anglerSilhouette(W - ((t * 0.34 + 300) % (W + 260)) + 130, H * 0.76 + Math.sin(t * 0.017 + 2) * 10, -u * 0.85, 0.42);\n\n  for (let i = 0; i < 26; i++) {\n    const x = (i * 97) % W, sp = 0.35 + ((i % 5) * 0.12);\n    const y = H - ((t * sp + i * 40) % (H + 60));\n    ctx.strokeStyle = `rgba(190,235,250,${0.10 + 0.10 * Math.sin(i + t * 0.03)})`;\n    ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.arc(x + Math.sin(t * 0.03 + i) * 6, y, 2 + (i % 3), 0, 6.29); ctx.stroke();\n  }\n\n  ctx.textAlign = 'center';\n  ctx.lineJoin = 'round';\n  const cy = H * 0.215 + Math.sin(t * 0.03) * 3 * u;\n  const maxW = W - 70 * u;\n\n  [-1, 1].forEach((sgn, k) => {\n    const px = W / 2 + sgn * (maxW * 0.5 - 16 * u), py = cy - 16 * u;\n    const gl = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.05 + k * 1.7));\n    ctx.fillStyle = `rgba(191,243,255,${0.25 * gl})`;\n    ctx.beginPath(); ctx.arc(px, py, 13 * u * gl, 0, 6.29); ctx.fill();\n    ctx.fillStyle = PALETTE.pearl;\n    ctx.beginPath(); ctx.arc(px, py, 6 * u, 0, 6.29); ctx.fill();\n  });\n\n  const titlePx = introFit('PEARL DIVER', '800', Math.round(78 * u), maxW);\n  const tg = ctx.createLinearGradient(0, cy - titlePx * 0.75, 0, cy + titlePx * 0.2);\n  tg.addColorStop(0, '#bff3ff'); tg.addColorStop(0.55, PALETTE.cyan); tg.addColorStop(1, '#12b3a6');\n  ctx.font = `800 ${titlePx}px 'Baloo 2', sans-serif`;\n  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(6, 13 * u);\n  ctx.strokeText('PEARL DIVER', W / 2, cy);\n  ctx.fillStyle = tg; ctx.fillText('PEARL DIVER', W / 2, cy);\n\n  const subPx = introFit('TEN PEARLS IN THE DEEP', '700', Math.round(19 * u), maxW);\n  ctx.font = `700 ${subPx}px 'Baloo 2', sans-serif`;\n  ctx.strokeStyle = 'rgba(4,12,22,0.85)'; ctx.lineWidth = Math.max(3, 5 * u);\n  ctx.strokeText('TEN PEARLS IN THE DEEP', W / 2, cy + subPx * 2.0);\n  ctx.fillStyle = '#ffb27a'; ctx.fillText('TEN PEARLS IN THE DEEP', W / 2, cy + subPx * 2.0);\n\n  if (titleStats) {\n    const line = `BEST ${titleStats.bestScore || 0}      PEARLS ${titleStats.bestPearls || 0}/10      DIVES ${titleStats.dives || 0}`;\n    const hsPx = introFit(line, '700', Math.round(15 * u), maxW);\n    ctx.font = `700 ${hsPx}px 'Baloo 2', sans-serif`;\n    ctx.strokeStyle = 'rgba(4,12,22,0.85)'; ctx.lineWidth = Math.max(3, 4 * u);\n    ctx.strokeText(line, W / 2, cy + subPx * 3.7);\n    ctx.fillStyle = '#7fb8c9'; ctx.fillText(line, W / 2, cy + subPx * 3.7);\n  }\n\n  ctx.strokeStyle = 'rgba(255,138,76,0.45)'; ctx.lineWidth = 1.5 * u;\n  const ry = cy + subPx * 4.6;\n  ctx.beginPath(); ctx.moveTo(W * 0.2, ry); ctx.lineTo(W * 0.8, ry); ctx.stroke();\n\n  /* THE DIVER HIMSELF, BIG. Not the overworld fox.\n\n     The first version put `playerSpritePNG()` here — the same walking-around\n     avatar the fishing dock borrows. It was the wrong fox. The pond has its\n     OWN fox: helmet, glass, fins, the brush tail with the white tip, drawn by\n     `drawFox` at about 35px tall, and at that size on a moving screen you\n     never actually look at him. This is the one place in the game he holds\n     still and gets to be six times life size, so this is where he goes.\n\n     `drawFox` takes no scale — it translates to (x, y) and draws at its own\n     size — so the transform goes outside it and he is drawn at the origin.\n     Everything he does is relative to that translate; nothing in the body\n     reads the canvas or the camera. Checked line by line, because a single\n     absolute coordinate in there would have put half a fox on the card.\n\n     Except the last two lines, which are the exhale: a 2%-per-frame bubble\n     spawned at the coordinates he was PASSED — world space, which is (0, 0)\n     here. And update() is held while the card is up, so those bubbles would\n     never age, never move and never be swept: they would pile up, a dozen\n     every ten seconds, in one spot near the top of the water. So the array is\n     cut back to the length it had. Not a stubbed spawnParticles — nothing else\n     runs between these two statements, so the cut can only remove his.\n\n     vx is a real number rather than 0 because the tail wag is driven by\n     `hypot(vx, vy)`: at rest he is a stuffed toy. vy oscillates, and drawFox\n     turns that into `tilt`, so he lolls in the water. Both come off `clock`,\n     which update() keeps advancing behind the card. */\n  /* CENTRED ON HIS INK, NOT ON HIS ORIGIN. `drawFox` builds outward from a\n     point near the head, and his ink is not symmetric about it — measured by\n     drawing him alone on a cleared canvas and reading the pixels back:\n\n         x  -38 .. +24      y  -20 .. +16      63 x 37 at scale 1\n\n     The tail runs 38 out to the left and the snout only 24 to the right, so\n     drawing him at W/2 put him visibly right of centre with the title\n     centred above him. The offset is half the difference, scaled. */\n  {\n    const s = u * 5.4;\n    const cxf = W / 2 + 7 * s;\n    const cyf = H * 0.615 + 2 * s + Math.sin(t * 0.045) * 9 * u;\n    /* A GLOW, NOT A GREY PLATE. A flat 0.20 white ellipse over water this dark\n       came out as a solid slab with a visible rim, and the fox sat on it like\n       a sticker.\n\n       SQUASHED CIRCLE, FILLED AS A RECT. The obvious version — a radial\n       gradient painted into an ellipse path — has the same fault in a subtler\n       form: the gradient is round and the path is not, so the fade is cut off\n       flat at the top and bottom where the path is shorter than the gradient's\n       reach, and that cut is the rim again. Scaling the canvas and filling a\n       square keeps the whole fade, and it ends at zero alpha, so there is no\n       edge anywhere. */\n    ctx.save();\n    ctx.translate(W / 2, cyf); ctx.scale(1, 0.62);\n    const hg = ctx.createRadialGradient(0, 0, 6 * s, 0, 0, 40 * s);\n    hg.addColorStop(0, 'rgba(120,215,245,0.22)');\n    hg.addColorStop(0.55, 'rgba(120,215,245,0.09)');\n    hg.addColorStop(1, 'rgba(120,215,245,0)');\n    ctx.fillStyle = hg;\n    ctx.fillRect(-40 * s, -40 * s, 80 * s, 80 * s);\n    ctx.restore();\n    const nP = particles.length;\n    ctx.save();\n    ctx.translate(cxf, cyf);\n    ctx.scale(s, s);\n    drawFox(0, 0, 1.6, Math.sin(t * 0.035) * 2.2, false, 1);\n    ctx.restore();\n    particles.length = nP;\n  }\n\n  /* THE BLINK NEVER GOES OUT. Half a cycle at alpha 0 meant the one line\n     telling you how to start was invisible in half the frames — the first\n     screenshot caught it at its dim phase and the prompt read as grey noise\n     under the diver. It breathes between 0.42 and 1 instead. */\n  const blink = 0.42 + 0.58 * (0.5 + 0.5 * Math.sin(t * 0.09));\n  const pressPx = Math.round(26 * u);\n  ctx.font = `800 ${pressPx}px 'Baloo 2', sans-serif`;\n  ctx.globalAlpha = blink;\n  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(4, 7 * u);\n  /* CLICK, not PRESS ANY KEY. The game runs in an iframe and a keystroke only\n     reaches it once the frame has focus — which it does not have the moment it\n     opens. A key still starts the dive if you have clicked in first, but the\n     prompt has to name the thing that always works. The pond's own restart\n     line has always read 'Click or press R' for the same reason. */\n  const press = PORTRAIT ? 'TAP TO DIVE' : 'CLICK TO DIVE';\n  ctx.strokeText(press, W / 2, H * 0.905);\n  ctx.fillStyle = PALETTE.gold;\n  ctx.fillText(press, W / 2, H * 0.905);\n  ctx.globalAlpha = 1;\n\n  const hint = 'hold to swim   -   double-tap to pulse   -   surface for air';\n  const hPx = introFit(hint, '700', Math.round(13 * u), maxW);\n  ctx.font = `700 ${hPx}px 'Baloo 2', sans-serif`;\n  ctx.fillStyle = '#7fb8c9';\n  ctx.fillText(hint, W / 2, H * 0.955);\n\n  ctx.textAlign = 'left';\n  ctx.restore();\n}\n\n/* Any key, any press. initAudio here as well as in the pointer handler,\n   because a browser only grants sound inside a gesture and this IS the\n   gesture — starting from the keyboard used to reach the water silent. */\nfunction startFromTitle() {\n  if (!titleOpen) return false;\n  titleOpen = false;\n  try { initAudio(); } catch (e) {}\n  return true;\n}\nfunction loop() {\n  if (titleOpen) titleTick++;\n  update();\n  draw();\n  requestAnimationFrame(loop);\n}\n\ninitWorld();\nloop();\n<\/script>\n\n\n<\/body><\/html>"</script>

<script>
(function(){
  function readStats(){
    // Bare identifiers on purpose: these live in the global LEXICAL scope, so
    // window.score is undefined but `score` resolves. Throws until the game
    // script has run, hence the try.
    try { return { score: score, pearls: pearlsFound, gems: gemsCollected,
                   won: !!gameWon, over: !!gameOver }; }
    catch (e) { return null; }
  }
  var last = '';
  function report(){
    var st = readStats();
    if (!st) return;
    var sig = JSON.stringify(st);
    if (sig === last) return;
    last = sig;
    try { parent.postMessage({ __dive: 'stats', data: st }, '*'); } catch (e) {}
  }
  setInterval(report, 500);

  /* ASK THE GAME OUTSIDE FOR THE CABINET'S BEST. Nobody answers a pond opened
     on its own, and the card then simply shows no scores — the diver is drawn
     by the pond itself and is there either way. Asked again twice because the
     parent wires its listener around the time the frame loads and which lands
     first is not ours to decide. */
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.__dive !== 'intro') return;
    if (e.data.stats) { try { titleStats = e.data.stats; } catch (err) {} }
  });
  function askForIntro(){ try { parent.postMessage({ __dive: 'wantIntro' }, '*'); } catch (e) {} }
  askForIntro();
  setTimeout(askForIntro, 1200);
  setTimeout(askForIntro, 3000);

  function goBack(e){ if (e) e.preventDefault(); report(); try { parent.postMessage('backToLake', '*'); } catch (err) {} }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') goBack(); });

  // The bundler swaps out the document when it unpacks, so re-plant the button.
  function ensureBtn(){
    if (!document.body || document.getElementById('__lakeBack')) return;
    var b = document.createElement('button');
    b.id = '__lakeBack';
    b.textContent = '\u25C0 BACK TO LAKE';
    // bottom-left, matching the fishing pond. The hint line that used to sit
    // here is gone, so the bottom strip is free.
    b.style.cssText = 'position:fixed;bottom:14px;left:14px;z-index:2147483647;padding:5px 10px;' +
      'border-radius:7px;border:1px solid #5fe3ff;background:rgba(5,9,16,0.85);color:#7dd3fc;' +
      'font:800 9px/1 Orbitron,system-ui,sans-serif;letter-spacing:0.5px;cursor:pointer;' +
      'box-shadow:0 3px 10px rgba(0,0,0,0.5)';
    b.addEventListener('click', goBack);
    document.body.appendChild(b);
  }
  ensureBtn();
  setInterval(ensureBtn, 400);
})();
</script>
