  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

x;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"bb63e142-1af1-4820-b54d-d307ddee1298\"><\u002Fscript>\n  <script src=\"0566acf1-d51d-4d9f-95a6-0cb0da56198f\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; background: #201e1d; }\n    a { color: #f3f2f2; } a:hover { color: #ff9783; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh; background:var(--color-text,#201e1d); color:var(--color-bg,#f3f2f2); font-family:var(--font-body,Archivo),Archivo,system-ui,sans-serif; font-size:20px; line-height:1.45; font-weight:500; -webkit-font-smoothing:antialiased\">\n<div style=\"max-width:1280px; margin:0 auto\">\n\n  <header style=\"display:flex; flex-wrap:wrap; border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <a href=\"{{ galleryUrl }}\" style=\"flex:1 1 240px; min-width:0; min-height:60px; display:flex; align-items:center; gap:12px; padding:8px clamp(20px,5vw,56px); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:16px; font-weight:800; letter-spacing:.08em\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\">\n      <img src=\"dbd11c31-bc26-409b-8ff2-7e27dbf12699\" alt=\"\" style=\"display:block; height:44px; width:auto\">\n      <span>BLIND CANVAS PROJECT<\u002Fspan>\n    <\u002Fa>\n    <a href=\"{{ galleryUrl }}\" style=\"flex:0 1 auto; min-height:60px; display:flex; align-items:center; padding:8px clamp(20px,5vw,56px); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:16px; font-weight:800; letter-spacing:.08em\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\">BACK TO THE GALLERY<\u002Fa>\n  <\u002Fheader>\n\n  <section data-screen-label=\"Hero\" style=\"display:flex; flex-wrap:wrap; gap:2px; background:var(--color-bg,#f3f2f2); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <div style=\"flex:1 1 380px; min-width:0; container-type:inline-size; background:var(--color-text,#201e1d); padding:clamp(28px,6vw,64px) clamp(20px,5vw,56px) clamp(28px,5vw,56px)\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">ABOUT THE COURSE<\u002Fdiv>\n      <h1 style=\"margin:10px 0 0; font-family:inherit; font-size:clamp(34px,13.5cqw,84px); line-height:.95; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">THE <span style=\"white-space:nowrap\">ORA-VNC™<\u002Fspan> MOBILITY COURSE<\u002Fh1>\n      <p style=\"margin:20px 0 0; max-width:30em; font-size:clamp(21px,2.4vw,26px); line-height:1.35; font-weight:600; text-wrap:pretty\">A walking test for people with inherited retinal diseases. Ora designed it to show whether a treatment changes how well a person finds their way through a room.<\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-top:28px\">\n        <a href=\"{{ courseUrl }}\" style=\"flex:1 1 250px; display:flex; align-items:center; min-height:60px; box-sizing:border-box; padding:10px 18px; background:var(--color-accent-600,#dd2b0f); border:2px solid var(--color-accent-600,#dd2b0f); color:#ffffff; text-decoration:none; font-size:19px; font-weight:800; letter-spacing:.03em\" style-hover=\"background:var(--color-accent-700,#ae1800); border-color:var(--color-accent-700,#ae1800); color:#ffffff\" style-focus=\"outline:2px solid var(--color-bg,#f3f2f2); outline-offset:2px\">WALK THE COURSE IN 3D<\u002Fa>\n        <a href=\"https://player.vimeo.com/video/936308338\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 250px; display:flex; align-items:center; min-height:60px; box-sizing:border-box; padding:10px 18px; border:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:19px; font-weight:800; letter-spacing:.03em\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\">WATCH ORA'S FILM OF IT<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-top:32px\">\n        <img src=\"ac169038-9dd2-4f62-b53d-5ca9635fad1d\" alt=\"Ora, The Ophthalmology Research Company\" style=\"display:block; width:150px; height:auto; border:2px solid var(--color-bg,#f3f2f2)\">\n        <div style=\"flex:1 1 180px; min-width:0; font-size:17px; line-height:1.35; font-weight:600\">The course is Ora's. This page is the Blind Canvas Project's own account of it.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 320px; min-width:0; min-height:440px; position:relative; background:#161514; filter:{{ photoFilter }}\">\n      <image-slot id=\"mc-about-hero\" shape=\"rect\" src=\"b48c6f60-7793-48e7-b944-3be9e6d6953f\" credit=\"Photo: Ora\" placeholder=\"DROP A PHOTO OF THE COURSE\" style=\"position:absolute; inset:0; width:100%; height:100%\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <nav aria-label=\"On this page\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <a href=\"#what\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">01<\u002Fspan><span>WHAT IT IS<\u002Fspan><\u002Fa>\n    <a href=\"#why\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">02<\u002Fspan><span>WHAT IT IS BUILT TO DO<\u002Fspan><\u002Fa>\n    <a href=\"#session\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">03<\u002Fspan><span>HOW A SESSION RUNS<\u002Fspan><\u002Fa>\n    <a href=\"#fit\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">04<\u002Fspan><span>ONE COURSE DOES NOT FIT ALL<\u002Fspan><\u002Fa>\n    <a href=\"#light\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">05<\u002Fspan><span>THE LIGHT<\u002Fspan><\u002Fa>\n    <a href=\"#score\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">06<\u002Fspan><span>SCORING AND GRADING<\u002Fspan><\u002Fa>\n    <a href=\"#used\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">07<\u002Fspan><span>WHERE IT IS USED<\u002Fspan><\u002Fa>\n    <sc-if value=\"{{ aboutOra }}\" hint-placeholder-val=\"{{ true }}\">\n      <a href=\"#ora\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">{{ nOra }}<\u002Fspan><span>WHO IS BEHIND IT<\u002Fspan><\u002Fa>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ otherEndpoints }}\" hint-placeholder-val=\"{{ true }}\">\n      <a href=\"#tools\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">{{ nTools }}<\u002Fspan><span>ALSO FROM ORA<\u002Fspan><\u002Fa>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ ourRoom }}\" hint-placeholder-val=\"{{ true }}\">\n      <a href=\"#room\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">{{ nRoom }}<\u002Fspan><span>OUR 3D ROOM<\u002Fspan><\u002Fa>\n    <\u002Fsc-if>\n    <a href=\"#sources\" style=\"display:flex; align-items:baseline; gap:14px; min-height:56px; box-sizing:border-box; padding:14px clamp(20px,5vw,56px); border-bottom:2px solid var(--color-neutral-700,#605d5d); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:-2px\"><span style=\"color:var(--color-accent-400,#ff9783)\">→<\u002Fspan><span>THE SOURCES<\u002Fspan><\u002Fa>\n  <\u002Fnav>\n\n  <section id=\"what\" data-screen-label=\"01 What it is\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">01<\u002Fdiv>\n      <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">WHAT IT IS<\u002Fh2>\n    <\u002Fheader>\n    <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">VNC stands for Visual Navigation Course. Ora's Retina page and its fact sheet spell it Visual Navigation Challenge. Either way it names a set of mobility courses that Ora designed to assess mobility and functional vision in people with inherited retinal diseases (IRD).<\u002Fp>\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">It is a functional endpoint: a measure of what a person can do, used in a clinical trial to judge a treatment. The fact sheet says the courses were made because trials in these diseases needed one. The treatments they were created to evaluate are cell and gene therapies.<\u002Fp>\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">The course surrounds the walker. Ora describes it as a “360-degree visual challenge environment”.<\u002Fp>\n      <p style=\"margin:0 0 28px; text-wrap:pretty\">What it reads is a change in mobility: how much better a person gets around after a treatment has improved their vision.<\u002Fp>\n      <h3 style=\"margin:0 0 10px; font-family:inherit; font-size:17px; font-weight:800; letter-spacing:.08em; color:var(--color-bg,#f3f2f2)\">WHAT ORA'S PHOTOS SHOW<\u002Fh3>\n      <div style=\"border-top:2px solid var(--color-bg,#f3f2f2)\">\n        <div style=\"padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\">Plain pale walls and a dark floor.<\u002Fdiv>\n        <div style=\"padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\">A path of white foam floor tiles. Their toothed edges lock together like a jigsaw. The path branches and joins again.<\u002Fdiv>\n        <div style=\"padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\">Cubes built from the same tiles, one tile to a face, in red, yellow, green and blue. They stand beside the path and on it. Some are turned at an angle.<\u002Fdiv>\n        <div style=\"padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\">A coloured tile lying flat on the floor beside the path.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-top:16px\" aria-hidden=\"true\">\n        <div style=\"flex:1 1 0; height:28px; background:#e9e7e1\"><\u002Fdiv>\n        <div style=\"flex:1 1 0; height:28px; background:#dc2a22\"><\u002Fdiv>\n        <div style=\"flex:1 1 0; height:28px; background:#f2cf1c\"><\u002Fdiv>\n        <div style=\"flex:1 1 0; height:28px; background:#2fa24a\"><\u002Fdiv>\n        <div style=\"flex:1 1 0; height:28px; background:#1c82d6\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:8px; font-size:16px; font-weight:600\">The colours, as our 3D room paints them: white tiles, then red, yellow, green and blue cubes.<\u002Fdiv>\n      <a href=\"http://oraclinical.com/wp-content/uploads/2024/04/Ora_FactSheet_Posterior_Segment_042624_digital.pdf\" target=\"_blank\" rel=\"noopener\" style=\"display:flex; align-items:center; min-height:56px; box-sizing:border-box; margin-top:20px; padding:10px 18px; border:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none; font-size:18px; font-weight:800; letter-spacing:.03em\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\">SEE THE PHOTOS · FACT SHEET, PAGES 4 AND 5<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"why\" data-screen-label=\"02 What it is built to do\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">02<\u002Fdiv>\n      <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">WHAT IT IS BUILT TO DO<\u002Fh2>\n    <\u002Fheader>\n    <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">Ora's fact sheet and its Retina page say what the courses are for. In our words:<\u002Fp>\n      <ol style=\"list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:2px; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\">\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:19px; line-height:1.2; font-weight:900; letter-spacing:.02em\">JUDGE A TREATMENT<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Serve as the functional endpoint of a trial: the measure that shows whether a cell or gene therapy for an inherited retinal disease works.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:19px; line-height:1.2; font-weight:900; letter-spacing:.02em\">SHOW A REAL CHANGE<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Read, objectively, how a person's mobility changes when a treatment improves their vision.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:19px; line-height:1.2; font-weight:900; letter-spacing:.02em\">STAY SENSITIVE<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Be sensitive enough to register a change in visual function.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:19px; line-height:1.2; font-weight:900; letter-spacing:.02em\">DETECT WHAT IS SPECIFIC<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Pick up the differences in visual function impairment that are specific to inherited retinal diseases.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:19px; line-height:1.2; font-weight:900; letter-spacing:.02em\">TEST WHAT THE DISEASE TAKES<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Challenge the particular parts of vision that these diseases wear down.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:19px; line-height:1.2; font-weight:900; letter-spacing:.02em\">MEASURE WHAT MATTERS<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Assess visual function in a clinically meaningful way, by placing the person inside the challenge.<\u002Fdiv><\u002Fli>\n      <\u002Fol>\n      <div style=\"margin-top:10px; font-size:16px; font-weight:600\">Sources: Ora's fact sheet, pages 4 and 5, and the Retina and Macular Diseases page.<\u002Fdiv>\n      <h3 style=\"margin:36px 0 12px; font-family:inherit; font-size:17px; line-height:1.2; font-weight:800; letter-spacing:.08em; color:var(--color-bg,#f3f2f2)\">THE THINKING BEHIND ORA'S ENDPOINTS<\u002Fh3>\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">Ora keeps its own research and development team, and its Endpoints and Technologies page gives the reason. Older endpoints and trial designs often fail to control the outside factors that confuse a result. The data comes out noisier. A study then needs more patients, or cannot pick up change early in a disease.<\u002Fp>\n      <p style=\"margin:0; text-wrap:pretty\">The team works on three things: measuring a product's effect accurately, understanding a therapy's full impact, and making trial designs and sample sizes leaner. Its stated goal is quieter data: more statistical power, a better chance of success, and a clearer difference between therapy and placebo.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"session\" data-screen-label=\"03 How a session runs\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">03<\u002Fdiv>\n      <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">HOW A SESSION RUNS<\u002Fh2>\n    <\u002Fheader>\n    <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n      <ol style=\"list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:2px; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\">\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:44px; line-height:1; font-weight:900; color:var(--color-accent-400,#ff9783)\">1<\u002Fdiv><div style=\"margin:10px 0 6px; font-size:19px; font-weight:900; letter-spacing:.02em\">THE COURSE GOES UP<\u002Fdiv><div style=\"font-size:18px; line-height:1.4\">It is modular. It is set up in any clinical centre with no change to the building.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:44px; line-height:1; font-weight:900; color:var(--color-accent-400,#ff9783)\">2<\u002Fdiv><div style=\"margin:10px 0 6px; font-size:19px; font-weight:900; letter-spacing:.02em\">THE LIGHT IS SET<\u002Fdiv><div style=\"font-size:18px; line-height:1.4\">Ambient light is set to standard levels, whatever the size and features of the room.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:44px; line-height:1; font-weight:900; color:var(--color-accent-400,#ff9783)\">3<\u002Fdiv><div style=\"margin:10px 0 6px; font-size:19px; font-weight:900; letter-spacing:.02em\">THE STAFF ARE CERTIFIED<\u002Fdiv><div style=\"font-size:18px; line-height:1.4\">After set-up and validation, Ora trains and certifies the technicians on site.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:44px; line-height:1; font-weight:900; color:var(--color-accent-400,#ff9783)\">4<\u002Fdiv><div style=\"margin:10px 0 6px; font-size:19px; font-weight:900; letter-spacing:.02em\">THE PERSON WALKS<\u002Fdiv><div style=\"font-size:18px; line-height:1.4\">The course is one made for the kind and severity of vision loss in the study. It comes in several versions, so nobody learns one by heart.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:44px; line-height:1; font-weight:900; color:var(--color-accent-400,#ff9783)\">5<\u002Fdiv><div style=\"margin:10px 0 6px; font-size:19px; font-weight:900; letter-spacing:.02em\">THE SESSION IS RECORDED<\u002Fdiv><div style=\"font-size:18px; line-height:1.4\">The recording is sent to Ora's independent reading centre.<\u002Fdiv><\u002Fli>\n        <li style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\"><div style=\"font-size:44px; line-height:1; font-weight:900; color:var(--color-accent-400,#ff9783)\">6<\u002Fdiv><div style=\"margin:10px 0 6px; font-size:19px; font-weight:900; letter-spacing:.02em\">MASKED GRADERS SCORE IT<\u002Fdiv><div style=\"font-size:18px; line-height:1.4\">Certified graders score the recording. They are masked, the trial word for blinded. Every site is graded the same way.<\u002Fdiv><\u002Fli>\n      <\u002Fol>\n      <p style=\"margin:16px 0 0; text-wrap:pretty\">Ora describes the course as easy to use and highly mobile. A training system and a standard protocol for its use come with it.<\u002Fp>\n      <div style=\"margin-top:10px; font-size:16px; font-weight:600\">Source: Ora's fact sheet, page 5.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"fit\" data-screen-label=\"04 One course does not fit all\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">04<\u002Fdiv>\n      <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">ONE COURSE DOES NOT FIT ALL<\u002Fh2>\n    <\u002Fheader>\n    <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n      <figure style=\"margin:0 0 24px; padding:20px; border:2px solid var(--color-bg,#f3f2f2)\">\n        <blockquote style=\"margin:0; font-size:clamp(27px,6.4vw,42px); line-height:1.08; font-weight:900; letter-spacing:-.005em; text-wrap:balance\">“no single course is appropriate for all IRDs”<\u002Fblockquote>\n        <figcaption style=\"margin-top:14px; font-size:16px; font-weight:600; color:var(--color-bg,#f3f2f2)\">Ora, Endpoints and Technologies page<\u002Ffigcaption>\n      <\u002Ffigure>\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">Inherited retinal diseases do not all take the same part of sight. Ora's page names three kinds of loss, each with a disease as its example.<\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin:0 0 20px; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\">\n        <div style=\"flex:1 1 220px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:20px; font-weight:900; line-height:1.15\">CENTRAL VISION<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.35\">Leber hereditary optic neuropathy (LHON)<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 220px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:20px; font-weight:900; line-height:1.15\">LIGHT PERCEPTION<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.35\">Leber congenital amaurosis (LCA)<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 220px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:20px; font-weight:900; line-height:1.15\">SIDE VISION<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.35\">Retinitis pigmentosa (RP)<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">Ora changes the course to suit the disease a treatment is meant for. The fact sheet gives the span of severity its courses cover: from “mild visual field constriction (with preserved central acuity)” to “light perception” only.<\u002Fp>\n      <p style=\"margin:0; text-wrap:pretty\">Any course can also be set easier or harder, to suit the group of patients in a study.<\u002Fp>\n\n      <sc-if value=\"{{ ourRoom }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:36px\">\n          <div style=\"display:inline-block; padding:4px 9px; background:var(--color-bg,#f3f2f2); color:var(--color-text,#201e1d); font-size:14px; font-weight:900; letter-spacing:.08em\">OURS · NOT ORA'S LAYOUTS<\u002Fdiv>\n          <h3 style=\"margin:10px 0 10px; font-family:inherit; font-size:clamp(26px,6vw,34px); line-height:1.05; font-weight:900; color:var(--color-bg,#f3f2f2)\">FOUR LAYOUTS FOR THE 3D ROOM<\u002Fh3>\n          <p style=\"margin:0 0 18px; text-wrap:pretty\">Ora does not publish its layouts. For the 3D room we drew four of our own, one for each kind of sight the sources name. Each has three levels and twelve versions. Every version is checked: it can be walked without a fault.<\u002Fp>\n          <div role=\"group\" aria-label=\"Level and version of the plans\" style=\"display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 14px\">\n            <sc-for list=\"{{ levels }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <button aria-pressed=\"{{ b.pressed }}\" sc-camel-on-click=\"{{ b.go }}\" style=\"flex:1 1 96px; min-height:56px; padding:8px 14px; background:{{ b.bg }}; color:{{ b.fg }}; border:2px solid #f3f2f2; border-radius:0; font:900 18px Archivo,system-ui,sans-serif; letter-spacing:.02em; text-align:left; white-space:nowrap; cursor:pointer\" style-hover=\"background:var(--color-accent-900,#4d170e); color:#f3f2f2\" style-focus=\"outline:2px solid #ff9783; outline-offset:2px\">{{ b.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ nextVersion }}\" style=\"flex:2 1 200px; min-height:56px; padding:8px 14px; background:var(--color-accent-600,#dd2b0f); color:#ffffff; border:2px solid var(--color-accent-600,#dd2b0f); border-radius:0; font:900 18px Archivo,system-ui,sans-serif; letter-spacing:.02em; text-align:left; white-space:nowrap; cursor:pointer\" style-hover=\"background:var(--color-accent-700,#ae1800); border-color:var(--color-accent-700,#ae1800)\" style-focus=\"outline:2px solid #f3f2f2; outline-offset:2px\">NEXT VERSION<\u002Fbutton>\n          <\u002Fdiv>\n          <div role=\"status\" style=\"margin:0 0 14px; font-size:18px; font-weight:800; letter-spacing:.03em\">{{ versionLine }}<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:2px; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\">\n            <article style=\"flex:1 1 340px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\">\n              <div style=\"font-size:14px; font-weight:800; letter-spacing:.08em; color:var(--color-accent-400,#ff9783)\">NARROWED FIELD, SHARP CENTRE<\u002Fdiv>\n              <h4 style=\"margin:4px 0 12px; font-family:inherit; font-size:30px; line-height:1; font-weight:900; color:var(--color-bg,#f3f2f2)\">THE WEAVE<\u002Fh4>\n              <img ref=\"{{ refWeave }}\" alt=\"{{ altWeave }}\" style=\"display:block; width:100%; aspect-ratio:10/6; box-sizing:border-box; background:#161514; border:2px solid var(--color-bg,#f3f2f2)\">\n              <div style=\"margin-top:8px; font-size:15px; font-weight:800; letter-spacing:.04em\">{{ metaWeave }}<\u002Fdiv>\n              <p style=\"margin:10px 0 0; font-size:18px; line-height:1.4; text-wrap:pretty\">For mild loss of side vision with sharp central sight, the mildest level the fact sheet names. A narrow path with many quick turns. Cubes stand close on both sides and just past the corners.<\u002Fp>\n            <\u002Farticle>\n            <article style=\"flex:1 1 340px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\">\n              <div style=\"font-size:14px; font-weight:800; letter-spacing:.08em; color:var(--color-accent-400,#ff9783)\">TUNNEL VISION<\u002Fdiv>\n              <h4 style=\"margin:4px 0 12px; font-family:inherit; font-size:30px; line-height:1; font-weight:900; color:var(--color-bg,#f3f2f2)\">THE FORKS<\u002Fh4>\n              <img ref=\"{{ refForks }}\" alt=\"{{ altForks }}\" style=\"display:block; width:100%; aspect-ratio:10/6; box-sizing:border-box; background:#161514; border:2px solid var(--color-bg,#f3f2f2)\">\n              <div style=\"margin-top:8px; font-size:15px; font-weight:800; letter-spacing:.04em\">{{ metaForks }}<\u002Fdiv>\n              <p style=\"margin:10px 0 0; font-size:18px; line-height:1.4; text-wrap:pretty\">For loss of side vision, as in retinitis pigmentosa. The path runs on to a cube and stops. The way forward branches off to the side.<\u002Fp>\n            <\u002Farticle>\n            <article style=\"flex:1 1 340px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\">\n              <div style=\"font-size:14px; font-weight:800; letter-spacing:.08em; color:var(--color-accent-400,#ff9783)\">CENTRAL LOSS<\u002Fdiv>\n              <h4 style=\"margin:4px 0 12px; font-family:inherit; font-size:30px; line-height:1; font-weight:900; color:var(--color-bg,#f3f2f2)\">THE SLALOM<\u002Fh4>\n              <img ref=\"{{ refSlalom }}\" alt=\"{{ altSlalom }}\" style=\"display:block; width:100%; aspect-ratio:10/6; box-sizing:border-box; background:#161514; border:2px solid var(--color-bg,#f3f2f2)\">\n              <div style=\"margin-top:8px; font-size:15px; font-weight:800; letter-spacing:.04em\">{{ metaSlalom }}<\u002Fdiv>\n              <p style=\"margin:10px 0 0; font-size:18px; line-height:1.4; text-wrap:pretty\">For loss of central vision, as in Leber hereditary optic neuropathy. A wide path with long straights. Cubes stand in the path itself, straight ahead.<\u002Fp>\n            <\u002Farticle>\n            <article style=\"flex:1 1 340px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 20px\">\n              <div style=\"font-size:14px; font-weight:800; letter-spacing:.08em; color:var(--color-accent-400,#ff9783)\">LIGHT PERCEPTION ONLY<\u002Fdiv>\n              <h4 style=\"margin:4px 0 12px; font-family:inherit; font-size:30px; line-height:1; font-weight:900; color:var(--color-bg,#f3f2f2)\">THE LIT PATH<\u002Fh4>\n              <img ref=\"{{ refLit }}\" alt=\"{{ altLit }}\" style=\"display:block; width:100%; aspect-ratio:10/6; box-sizing:border-box; background:#161514; border:2px solid var(--color-bg,#f3f2f2)\">\n              <div style=\"margin-top:8px; font-size:15px; font-weight:800; letter-spacing:.04em\">{{ metaLit }}<\u002Fdiv>\n              <p style=\"margin:10px 0 0; font-size:18px; line-height:1.4; text-wrap:pretty\">For the most severe level the fact sheet names. The room is dark and the path itself is lit. From level 2 up, a cube shows as a dark gap in the light.<\u002Fp>\n            <\u002Farticle>\n          <\u002Fdiv>\n          <div style=\"margin-top:10px; font-size:16px; font-weight:600\">Plans seen from above. The room is 10 by 6 metres, a stand-in size.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"light\" data-screen-label=\"05 The light\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">05<\u002Fdiv>\n      <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">THE LIGHT<\u002Fh2>\n    <\u002Fheader>\n    <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">Ora standardizes the ambient light. In the fact sheet's words the levels are “independent of room size and features”, so the light does not depend on the room a clinical centre happens to have.<\u002Fp>\n      <p style=\"margin:0; text-wrap:pretty\">The three sources give no number for a light level, and do not say how many levels there are.<\u002Fp>\n      <sc-if value=\"{{ ourRoom }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:28px; padding:16px 16px 18px; border:2px solid var(--color-bg,#f3f2f2)\">\n          <div style=\"display:inline-block; padding:4px 9px; background:var(--color-bg,#f3f2f2); color:var(--color-text,#201e1d); font-size:14px; font-weight:900; letter-spacing:.08em\">IN OUR 3D ROOM · A STAND-IN<\u002Fdiv>\n          <p style=\"margin:12px 0 16px; font-size:19px; line-height:1.4; text-wrap:pretty\">Seven steps, from 1 to 400 lux. A screen cannot be set to a measured lux, so the room shows the steps in proportion.<\u002Fp>\n          <div style=\"display:flex; gap:4px\">\n            <div style=\"flex:1 1 0; min-width:0\"><div style=\"height:64px; box-sizing:border-box; background:#0f0e0e; border:2px solid #f3f2f2\"><\u002Fdiv><div style=\"margin-top:6px; font-size:17px; font-weight:900\">1<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 0; min-width:0\"><div style=\"height:64px; box-sizing:border-box; background:#313030; border:2px solid #f3f2f2\"><\u002Fdiv><div style=\"margin-top:6px; font-size:17px; font-weight:900\">4<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 0; min-width:0\"><div style=\"height:64px; box-sizing:border-box; background:#505050; border:2px solid #f3f2f2\"><\u002Fdiv><div style=\"margin-top:6px; font-size:17px; font-weight:900\">10<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 0; min-width:0\"><div style=\"height:64px; box-sizing:border-box; background:#929191; border:2px solid #f3f2f2\"><\u002Fdiv><div style=\"margin-top:6px; font-size:17px; font-weight:900\">50<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 0; min-width:0\"><div style=\"height:64px; box-sizing:border-box; background:#bbbaba; border:2px solid #f3f2f2\"><\u002Fdiv><div style=\"margin-top:6px; font-size:17px; font-weight:900\">125<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 0; min-width:0\"><div style=\"height:64px; box-sizing:border-box; background:#dcdbdb; border:2px solid #f3f2f2\"><\u002Fdiv><div style=\"margin-top:6px; font-size:17px; font-weight:900\">250<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 0; min-width:0\"><div style=\"height:64px; box-sizing:border-box; background:#f3f2f2; border:2px solid #f3f2f2\"><\u002Fdiv><div style=\"margin-top:6px; font-size:17px; font-weight:900\">400<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:6px; font-size:16px; font-weight:600\">Lux, darkest to brightest.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"score\" data-screen-label=\"06 Scoring and grading\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">06<\u002Fdiv>\n      <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">SCORING AND GRADING<\u002Fh2>\n    <\u002Fheader>\n    <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">Every session is recorded and sent to Ora's independent reading centre. Certified graders score the walker's performance there.<\u002Fp>\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">The graders are masked, and the grading follows FDA requirements. The aim is the same objective score from every clinical site.<\u002Fp>\n      <p style=\"margin:0; text-wrap:pretty\">The sources do not give the scoring rule itself: what the graders count, a time limit, or a pass mark.<\u002Fp>\n      <sc-if value=\"{{ ourRoom }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:28px; padding:16px 16px 18px; border:2px solid var(--color-bg,#f3f2f2)\">\n          <div style=\"display:inline-block; padding:4px 9px; background:var(--color-bg,#f3f2f2); color:var(--color-text,#201e1d); font-size:14px; font-weight:900; letter-spacing:.08em\">IN OUR 3D ROOM · A STAND-IN<\u002Fdiv>\n          <p style=\"margin:12px 0 0; font-size:19px; line-height:1.4; text-wrap:pretty\">The room counts the time, each touch of a cube, and each step off the tiles. A walk passes with 3 faults or fewer in 180 seconds or less. The rule is ours until Ora gives the real one.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"used\" data-screen-label=\"07 Where it is used\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">07<\u002Fdiv>\n      <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">WHERE IT IS USED<\u002Fh2>\n    <\u002Fheader>\n    <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n      <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin:0 0 20px; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\">\n        <div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:56px; line-height:1; font-weight:900; letter-spacing:-.02em\">20+<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">clinical trials have used the course as an endpoint.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">RETINA AND MACULAR DISEASES PAGE<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:28px; line-height:1; font-weight:900; letter-spacing:-.01em\">PRIMARY ENDPOINT<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">Ora states that the FDA has accepted the Ora-VNC™ as a primary endpoint in the United States.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">ENDPOINTS AND TECHNOLOGIES PAGE<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:28px; line-height:1; font-weight:900; letter-spacing:-.01em\">WORLDWIDE<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">The courses serve as functional endpoints in trials around the world, and are built for studies at many centres.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">FACT SHEET, PAGES 4 AND 5<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 16px; text-wrap:pretty\">Ora has presented its mobility courses to the FDA as endpoints in four kinds of program: gene therapy, oligonucleotides, RNA therapy and medical devices.<\u002Fp>\n      <p style=\"margin:0; text-wrap:pretty\">The Retina page lists the course as an FDA-accepted endpoint in studies of inherited retinal disease.<\u002Fp>\n      <h3 style=\"margin:36px 0 12px; font-family:inherit; font-size:17px; line-height:1.2; font-weight:800; letter-spacing:.08em; color:var(--color-bg,#f3f2f2)\">THE COURSE IN FIVE POINTS · ORA'S OWN LIST<\u002Fh3>\n      <figure style=\"margin:0 0 14px\">\n        <div style=\"position:relative; aspect-ratio:3/2; background:#161514; border:2px solid var(--color-bg,#f3f2f2); filter:{{ photoFilter }}\">\n          <image-slot id=\"mc-about-retina\" shape=\"rect\" fit=\"contain\" src=\"7701a29c-e769-4a43-b3cd-a3afa282384a\" credit=\"Photo: Ora\" placeholder=\"DROP A PHOTO OF THE COURSE\" style=\"position:absolute; inset:0; width:100%; height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <figcaption style=\"margin-top:8px; font-size:16px; font-weight:600; color:var(--color-bg,#f3f2f2)\">The course, as Ora's Retina and Macular Diseases page shows it.<\u002Ffigcaption>\n      <\u002Ffigure>\n      <ol style=\"list-style:none; margin:0; padding:0; border-top:2px solid var(--color-bg,#f3f2f2)\">\n        <li style=\"display:flex; gap:14px; align-items:baseline; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><span style=\"flex:none; width:1.1em; font-weight:900; color:var(--color-accent-400,#ff9783)\">1<\u002Fspan><span style=\"min-width:0\">A broad range of courses, for different types of vision loss and levels of severity.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:14px; align-items:baseline; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><span style=\"flex:none; width:1.1em; font-weight:900; color:var(--color-accent-400,#ff9783)\">2<\u002Fspan><span style=\"min-width:0\">Difficulty levels that can be set for a wide range of patients.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:14px; align-items:baseline; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><span style=\"flex:none; width:1.1em; font-weight:900; color:var(--color-accent-400,#ff9783)\">3<\u002Fspan><span style=\"min-width:0\">Objective scoring by a fully masked, independent reading centre.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:14px; align-items:baseline; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><span style=\"flex:none; width:1.1em; font-weight:900; color:var(--color-accent-400,#ff9783)\">4<\u002Fspan><span style=\"min-width:0\">A design made for studies at many centres.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:14px; align-items:baseline; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><span style=\"flex:none; width:1.1em; font-weight:900; color:var(--color-accent-400,#ff9783)\">5<\u002Fspan><span style=\"min-width:0\">An endpoint the FDA has accepted in studies of inherited retinal disease.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <div style=\"margin-top:10px; font-size:16px; font-weight:600\">Source: the Retina and Macular Diseases page.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ aboutOra }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"ora\" data-screen-label=\"Who is behind it\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n      <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n        <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">{{ nOra }}<\u002Fdiv>\n        <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">WHO IS BEHIND IT<\u002Fh2>\n      <\u002Fheader>\n      <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n        <p style=\"margin:0 0 16px; text-wrap:pretty\">Ora is a contract research organization that works only in ophthalmology. Companies developing an eye drug or device, called sponsors, bring their clinical trials to it. Its Retina and Macular Disease team has worked in retina research for more than thirty years.<\u002Fp>\n        <p style=\"margin:0 0 24px; text-wrap:pretty\">The Retina page says why the work is pressing. Retina and macular diseases are among the leading causes of vision loss and blindness worldwide. Ageing populations, more hypertension and diabetes, and more autoimmune disease are raising the need for new therapies.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin:0 0 16px; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\"><div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:48px; line-height:1; font-weight:900; letter-spacing:-.02em\">50+<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">years as a research organization that works only in ophthalmology.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">RETINA AND MACULAR DISEASES PAGE<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:48px; line-height:1; font-weight:900; letter-spacing:-.02em\">3,000+<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">clinical ophthalmology projects completed.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">ORA'S SITE, MAIN MENU<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:48px; line-height:1; font-weight:900; letter-spacing:-.02em\">80+<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">products Ora has helped bring to market.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">FACT SHEET, PAGE 8 · APRIL 2024<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:48px; line-height:1; font-weight:900; letter-spacing:-.02em\">135+<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">retina and macular disease programs in the last five years.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">RETINA AND MACULAR DISEASES PAGE<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:48px; line-height:1; font-weight:900; letter-spacing:-.02em\">1,450+<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">patients enrolled in them.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">RETINA AND MACULAR DISEASES PAGE<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 230px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:48px; line-height:1; font-weight:900; letter-spacing:-.02em\">240+<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.35\">sites activated for them.<\u002Fdiv><div style=\"margin-top:10px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">RETINA AND MACULAR DISEASES PAGE<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:0; text-wrap:pretty\">The April 2024 fact sheet counts more than 45 clinical trials in retinal indications over the five years before it.<\u002Fp>\n\n        <h3 style=\"margin:36px 0 12px; font-family:inherit; font-size:17px; line-height:1.2; font-weight:800; letter-spacing:.08em; color:var(--color-bg,#f3f2f2)\">THE PEOPLE THE SOURCES NAME<\u002Fh3>\n        <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin:0; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\"><div style=\"flex:1 1 100%; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:24px; line-height:1.1; font-weight:900\">KEITH LANE, MBA<\u002Fdiv><div style=\"margin-top:6px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">SENIOR VICE PRESIDENT OF POSTERIOR SEGMENT · FACT SHEET, PAGE 2 · APRIL 2024<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.4\">Led the development and launch of the Ora-VNC™, with its clinical operations and regulatory strategy. Joined Ora in 2003. Earlier ran Ora's research and development department for nearly ten years, where clinical models, endpoints and trial processes we
