re created and validated. Has overseen more than 80 ophthalmology trials, from first-in-human safety studies to global Phase 3 programs.<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 300px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:24px; line-height:1.1; font-weight:900\">JOHN TREIN<\u002Fdiv><div style=\"margin-top:6px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">THERAPEUTIC LEAD, POSTERIOR · RETINA PAGE<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.4\">A practising retina specialist with more than 20 years in retinal surgery and care. Leads strategy across Ora's retinal programs: study design, endpoints, finding patients and safety oversight.<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 300px; min-width:0; background:var(--color-text,#201e1d); padding:16px 16px 18px\"><div style=\"font-size:24px; line-height:1.1; font-weight:900\">COURTNEY ROSHAU<\u002Fdiv><div style=\"margin-top:6px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.04em; color:var(--color-accent-400,#ff9783)\">VICE PRESIDENT, PROJECT DELIVERY, POSTERIOR · RETINA PAGE<\u002Fdiv><div style=\"margin-top:10px; font-size:18px; line-height:1.4\">More than 15 years in ophthalmic clinical research. Has led more than 25 ophthalmology studies, inherited retinal diseases among them.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n        <h3 style=\"margin:36px 0 12px; font-family:inherit; font-size:17px; line-height:1.2; font-weight:800; letter-spacing:.08em; color:var(--color-bg,#f3f2f2)\">WHERE ORA HAS RUN TRIALS<\u002Fh3>\n        <p style=\"margin:0 0 16px; text-wrap:pretty\">Ora has teams in North and South America, Europe, Asia and Australia. Its fact sheet lists the countries where it worked on clinical trials in the six years to April 2024. We count 28.<\u002Fp>\n        <div style=\"border-top:2px solid var(--color-bg,#f3f2f2)\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px 20px; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"flex:0 0 190px; font-size:16px; line-height:1.3; font-weight:900; letter-spacing:.04em\">EUROPE · 19<\u002Fdiv><div style=\"flex:1 1 260px; min-width:0; font-size:18px; line-height:1.4\">Austria, Belgium, Czechia, Denmark, France, Germany, Hungary, Ireland, Italy, Lithuania, the Netherlands, Norway, Poland, Portugal, Slovakia, Spain, Switzerland, the United Kingdom, Ukraine.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px 20px; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"flex:0 0 190px; font-size:16px; line-height:1.3; font-weight:900; letter-spacing:.04em\">NORTH AMERICA · 2<\u002Fdiv><div style=\"flex:1 1 260px; min-width:0; font-size:18px; line-height:1.4\">Canada, the United States.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px 20px; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"flex:0 0 190px; font-size:16px; line-height:1.3; font-weight:900; letter-spacing:.04em\">LATIN AMERICA · 2<\u002Fdiv><div style=\"flex:1 1 260px; min-width:0; font-size:18px; line-height:1.4\">Brazil, Argentina.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px 20px; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"flex:0 0 190px; font-size:16px; line-height:1.3; font-weight:900; letter-spacing:.04em\">MIDDLE EAST AND NORTH AFRICA · 1<\u002Fdiv><div style=\"flex:1 1 260px; min-width:0; font-size:18px; line-height:1.4\">Israel.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px 20px; padding:12px 0; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"flex:0 0 190px; font-size:16px; line-height:1.3; font-weight:900; letter-spacing:.04em\">ASIA-PACIFIC · 4<\u002Fdiv><div style=\"flex:1 1 260px; min-width:0; font-size:18px; line-height:1.4\">China, Japan, Australia, New Zealand.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px; font-size:16px; font-weight:600\">Source: fact sheet, pages 1 and 3.<\u002Fdiv>\n\n        <h3 style=\"margin:36px 0 12px; font-family:inherit; font-size:17px; line-height:1.2; font-weight:800; letter-spacing:.08em; color:var(--color-bg,#f3f2f2)\">TRIALS BY PHASE<\u002Fh3>\n        <div style=\"display:flex; gap:2px; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\">\n          <div style=\"flex:24 1 0; min-width:0; background:var(--color-text,#201e1d); padding:12px 8px 14px\"><div style=\"font-size:14px; font-weight:800; white-space:nowrap\">PHASE 1<\u002Fdiv><div style=\"margin-top:4px; font-size:clamp(24px,7vw,40px); line-height:1; font-weight:900\">24%<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:43 1 0; min-width:0; background:var(--color-text,#201e1d); padding:12px 8px 14px\"><div style=\"font-size:14px; font-weight:800; white-space:nowrap\">PHASE 2<\u002Fdiv><div style=\"margin-top:4px; font-size:clamp(24px,7vw,40px); line-height:1; font-weight:900\">43%<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:31 1 0; min-width:0; background:var(--color-text,#201e1d); padding:12px 8px 14px\"><div style=\"font-size:14px; font-weight:800; white-space:nowrap\">PHASE 3<\u002Fdiv><div style=\"margin-top:4px; font-size:clamp(24px,7vw,40px); line-height:1; font-weight:900\">31%<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px; font-size:16px; font-weight:600\">The clinical phase experience of Ora's retina team, as the fact sheet prints it on page 3.<\u002Fdiv>\n\n        <h3 style=\"margin:36px 0 12px; font-family:inherit; font-size:17px; line-height:1.2; font-weight:800; letter-spacing:.08em; color:var(--color-bg,#f3f2f2)\">REGULATORS<\u002Fh3>\n        <p style=\"margin:0; text-wrap:pretty\">Ora's regulatory team drafts and submits regulatory packages. It deals with the FDA in the United States, the EMA in Europe, the PMDA in Japan, the NMPA in China, and other bodies.<\u002Fp>\n\n        <h3 style=\"margin:36px 0 12px; font-family:inherit; font-size:17px; line-height:1.2; font-weight:800; letter-spacing:.08em; color:var(--color-bg,#f3f2f2)\">AREAS OF EXPERTISE ON THE FACT SHEET<\u002Fh3>\n        <ul style=\"list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px\">\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Achromatopsia<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Choroideremia<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Cystoid macular edema<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Diabetic macular edema<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Diabetic macular ischemia<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Diabetic retinopathy<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Dry age-related macular degeneration, including geographic atrophy<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Glaucoma and neuroprotection<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Leber congenital amaurosis (LCA)<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Leber hereditary optic neuropathy (LHON)<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Macular degeneration<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Myopia progression<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Proliferative vitreoretinopathy<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Retinal vein occlusion, branch and central<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Retinitis pigmentosa<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Retinoschisis<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Stargardt disease<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Uveal melanoma<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Uveitis: anterior, intermediate, posterior<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Vitreomacular adhesion<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Wet age-related macular degeneration<\u002Fli>\n          <li style=\"padding:6px 10px; border:2px solid var(--color-neutral-600,#7d7979); font-size:16px; line-height:1.25; font-weight:700\">Thyroid eye disease<\u002Fli>\n        <\u002Ful>\n        <div style=\"margin-top:10px; font-size:16px; font-weight:600\">Among its key indications the Retina page also names Usher syndrome and retinal dystrophy.<\u002Fdiv>\n        <p style=\"margin:20px 0 0; text-wrap:pretty\">The Retina page also cites Ora's experience with regulators and with intravitreal and sub-retinal injections, a diabetic macular edema drug approved in the United States in 2023, and two retina trials that finished enrolling ahead of schedule.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ otherEndpoints }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"tools\" data-screen-label=\"Also from Ora\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n      <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n        <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">{{ nTools }}<\u002Fdiv>\n        <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">ALSO FROM ORA<\u002Fh2>\n      <\u002Fheader>\n      <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n        <p style=\"margin:0 0 20px; text-wrap:pretty\">The mobility course is one of several endpoints and tools Ora has built. Its Endpoints and Technologies page presents six others. The fact sheet describes two more tests, both for retinal disease.<\u002Fp>\n        <div style=\"border-top:2px solid var(--color-bg,#f3f2f2)\">\n          <div style=\"padding:16px 0 18px; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"font-size:22px; line-height:1.15; font-weight:900\">ORA CAE®<\u002Fdiv><div style=\"margin-top:4px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">CONTROLLED ADVERSE ENVIRONMENT<\u002Fdiv><div style=\"margin-top:8px; font-size:18px; line-height:1.4\">A setting that holds temperature, humidity, airflow, lighting and visual tasking constant, so every patient meets the same challenge.<\u002Fdiv><div style=\"margin-top:8px; font-size:16px; line-height:1.35; font-weight:800\">Accepted by the FDA as a primary endpoint for Phase 2 and 3 studies in the United States.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:16px 0 18px; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"font-size:22px; line-height:1.15; font-weight:900\">IVAD<\u002Fdiv><div style=\"margin-top:4px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">INTER-BLINK INTERVAL VISUAL ACUITY DECAY<\u002Fdiv><div style=\"margin-top:8px; font-size:18px; line-height:1.4\">A measure of visual function, built by Ora's research team, that shows a therapy's effect on the breakdown of the eye's surface.<\u002Fdiv><div style=\"margin-top:8px; font-size:16px; line-height:1.35; font-weight:800\">Validated by Ora as a secondary endpoint in the United States, Europe and Latin America.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:16px 0 18px; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"font-size:22px; line-height:1.15; font-weight:900\">OPI 2.0©<\u002Fdiv><div style=\"margin-top:4px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">OCULAR PROTECTION INDEX<\u002Fdiv><div style=\"margin-top:8px; font-size:18px; line-height:1.4\">Measures the breakup of the tear film: how long it takes, and how much of the surface it covers.<\u002Fdiv><div style=\"margin-top:8px; font-size:16px; line-height:1.35; font-weight:800\">Validated as a secondary endpoint in the United States.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:16px 0 18px; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"font-size:22px; line-height:1.15; font-weight:900\">ORA EYECUP™<\u002Fdiv><div style=\"margin-top:8px; font-size:18px; line-height:1.4\">A data-capture system, powered by SDC Capture, that collects patient data inside the clinic and outside it. A trial gathers more data points in less time.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:16px 0 18px; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"font-size:22px; line-height:1.15; font-weight:900\">LISSAMINE GREEN<\u002Fdiv><div style=\"margin-top:8px; font-size:18px; line-height:1.4\">A stain that shows the health of the conjunctiva. Ora reports that it stays more consistent from visit to visit than sodium fluorescein.<\u002Fdiv><div style=\"margin-top:8px; font-size:16px; line-height:1.35; font-weight:800\">Validated by Ora as a secondary endpoint in the United States, Europe and Latin America.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:16px 0 18px; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"font-size:22px; line-height:1.15; font-weight:900\">ORA-CAC®<\u002Fdiv><div style=\"margin-top:4px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">CONJUNCTIVAL ALLERGEN CHALLENGE MODEL<\u002Fdiv><div style=\"margin-top:8px; font-size:18px; line-height:1.4\">Used for more than 40 years to test anti-allergy treatments for allergic conjunctivitis.<\u002Fdiv><div style=\"margin-top:8px; font-size:16px; line-height:1.35; font-weight:800\">Its severity scales are accepted by regulators around the world.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:16px 0 18px; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"font-size:22px; line-height:1.15; font-weight:900\">ORA-VCF™ CONTRAST TEST<\u002Fdiv><div style=\"margin-top:4px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">VARIABLE CONTRAST FLICKER · FACT SHEET, PAGES 6 AND 7<\u002Fdiv><div style=\"margin-top:8px; font-size:18px; line-height:1.4\">A test for early loss of visual function in retinal disease, such as early age-related macular degeneration (AMD). In Ora's study it separated people with non-advanced AMD from people with normal sight, where ETDRS acuity and Pelli-Robson contrast sensitivity did not.<\u002Fdiv><div style=\"margin-top:8px; font-size:16px; line-height:1.35; font-weight:800\">Test-retest agreement: 82.1% within a day, 88.9% two weeks later.<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:16px 0 18px; border-bottom:2px solid var(--color-neutral-700,#605d5d)\"><div style=\"font-size:22px; line-height:1.15; font-weight:900\">LOW LUMINANCE TABLET READING TEST<\u002Fdiv><div style=\"margin-top:4px; font-size:15px; line-height:1.3; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">FACT SHEET, PAGE 7<\u002Fdiv><div style=\"margin-top:8px; font-size:18px; line-height:1.4\">A reading test in low light. With the flicker test, it showed significant visual dysfunction in people with AMD compared with people with normal sight.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ ourRoom }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"room\" data-screen-label=\"Our 3D room\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n      <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n        <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">{{ nRoom }}<\u002Fdiv>\n        <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">OUR 3D ROOM<\u002Fh2>\n      <\u002Fheader>\n      <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n        <p style=\"margin:0 0 20px; text-wrap:pretty\">The Blind Canvas Project built a 3D room modelled on the course. Anyone can walk it, with clear sight or through a simulated eye condition. Where Ora's sources state something, the room follows it. Where they are silent, the room uses a stand-in. Both are listed here.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:2px; background:var(--color-bg,#f3f2f2); border:2px solid var(--color-bg,#f3f2f2)\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:2px\">\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">THE LOOK · FROM ORA'S PHOTOS<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">A dark floor, white toothed tiles, cubes in four colours, some turned, a flat coloured tile.<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em\">OUR STAND-IN<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">The sizes: a room of 10 × 6 × 2.7 m, tiles and cubes 0.6 m on an edge.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:2px\">\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">THE LAYOUTS · FROM ORA<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Different courses for different kinds and severities of loss. Difficulty levels. Several versions of each.<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em\">OUR STAND-IN<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">The four layouts, their three levels and twelve versions are our own designs.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:2px\">\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">THE LIGHT · FROM ORA<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Standardized ambient light levels.<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em\">OUR STAND-IN<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Seven steps from 1 to 400 lux, shown in proportion.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:2px\">\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">THE SCORE · FROM ORA<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Sessions are recorded. Masked, certified graders score them at an independent reading centre.<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em\">OUR STAND-IN<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">Time, touches and steps off the tiles. A pass is 3 faults or fewer in 180 seconds or less. Four ceiling cameras give a replay from above.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:2px\">\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em; color:var(--color-accent-400,#ff9783)\">THE EYE CONDITIONS · FROM ORA<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">The kinds of loss the courses are made for: central, light perception and side vision.<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 250px; min-width:0; background:var(--color-text,#201e1d); padding:14px 16px 16px\"><div style=\"font-size:15px; font-weight:800; letter-spacing:.06em\">OUR STAND-IN<\u002Fdiv><div style=\"margin-top:6px; font-size:18px; line-height:1.4\">The on-screen sight filters are simple stand-ins, not medical simulations.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"{{ courseUrl }}\" style=\"display:flex; align-items:center; min-height:60px; box-sizing:border-box; margin-top:20px; padding:10px 18px; background:var(--color-accent-600,#dd2b0f); border:2px solid var(--color-accent-600,#dd2b0f); color:#ffffff; text-decoration:none; font-size:19px; font-weight:800; letter-spacing:.03em\" style-hover=\"background:var(--color-accent-700,#ae1800); border-color:var(--color-accent-700,#ae1800); color:#ffffff\" style-focus=\"outline:2px solid var(--color-bg,#f3f2f2); outline-offset:2px\">WALK THE COURSE IN 3D<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"sources\" data-screen-label=\"Sources\" style=\"display:flex; flex-wrap:wrap; gap:0 40px; padding:clamp(36px,6vw,72px) clamp(20px,5vw,56px); border-bottom:2px solid var(--color-bg,#f3f2f2)\">\n    <header style=\"flex:1 1 240px; min-width:0; container-type:inline-size\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--color-accent-400,#ff9783)\">READ ON 14 NOVEMBER 2026<\u002Fdiv>\n      <h2 style=\"margin:6px 0 22px; font-family:inherit; font-size:clamp(26px,16cqw,40px); line-height:1; overflow-wrap:break-word; font-weight:900; letter-spacing:-.01em; color:var(--color-bg,#f3f2f2)\">THE SOURCES<\u002Fh2>\n    <\u002Fheader>\n    <div style=\"flex:3 1 480px; min-width:0; max-width:820px\">\n      <div style=\"border-top:2px solid var(--color-bg,#f3f2f2)\">\n        <a href=\"https://oraclinical.com/endpoints-and-technologies/\" target=\"_blank\" rel=\"noopener\" style=\"display:block; padding:14px 0 16px; border-bottom:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\"><div style=\"font-size:21px; line-height:1.2; font-weight:900\">ORA · ENDPOINTS AND TECHNOLOGIES<\u002Fdiv><div style=\"margin-top:4px; font-size:17px; line-height:1.35; overflow-wrap:anywhere; text-decoration:underline\">oraclinical.com/endpoints-and-technologies<\u002Fdiv><\u002Fa>\n        <a href=\"https://oraclinical.com/retina-macular-diseases/\" target=\"_blank\" rel=\"noopener\" style=\"display:block; padding:14px 0 16px; border-bottom:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\"><div style=\"font-size:21px; line-height:1.2; font-weight:900\">ORA · RETINA AND MACULAR DISEASES<\u002Fdiv><div style=\"margin-top:4px; font-size:17px; line-height:1.35; overflow-wrap:anywhere; text-decoration:underline\">oraclinical.com/retina-macular-diseases<\u002Fdiv><\u002Fa>\n        <a href=\"http://oraclinical.com/wp-content/uploads/2024/04/Ora_FactSheet_Posterior_Segment_042624_digital.pdf\" target=\"_blank\" rel=\"noopener\" style=\"display:block; padding:14px 0 16px; border-bottom:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\"><div style=\"font-size:21px; line-height:1.2; font-weight:900\">ORA · FACT SHEET: RETINA, GLAUCOMA, REFRACTIVE AND CED<\u002Fdiv><div style=\"margin-top:4px; font-size:17px; line-height:1.35; overflow-wrap:anywhere; text-decoration:underline\">PDF, 8 pages. The course is on pages 4 and 5.<\u002Fdiv><\u002Fa>\n        <a href=\"https://player.vimeo.com/video/936308338\" target=\"_blank\" rel=\"noopener\" style=\"display:block; padding:14px 0 16px; border-bottom:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\"><div style=\"font-size:21px; line-height:1.2; font-weight:900\">ORA · FILM OF THE COURSE<\u002Fdiv><div style=\"margin-top:4px; font-size:17px; line-height:1.35; overflow-wrap:anywhere; text-decoration:underline\">Vimeo, from the Endpoints and Technologies page<\u002Fdiv><\u002Fa>\n        <a href=\"https://oraclinical.com/endpoints-and-technologies/#vnc\" target=\"_blank\" rel=\"noopener\" style=\"display:block; padding:14px 0 16px; border-bottom:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\"><div style=\"font-size:21px; line-height:1.2; font-weight:900\">ORA · THE WHITEPAPER ON THE COURSE<\u002Fdiv><div style=\"margin-top:4px; font-size:17px; line-height:1.35; overflow-wrap:anywhere; text-decoration:underline\">Offered in the Ora-VNC section of the Endpoints and Technologies page<\u002Fdiv><\u002Fa>\n        <a href=\"https://oraclinical.com/blind-canvas-project/\" target=\"_blank\" rel=\"noopener\" style=\"display:block; padding:14px 0 16px; border-bottom:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\"><div style=\"font-size:21px; line-height:1.2; font-weight:900\">ORA · THE BLIND CANVAS PROJECT<\u002Fdiv><div style=\"margin-top:4px; font-size:17px; line-height:1.35; overflow-wrap:anywhere; text-decoration:underline\">oraclinical.com/blind-canvas-project<\u002Fdiv><\u002Fa>\n        <a href=\"https://oraclinical.com/contact-us/\" target=\"_blank\" rel=\"noopener\" style=\"display:block; padding:14px 0 16px; border-bottom:2px solid var(--color-bg,#f3f2f2); color:var(--color-bg,#f3f2f2); text-decoration:none\" style-hover=\"background:var(--color-accent-900,#4d170e); color:var(--color-bg,#f3f2f2)\" style-focus=\"outline:2px solid var(--color-accent-400,#ff9783); outline-offset:2px\"><div style=\"font-size:21px; line-height:1.2; font-weight:900\">ORA · CONTACT<\u002Fdiv><div style=\"margin-top:4px; font-size:17px; line-height:1.35; overflow-wrap:anywhere; text-decoration:underline\">oraclinical.com/contact-us · +1 978 685 8900 · Andover, Massachusetts<\u002Fdiv><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:28px clamp(20px,5vw,56px) 40px; font-size:16px; line-height:1.45; font-weight:600\">\n    <div style=\"max-width:46em\">Ora-VNC™ and VNC™ are Ora's marks. Ora's name, logo and photos are used with Ora's permission. Written by the Blind Canvas Project from the sources above.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;courseUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;./Mobility Course.html&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;galleryUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://blindbenfilms.github.io/FOXgate8/3D/gallery.html&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;photos&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;colour&quot;,&quot;black and white&quot;],&quot;default&quot;:&quot;colour&quot;,&quot;tsType&quot;:&quot;'colour' | 'black and white'&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;ourRoom&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;aboutOra&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;otherEndpoints&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { level: 1, n: 1, MC: null, err: '' };\n  cache = {}; srcs = {};\n  refs = { Weave: React.createRef(), Forks: React.createRef(), Slalom: React.createRef(), Lit: React.createRef() };\n  componentDidMount() {\n    import((window.__resources || {}).course || new URL('./mobility-course.js', document.baseURI).href).then(MC => this.setState({ MC })).catch(e => { console.error(e); this.setState({ err: 'THE PLANS DID NOT LOAD.' }); });\n  }\n  componentDidUpdate() { this.paint(); }\n  // the plan pictures are set through refs: a template hole in an img src is fetched as a URL before the page compiles\n  paint() { for (const K in this.refs) { const el = this.refs[K].current, src = this.srcs[K]; if (el && src && el.getAttribute('src') !== src) el.setAttribute('src', src); } }\n  // one layout of the 3D room, seen from above, as an SVG picture (the same planCourse the room is built from)\n  plan(key, name) {\n    const { MC, level, n } = this.state; if (!MC) return null;\n    const id = key + level + '.' + n; if (this.cache[id]) return this.cache[id];\n    const R = MC.planCourse(key, level, n), G = MC.GRID, T = G.tile, NI = G.ni, NJ = G.nj, S = 100, t = T * S, lit = R.glow, f = x => x.toFixed(1);\n    const X = u => (u + G.room[0] / 2) * S, Y = v => (v + G.room[1] / 2) * S, flat = new Map(R.flats.map(q => [q.j * NI + q.i, MC.FOAM[q.col]]));\n    let tiles = '';\n    for (let j = 0; j < NJ; j++) for (let i = 0; i < NI; i++) if (R.tiles[j * NI + i]) tiles += '<rect x=\"' + f(X((i - NI / 2) * T)) + '\" y=\"' + f(Y((j - NJ / 2) * T)) + '\" width=\"' + t + '\" height=\"' + t + '\" fill=\"' + (flat.get(j * NI + i) || (lit ? '#ffffff' : '#e9e7e1')) + '\" stroke=\"#8b8a86\" stroke-width=\"2\"/>';\n    let s = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 600\">' + (lit ? '<defs><filter id=\"g\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\"><feGaussianBlur stdDeviation=\"18\"/><\u002Ffilter><\u002Fdefs>' : '') + '<rect width=\"1000\" height=\"600\" fill=\"' + (lit ? '#050505' : '#161514') + '\"/>' + (lit ? '<g filter=\"url(#g)\" opacity=\".6\">' + tiles + '<\u002Fg>' : '') + tiles;\n    for (const c of R.cubes) s += '<rect x=\"' + (-t / 2) + '\" y=\"' + (-t / 2) + '\" width=\"' + t + '\" height=\"' + t + '\" transform=\"translate(' + f(X(c.u)) + ' ' + f(Y(c.v)) + ') rotate(' + f(-c.ry * 180 / Math.PI) + ')\" fill=\"' + (lit ? '#1b1a19' : MC.FOAM[c.col]) + '\" stroke=\"' + (lit ? '#8b8a86' : '#141312') + '\" stroke-width=\"5\"/>';\n    const ps = (R.W === 1 ? 0.5 : 0.95) * S, pad = (p, word) => { const x = X(p[0]), y = Y(p[1]), left = p[0] < 0, above = p[1] > -1.6;\n      return '<rect x=\"' + f(x - ps / 2) + '\" y=\"' + f(y - ps / 2) + '\" width=\"' + ps + '\" height=\"' + ps + '\" fill=\"#141312\"/><text x=\"' + (left ? 14 : 986) + '\" y=\"' + f(above ? y - ps / 2 - 24 : y + ps / 2 + 64) + '\" text-anchor=\"' + (left ? 'start' : 'end') + '\" font-family=\"Arial, Helvetica, sans-serif\" font-weight=\"900\" font-size=\"54\" fill=\"#ffffff\" stroke=\"#141312\" stroke-width=\"12\" stroke-linejoin=\"round\" paint-order=\"stroke\">' + word + '<\u002Ftext>'; };\n    s += pad(R.pts[0], 'START') + pad(R.pts[R.pts.length - 1], 'END') + '<\u002Fsvg>';\n    const pl = (k, w) => k + ' ' + w + (k === 1 ? '' : 'S'), count = pl(R.cubes.length, 'CUBE') + ' · ' + pl(R.turns, 'TURN') + (R.deadEnds ? ' · ' + pl(R.deadEnds, 'DEAD END') : '') + (R.flats.length ? ' · ' + pl(R.flats.length, 'FLAT TILE') : '');\n    return this.cache[id] = { src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s), meta: count, alt: 'Plan of ' + name + ', level ' + level + ', version ' + n + ', seen from above. ' + count.toLowerCase().replace(/ · /g, ', ') + '.' };\n  }\n  renderVals() {\n    const s = this.state, p = this.props, N = s.MC ? s.MC.ROUTES : 12;\n    const out = { courseUrl: p.courseUrl ?? './Mobility Course.html', galleryUrl: p.galleryUrl ?? 'https://blindbenfilms.github.io/FOXgate8/3D/gallery.html', ourRoom: p.ourRoom ?? true, aboutOra: p.aboutOra ?? true, otherEndpoints: p.otherEndpoints ?? true, photoFilter: (p.photos ?? 'colour') === 'black and white' ? 'grayscale(1)' : 'none',\n      levels: [1, 2, 3].map(l => ({ label: 'LEVEL ' + l, pressed: s.level === l, bg: s.level === l ? '#f3f2f2' : '#201e1d', fg: s.level === l ? '#201e1d' : '#f3f2f2', go: () => this.setState({ level: l }) })),\n      nextVersion: () => this.setState({ n: s.n % N + 1 }), versionLine: s.err || 'LEVEL ' + s.level + ' OF 3 · VERSION ' + s.n + ' OF ' + N };\n    for (const [k, K, name] of [['weave', 'Weave', 'THE WEAVE'], ['forks', 'Forks', 'THE FORKS'], ['slalom', 'Slalom', 'THE SLALOM'], ['lit', 'Lit', 'THE LIT PATH']]) { const P = this.plan(k, name); this.srcs[K] = P ? P.src : ''; out['ref' + K] = this.refs[K]; out['alt' + K] = P ? P.alt : ''; out['meta' + K] = P ? P.meta : s.err || 'LOADING THE PLAN'; }\n    let k = 7; const two = v => (v < 10 ? '0' : '') + v;   // the optional sections take the next free numbers\n    out.nOra = out.aboutOra ? two(++k) : ''; out.nTools = out.otherEndpoints ? two(++k) : ''; out.nRoom = out.ourRoom ? two(++k) : '';\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
