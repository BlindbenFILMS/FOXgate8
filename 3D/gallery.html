<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Blind Canvas Gallery · 8 GATES 3D</title>
<link rel="stylesheet" href="vendor/fonts/archivo.css">
<style>
  :root { --bg:#141312; --ink:#f3f2f2; --card:#232120; --accent:#ec3013; --teal:#22b8b0; --font:"Archivo",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0b0a12; color:var(--ink); font-family:var(--font); overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none; }
  #stage { position:fixed; inset:0; }
  .box { background:var(--bg); border:2px solid var(--ink); }
  button { font-family:var(--font); border-radius:0; cursor:pointer; text-align:left; color:var(--ink); }
  #place { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); display:flex; z-index:10; }
  #place .t { padding:8px 12px; min-width:180px; }
  #place .w { font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  #place .c { font:800 22px var(--font); line-height:1.05; }
  #micBtn { width:52px; border:2px solid var(--ink); border-left:0; background:var(--bg); color:var(--ink); font:800 11px/1.15 var(--font); letter-spacing:.06em; text-align:center; padding:0; white-space:pre-line; }
  #micBtn.on { background:var(--accent); color:#fff; }
  #avRow .av { flex:1; min-height:76px; padding:10px; background:#141312; color:#fff; border:2px solid #5a5654; font:400 26px/1 var(--font); text-align:center; }
  #avRow .av b { display:block; margin-top:6px; font:800 13px/1.2 var(--font); letter-spacing:.08em; text-transform:uppercase; }
  #avRow .av[aria-checked=true] { border-color:#ec3013; background:#2a1512; box-shadow:inset 0 -4px 0 #ec3013; }
  #menuBtn { width:48px; border:2px solid var(--ink); border-left:0; background:var(--bg); font-size:20px; text-align:center; }
  #act { position:fixed; right:calc(12px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom)); z-index:10; display:none; max-width:min(320px,52vw); min-height:52px; padding:10px 14px; background:var(--accent); color:#fff; border:2px solid var(--ink); font:800 13px/1.25 var(--font); letter-spacing:.06em; text-transform:uppercase; }
  #act small { display:block; font-size:10px; letter-spacing:.14em; opacity:.85; }
  #hint { position:fixed; left:50%; transform:translateX(-50%); top:calc(74px + env(safe-area-inset-top)); z-index:9; padding:6px 10px; font-size:12px; font-weight:600; max-width:calc(100vw - 24px); text-align:center; }
  #panel { position:fixed; z-index:20; left:50%; top:50%; transform:translate(-50%,-50%); width:min(720px,calc(100vw - 24px)); max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display:none; flex-direction:column; user-select:text; -webkit-user-select:text; touch-action:pan-y; }
  #panel header { display:flex; align-items:stretch; border-bottom:2px solid var(--ink); }
  #panel header .h { flex:1; padding:10px 14px; }
  #panel header .k { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  #panel header h2 { margin:2px 0 0; font:800 clamp(20px,5vw,30px)/1.05 var(--font); letter-spacing:-0.01em; }
  #panel header button { width:56px; border:0; border-left:2px solid var(--ink); background:var(--bg); font-size:22px; text-align:center; }
  #panel .body { overflow:auto; padding:14px; font-size:16px; line-height:1.5; -webkit-overflow-scrolling:touch; }
  #panel .art { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:14px; }
  @media (max-width:640px) { #panel .art { grid-template-columns:1fr; } }
  #panel .art img { width:100%; max-height:62dvh; object-fit:contain; border:2px solid var(--ink); background:#2b2928; display:block; }
  #panel .lab { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:12px 0 4px; }
  #panel .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  #panel .row button, #panel .row a { min-height:44px; padding:10px 14px; border:2px solid var(--ink); background:var(--card); font:800 12px var(--font); letter-spacing:.08em; text-transform:uppercase; text-decoration:none; color:var(--ink); display:inline-flex; align-items:center; }
  #panel .row .on { background:var(--ink); color:var(--bg); }
  #panel details { border-top:2px solid var(--ink); }
  #panel details:last-child { border-bottom:2px solid var(--ink); }
  #panel summary { min-height:48px; padding:12px 4px; font-weight:800; cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:8px; }
  #panel summary::after { content:'+'; font-size:20px; line-height:1; } #panel details[open] summary::after { content:'–'; }
  #panel details .a { padding:0 4px 12px; }
  #panel video { width:100%; border:2px solid var(--ink); background:#000; margin-top:8px; }
  .people { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .people .p { border:2px solid var(--ink); background:var(--card); }
  .people img { width:100%; aspect-ratio:1; object-fit:cover; display:block; border-bottom:2px solid var(--ink); }
  .people .p div { padding:8px; font-size:13px; } .people .p b { display:block; font-size:14px; }
  #menu { position:fixed; z-index:21; left:12px; top:calc(70px + env(safe-area-inset-top)); width:min(340px,calc(100vw - 24px)); display:none; padding:12px; max-height:calc(100dvh - 90px); overflow:auto; }
  #menu .lab { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:10px 0 6px; color:var(--accent); }
  #menu .opts { display:flex; flex-wrap:wrap; gap:6px; }
  #menu button { min-height:44px; padding:8px 12px; border:2px solid var(--ink); background:var(--card); font:800 12px var(--font); letter-spacing:.06em; text-transform:uppercase; }
  #menu button.on { background:var(--ink); color:var(--bg); }
  #menu a { display:block; margin-top:12px; padding:12px; border:2px solid var(--ink); background:var(--accent); color:#fff; font-weight:800; text-decoration:none; letter-spacing:.06em; text-transform:uppercase; font-size:13px; }
  #load { position:fixed; inset:0; z-index:30; background:#0b0a12; color:#f3f2f2; display:flex; flex-direction:column; justify-content:center; padding:24px; }
  #load .k { font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#ff9783; }
  #load h1 { font:800 clamp(40px,10vw,88px)/0.9 var(--font); letter-spacing:-0.04em; margin:8px 0 18px; }
  #load .bar { height:12px; border:2px solid #f3f2f2; max-width:420px; } #load .bar i { display:block; height:100%; width:0; background:var(--accent); }
  #load p { max-width:520px; color:#cfcaca; line-height:1.5; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="load"><div class="k">8 GATES · 3D · Ben Fox</div><h1>Blind Canvas<br>Project</h1><div class="bar"><i id="lb"></i></div><p id="lt">Opening the gallery…</p><label id="nameRow" style="display:none;max-width:420px;margin-top:6px"><span style="display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ff9783;margin-bottom:6px">Your name (others in the gallery see it)</span><input id="nameIn" maxlength="20" autocomplete="nickname" style="width:100%;min-height:52px;padding:10px 14px;background:#141312;color:#fff;border:2px solid #f3f2f2;border-radius:0;font:700 18px var(--font)" placeholder="Your name"></label><div id="avRow" style="display:none;max-width:420px;margin-top:14px"><span style="display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ff9783;margin-bottom:6px">Choose your avatar</span><div style="display:flex;gap:8px" role="radiogroup" aria-label="Choose your avatar"><button class="av" data-x="cane" role="radio">🦯<b>White cane</b></button><button class="av" data-x="chair" role="radio">♿<b>Wheelchair</b></button></div></div><button id="enter" style="display:none;margin-top:18px;min-height:56px;padding:14px 22px;max-width:420px;background:#ec3013;color:#fff;border:2px solid #f3f2f2;font:800 16px var(--font);letter-spacing:.08em;text-transform:uppercase;text-align:center">Enter the gallery · sound on 🔊</button></div>
<div id="place"><div class="t box"><div class="w">Blind Canvas Project</div><div class="c">The Gallery</div><div id="who" style="font-size:12px;font-weight:700;margin-top:3px;color:#cfcaca">Connecting…</div></div><button id="menuBtn" aria-label="Menu">☰</button><button id="waveBtn" aria-label="Wave to everyone" style="width:48px;border:2px solid var(--ink);border-left:0;background:var(--bg);font-size:22px;text-align:center">👋</button><button id="micBtn" style="display:none" aria-pressed="false">MIC
OFF</button></div>
<button id="act" aria-live="polite"></button>
<div id="hint" class="box">Touch the left side to walk · drag the right side to look</div>
<div id="panel" class="box" role="dialog" aria-modal="true" aria-labelledby="pt"><header><div class="h"><div class="k" id="pk"></div><h2 id="pt"></h2></div><button id="px" aria-label="Close">✕</button></header><div class="body" id="pb"></div></div>
<div id="menu" class="box" role="dialog" aria-label="Menu">
  <div class="lab">Your fox</div>
  <div class="opts" id="looks"><button data-l="suit">Suit fox</button><button data-l="male">Fox</button><button data-l="female">Vixen</button></div>
  <div class="lab">Gear</div>
  <div class="opts" id="extras"><button data-x="none">None</button><button data-x="glasses">Glasses</button><button data-x="cane">White cane</button><button data-x="chair">Wheelchair</button></div>
  <div class="lab">Reading</div>
  <div class="opts"><button id="autoRead">Read aloud when I open art</button><button id="big">Larger text</button><button id="readNotes">Read notes aloud when I pass</button></div>
  <div class="lab">Atmosphere</div>
  <div class="opts"><button id="ambBtn">Ambient sounds</button><button id="nightBtn">🌙 Night</button></div>
  <div class="lab">Visiting together</div>
  <div class="opts"><button id="rename">Change my name</button><button id="invite">Copy private room link</button><button id="tourBtn">Lead a tour</button><button id="hostBtn">Host this visit</button><button id="noteBtn">📝 Leave a note here</button></div>
  <div id="whoList" style="font-size:13px;line-height:1.5;margin-top:8px"></div>
  <div class="lab">Lost?</div>
  <div class="opts"><button id="home">Back to the entrance</button></div>
  <a href="index.html">← Back to the galaxy</a>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<script type="module">
import { createGallery } from './engine/gallery-game.js';
const $ = id => document.getElementById(id);
const pref = (() => { try { return JSON.parse(localStorage.getItem('8gates.gallery.v1') || '{}'); } catch (e) { return {}; } })();
const savePref = () => { try { localStorage.setItem('8gates.gallery.v1', JSON.stringify(pref)); } catch (e) {} };
let G; let near = null;
try {
  G = await createGallery({ container: $('stage'), onProgress: f => { $('lb').style.width = Math.round(f * 100) + '%'; }, onNear, onZone: z => { document.querySelector('#place .c').textContent = z; }, onSplash: () => { $('live').textContent = 'Splash! No swimming in the lake. Back to the entrance.'; $('hint').textContent = '💦 Splash! No swimming in the lake. Back to the entrance.'; $('hint').style.display = 'block'; setTimeout(() => $('hint').style.display = 'none', 3500); } });
} catch (e) { $('lt').textContent = 'The gallery could not open: ' + e.message; throw e; }
window.G = G;

if (pref.look || pref.extra) G.setLook(pref.look || 'male', pref.extra || 'none');
if (pref.night) G.setNight(true);
const touch = matchMedia('(pointer:coarse)').matches;
$('hint').textContent = touch ? 'Touch the left side to walk · drag the right side to look' : 'W A S D to walk · Shift to run · drag to look · E to view';
setTimeout(() => $('hint').style.display = 'none', 9000);

// ------------------------------------------------ near things
// severity kiosk for the Six Views wall: a small panel at the bottom; the wall changes live (your own view is untouched)
let simPanel = null;
function simCtl(w) {
  if (!simPanel) {
    simPanel = document.createElement('div'); simPanel.id = 'simctl'; simPanel.setAttribute('role', 'dialog'); simPanel.setAttribute('aria-label', 'Six views wall severity');
    simPanel.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:12;width:min(560px,calc(100vw - 24px));background:rgba(20,19,18,.94);color:#f3f2f2;border-top:4px solid #ec3013;padding:14px 16px;font:400 13px/1.4 var(--font)';
    simPanel.innerHTML = '<div style="font:800 10px/1 var(--font);letter-spacing:.16em;color:#ff9783;text-transform:uppercase">The six views wall</div><div style="font:800 18px/1.2 var(--font);margin:4px 0 8px">Change the severity</div>' +
      '<label style="display:flex;align-items:center;gap:10px;font:800 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase">Regular<input id="simSev" type="range" min="0" max="100" style="flex:1;accent-color:#ec3013;height:36px">Severe <span id="simP" style="min-width:3.2em;text-align:right">85%</span></label>' +
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button data-v="0" class="sv">Regular</button><button data-v="35" class="sv">Mild</button><button data-v="65" class="sv">Moderate</button><button data-v="85" class="sv">Severe</button><button id="simX" style="margin-left:auto;background:#ec3013;border-color:#ec3013">Done ✕</button></div>' +
      '<div style="font-size:11px;color:#a9a4a4;margin-top:8px">Watch the wall: all six views change together. This doesn\'t change your own view (for that, stand on a red circle).</div>';
    document.body.appendChild(simPanel);
    simPanel.querySelectorAll('button').forEach(b => b.style.cssText += ';min-height:40px;padding:0 12px;background:' + (b.id === 'simX' ? '#ec3013' : 'transparent') + ';color:#f3f2f2;border:2px solid ' + (b.id === 'simX' ? '#ec3013' : '#f3f2f2') + ';font:800 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;cursor:pointer');
    const set = v => { const W = G.simwall(); if (W) W.setSeverity(v / 100); $('simSev').value = v; $('simP').textContent = v + '%'; $('live').textContent = 'Wall severity ' + v + ' percent'; if (window.TOG) window.TOG.sevChanged(v); };
    $('simSev').oninput = e => set(+e.target.value);
    simPanel.querySelectorAll('.sv').forEach(b => b.onclick = () => set(+b.dataset.v));
    $('simX').onclick = () => { simPanel.style.display = 'none'; };
  }
  const v = Math.round(w.severity * 100); $('simSev').value = v; $('simP').textContent = v + '%';
  simPanel.style.display = 'block'; $('act').style.display = 'none'; $('simSev').focus();
}
function onNear(n) {
  near = n; const b = $('act');
  if (simPanel && (!n || n.kind !== 'simctl')) simPanel.style.display = 'none';
  if (!n) { b.style.display = 'none'; return; }
  const nc = n.kind === 'art' && window.NOTES ? window.NOTES.countFor(n.item) : 0;
  b.innerHTML = '<small>' + (n.kind === 'art' ? 'Artwork' + (nc ? ' · 💬 ' + nc + (nc === 1 ? ' note' : ' notes') : '') : n.kind === 'vision' ? 'Stand here · vision simulator' : n.kind === 'simctl' ? 'Kiosk · the six views wall' : n.kind === 'guestbook' ? 'Guest book' : n.kind === 'note' ? 'A note left here' : 'Learn') + (touch ? '' : ' · press E') + '</small>' + esc(n.label.replace(/^VIEW · /, ''));
  b.style.display = 'block'; if (n.kind !== 'note') $('live').textContent = n.label;   // (a note's full text was just announced)
}
$('act').addEventListener('click', () => near && open(near));
addEventListener('keydown', e => { if (e.code === 'KeyE' && near && $('panel').style.display !== 'flex') open(near); if (e.code === 'Escape') { if (G && G.vision && G.vision.overlay.learnOpen()) { G.vision.overlay.closeLearn(); return; } if (G && G.vision && G.vision.locked()) G.vision.exit(); close(); } });

// ------------------------------------------------ speech
const synth = window.speechSynthesis; let speaking = null;
function say(text, btn) {
  if (!synth) return;
  if (speaking === btn) { synth.cancel(); speaking = null; btn && btn.classList.remove('on'); return; }
  synth.cancel(); document.querySelectorAll('#pb .on').forEach(b => b.classList.remove('on'));
  const u = new SpeechSynthesisUtterance(text); u.rate = 0.98; u.onend = () => { if (speaking === btn) { speaking = null; btn && btn.classList.remove('on'); } };
  speaking = btn; btn && btn.classList.add('on'); synth.speak(u);
}
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const para = s => esc(s).split(/\s*\/\s*|\n+/).filter(Boolean).map(p => '<p style="margin:0 0 10px">' + p + '</p>').join('');

// ------------------------------------------------ panels
function open(n) {
  if (panelOnClose) { const f = panelOnClose; panelOnClose = null; f(); }
  if (n.kind === 'simctl') { simCtl(n.item); return; }
  if (n.kind === 'vision') { $('act').style.display = 'none'; G.vision.enter(n.item); return; }
  if (n.kind === 'guestbook') { if (window.NOTES) window.NOTES.openBook(); return; }
  if (n.kind === 'note') { if (window.NOTES) window.NOTES.openSpot(n.item); return; }
  const pb = $('pb'); pb.innerHTML = '';
  if (n.kind === 'art') {
    const a = n.item; $('pk').textContent = 'Artwork'; $('pt').textContent = a.title || 'Untitled';
    pb.innerHTML = '<div class="art"><div>' + (a.img ? '<img src="' + a.img + '" alt="' + esc(a.imgDesc || a.title) + '">' : '') + '</div><div>' + para(a.desc) +
      (a.imgDesc ? '<div class="lab">Image description</div>' + para(a.imgDesc) : '') +
      '<div class="row"><button id="rd">🔊 Read aloud</button>' + (a.imgDesc ? '<button id="rdd">🔊 Describe the image</button>' : '') + '</div></div></div>';
    const rd = $('rd'); rd.onclick = () => say((a.title ? a.title + '. ' : '') + a.desc.replace(/\//g, '. '), rd);
    if ($('rdd')) $('rdd').onclick = () => say(a.imgDesc, $('rdd'));
    if (pref.autoRead) setTimeout(() => rd.click(), 200);
    if (window.NOTES) pb.appendChild(window.NOTES.artSection(a));   // visitors' notes on this artwork
  } else {
    const e = n.item; const titles = { blindnessTools: 'Tools for the blind', blindnessAllyTips: 'Tips to be loved by the blind', blindnessEducation: 'Blindness is a spectrum', wallOfWhy: 'The Wall of Why' };
    $('pk').textContent = 'Learn'; $('pt').textContent = titles[e.kind] || e.prompt;
    let h = '';
    if (e.people && e.people.length) {
      h += '<div class="people">' + e.people.map(p => '<div class="p">' + (p.img ? '<img src="' + p.img + '" alt="' + esc(p.n) + '">' : '') + '<div><b>' + esc(p.n) + '</b>' + esc(p.t) + (p.s && !/^Share your story here/i.test(p.s) ? '<br>' + esc(p.s) : '') + '</div></div>').join('') + '</div>';
      if (e.form) h += '<div class="row"><a href="' + esc(e.form.replace('embedded=true', '')) + '" target="_blank" rel="noopener">' + esc(e.formBtn || 'Submit your why') + ' ↗</a></div>';
    }
    if (e.qa && e.qa.length) h += e.qa.map((q, i) => '<details><summary>' + esc(q.q) + '</summary><div class="a">' + para(q.a) + '<div class="row"><button data-say="' + i + '">🔊 Read aloud</button>' + (q.v ? '<button data-vid="' + i + '">▶ Watch the video</button>' : '') + '</div><div id="v' + i + '"></div></div></details>').join('');
    pb.innerHTML = h;
    pb.querySelectorAll('[data-say]').forEach(b => b.onclick = () => { const q = e.qa[+b.dataset.say]; say(q.q + '. ' + q.a, b); });
    pb.querySelectorAll('[data-vid]').forEach(b => b.onclick = () => playIn($('v' + b.dataset.vid), e.qa[+b.dataset.vid].v));
  }
  $('panel').style.display = 'flex'; $('px').focus();
}
async function playIn(host, url) {
  host.innerHTML = '<video controls playsinline></video>'; const v = host.querySelector('video');
  if (v.canPlayType('application/vnd.apple.mpegurl')) v.src = url;
  else { if (!window.Hls) await new Promise(r => { const s = document.createElement('script'); s.src = 'vendor/hls/hls.light.min.js'; s.onload = r; document.head.appendChild(s); }); const h = new Hls(); h.loadSource(url); h.attachMedia(v); }
  v.play().catch(() => {});
}
let panelOnClose = null;
function showPanel(k, t, node, onClose) { $('pk').textContent = k; $('pt').textContent = t; $('pb').replaceChildren(node); $('panel').style.display = 'flex'; $('px').focus(); panelOnClose = onClose || null; $('menu').style.display = 'none'; }
function close() { if (panelOnClose) { const f = panelOnClose; panelOnClose = null; f(); } $('panel').style.display = 'none'; if (synth) synth.cancel(); speaking = null; $('pb').querySelectorAll('video').forEach(v => v.pause()); $('menu').style.display = 'none'; }
$('px').onclick = close;

// ------------------------------------------------ menu
const syncMenu = () => {
  document.querySelectorAll('#looks button').forEach(b => b.classList.toggle('on', b.dataset.l === (pref.look || 'male')));
  document.querySelectorAll('#extras button').forEach(b => b.classList.toggle('on', b.dataset.x === (pref.extra || 'none')));
  $('ambBtn').classList.toggle('on', !pref.quietAmb); $('nightBtn').classList.toggle('on', !!pref.night); $('nightBtn').textContent = pref.night ? '☀️ Day' : '🌙 Night';
  $('autoRead').classList.toggle('on', !!pref.autoRead); $('readNotes').classList.toggle('on', !pref.quietNotes); $('big').classList.toggle('on', !!pref.big);
  document.documentElement.style.fontSize = pref.big ? '120%' : ''; $('pb').style.fontSize = pref.big ? '20px' : '';
};
$('menuBtn').onclick = () => { const m = $('menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; syncMenu(); };
document.querySelectorAll('#looks button').forEach(b => b.onclick = () => { pref.look = b.dataset.l; savePref(); G.setLook(pref.look, pref.extra); syncMenu(); });
document.querySelectorAll('#extras button').forEach(b => b.onclick = () => { pref.extra = b.dataset.x; savePref(); G.setLook(pref.look || 'male', pref.extra); syncMenu(); });
$('autoRead').onclick = () => { pref.autoRead = !pref.autoRead; savePref(); syncMenu(); };
$('ambBtn').onclick = () => { pref.quietAmb = !pref.quietAmb; savePref(); if (window.SOUND) window.SOUND.set(!pref.quietAmb); syncMenu(); };
$('nightBtn').onclick = () => { pref.night = !pref.night; savePref(); G.setNight(pref.night); $('live').textContent = pref.night ? 'Night falls over the city.' : 'Back to golden afternoon light.'; syncMenu(); };
$('readNotes').onclick = () => { pref.quietNotes = !pref.quietNotes; savePref(); syncMenu(); };
$('big').onclick = () => { pref.big = !pref.big; savePref(); syncMenu(); };
$('home').onclick = () => { G.respawn(); $('menu').style.display = 'none'; };
syncMenu();
let ENTER_RES; const ENTERED = new Promise(r => ENTER_RES = r);
// ------------------------------------------------ multiplayer: see each other's foxes
const NETREADY = import('./engine/gallery-net.js').then(async ({ connectGallery }) => {
  const names = new Map();
  const announce = t => { $('live').textContent = t; };
  const refresh = () => {
    const n = G.remote.count();
    $('who').textContent = net === null ? 'Connecting…' : status === 'offline' ? 'Just you (offline)' : n ? (n + 1) + ' foxes here' : 'Just you here · invite a friend';
    const sig = (pref.name || '') + '|' + G.remote.list().map(p => p.id + p.name + p.placed + (G.following() === p.id) + (window.VOICE && window.VOICE.isOn(p.id)) + (window.TOG && window.TOG.host() === p.id)).join(',');
    if (sig !== whoSig && window.TOG) { whoSig = sig; window.TOG.whoRows($('whoList'), pref.name); }
    $('tourBtn').textContent = window.TOG && window.TOG.leading() ? 'End my tour' : 'Lead a tour';
    if (window.TOG) { const h = window.TOG.host(); $('hostBtn').textContent = h === 'me' ? 'Stop hosting' : h ? '⭐ ' + (names.get(h) || 'Someone') + ' is hosting' : 'Host this visit'; $('hostBtn').disabled = !!h && h !== 'me'; }
  };
  let status = 'connecting', net = null, entered = false, whoSig = '';
  net = await connectGallery({
    onJoin: id => {},
    onLeave: id => { const nm = names.get(id); if (G.following() === id) G.unfollow(); G.remote.remove(id); names.delete(id); if (window.TOG) window.TOG.onLeave(id); if (nm) announce(nm + ' left the gallery'); if (window.VOICE) window.VOICE.onLeave(id); refresh(); },
    onState: (id, st, prof) => { if (prof && !prof.name) prof = null; if (!prof && !names.has(id) && !st) return; const isNew = !names.has(id) && prof; G.remote.upsert(id, st, prof); if (prof) { names.set(id, prof.name); if (isNew) { announce(prof.name + ' joined the gallery'); if (entered) { net && net.hello(me()); if (window.TOG) window.TOG.onNewPeer(id); if (window.VOICE) window.VOICE.onNewPeer(id); } } } refresh(); },
    onEvent: (id, d) => { if (window.TOG) window.TOG.onEvent(id, d); if (window.VOICE) window.VOICE.onEvent(id, d); if (window.NOTES) window.NOTES.onEvent(id, d); },
    onStream: (id, stream) => { if (window.VOICE) window.VOICE.onStream(id, stream); },
    onEmote: (id, e) => { if (e === 'wave') { G.remote.wave(id); const nm = names.get(id); if (nm) announce(nm + ' waves'); } },
    onStatus: s => { status = s; refresh(); },
  });
  const { setupTogether } = await import('./engine/gallery-together.js');
  window.TOG = setupTogether({ G, net, esc, announce, nameOf: id => names.get(id) || 'A visitor',
    onSev: (v, who) => { const W = G.simwall(); if (W) W.setSeverity(v / 100); const sv = $('simSev'); if (sv) { sv.value = v; $('simP').textContent = v + '%'; } announce(who + ' set the Six Views wall to ' + v + ' percent'); } });
  const { setupVoice } = await import('./engine/gallery-voice.js');
  window.VOICE = setupVoice({ G, net, button: $('micBtn'), announce, nameOf: id => names.get(id) || 'A visitor' });
  import('./engine/gallery-notes.js').then(async ({ setupNotes }) => {
    window.NOTES = await setupNotes({ G, net, cfg: G.notesConfig, myName: () => pref.name, announce, esc, readAloud: () => !pref.quietNotes, showPanel });
  }).catch(e => console.warn('notes unavailable', e));
  $('noteBtn').onclick = () => { if (window.NOTES) window.NOTES.openCompose(); };
  $('hostBtn').onclick = () => { window.TOG.claimHost(window.TOG.host() !== 'me'); $('menu').style.display = 'none'; refresh(); };
  $('tourBtn').onclick = () => { window.TOG.leadTour(!window.TOG.leading()); $('menu').style.display = 'none'; refresh(); };
  const me = () => ({ name: pref.name, look: pref.look || 'male', extra: pref.extra || 'none', ...G.style() });
  refresh();
  await ENTERED; entered = true;
  // the first visitor in the room is Ben's fox; everyone after gets their own fur colours and a different artwork on their shirt
  if (G.remote.count() > 0) G.setStyle(G.randomStyle());
  net.hello(me()); refresh();
  // send where we are: 10 times a second while moving, once a second while standing still
  let lastSent = '', lastT = 0;
  setInterval(() => { const st = G.localState(), k = st.join(','); const now = performance.now(); if (k !== lastSent || now - lastT > 1000) { net.send(st); lastSent = k; lastT = now; } }, 100);
  const sendProfile = () => net.hello(me());
  document.querySelectorAll('#looks button, #extras button').forEach(b => b.addEventListener('click', sendProfile));
  $('rename').onclick = () => { const n = prompt('Your name', pref.name); if (n && n.trim()) { pref.name = n.trim().slice(0, 20); savePref(); sendProfile(); refresh(); } };
  $('invite').onclick = async () => { const room = new URLSearchParams(location.search).get('room') || ('bcp-' + Math.random().toString(36).slice(2, 7)); const url = location.origin + location.pathname + '?room=' + room; try { await navigator.clipboard.writeText(url); $('invite').textContent = 'Link copied ✓'; } catch (e) { prompt('Share this link', url); } if (!new URLSearchParams(location.search).get('room')) setTimeout(() => location.href = url, 600); };
  $('waveBtn').onclick = () => { G.wave(); net.emote('wave'); };
  window.NET = net;
});
// one tap to enter: this tap is what lets the room videos (and read-aloud) play with sound from then on
$('lt').textContent = 'Videos in each room play with sound when you walk in. Other visitors appear as foxes too.';
$('nameRow').style.display = 'block'; $('nameIn').value = pref.name || '';
// the avatar: the suited fox with a white cane or in a wheelchair (remembered; more looks in ☰)
{ const pickAv = x => { document.querySelectorAll('#avRow .av').forEach(b => b.setAttribute('aria-checked', b.dataset.x === x)); pref.look = 'suit'; pref.extra = x; G.setLook('suit', x); };
  $('avRow').style.display = 'block'; document.querySelectorAll('#avRow .av').forEach(b => b.onclick = () => pickAv(b.dataset.x));
  pickAv(pref.extra === 'chair' ? 'chair' : 'cane'); }
$('enter').style.display = 'block'; $('enter').focus();
await new Promise(res => $('enter').addEventListener('click', () => {
  pref.name = ($('nameIn').value || '').trim().slice(0, 20) || ('Fox ' + Math.floor(100 + Math.random() * 900)); savePref();
  G.unlockAudio();
  try { if (!window.SOUND) { import('./engine/gallery-sound.js').then(({ setupSound }) => { window.SOUND = setupSound({ getState: () => G.localState(), inside: (x, y, z) => x < -44, filmPlaying: () => !!G.film.url(), chair: () => (pref.extra || '') === 'chair' }); if (window.SOUND) { window.SOUND.resume(); window.SOUND.set(!pref.quietAmb); } }); } } catch (e) {}
  try { if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
  res();
}, { once: true }));
$('load').style.display = 'none';
ENTER_RES();

window.READY = true;
</script>
</body>
</html>
