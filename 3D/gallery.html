<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Blind Canvas Gallery · 8 GATES 3D</title>
<link rel="stylesheet" href="vendor/fonts/archivo.css">
<style>
  :root { --bg:#f3f2f2; --ink:#201e1d; --accent:#ec3013; --teal:#22b8b0; --font:"Archivo",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0b0a12; color:var(--ink); font-family:var(--font); overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none; }
  #stage { position:fixed; inset:0; }
  .box { background:var(--bg); border:2px solid var(--ink); }
  button { font-family:var(--font); border-radius:0; cursor:pointer; text-align:left; color:var(--ink); }
  #place { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); display:flex; z-index:10; }
  #place .t { padding:8px 12px; min-width:180px; }
  #place .w { font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  #place .c { font:800 22px var(--font); line-height:1.05; }
  #menuBtn { width:48px; border:2px solid var(--ink); border-left:0; background:var(--bg); font-size:20px; text-align:center; }
  #act { position:fixed; right:calc(12px + env(safe-area-inset-right)); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:10; display:none; max-width:min(320px,52vw); min-height:52px; padding:10px 14px; background:var(--accent); color:var(--bg); border:2px solid var(--ink); font:800 13px/1.25 var(--font); letter-spacing:.06em; text-transform:uppercase; }
  #act small { display:block; font-size:10px; letter-spacing:.14em; opacity:.85; }
  #jump { position:fixed; right:calc(12px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom)); z-index:10; width:60px; height:56px; text-align:center; font:800 12px var(--font); letter-spacing:.1em; }
  #hint { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); z-index:9; padding:6px 10px; font-size:12px; font-weight:600; max-width:calc(100vw - 180px); text-align:center; }
  #panel { position:fixed; z-index:20; left:50%; top:50%; transform:translate(-50%,-50%); width:min(720px,calc(100vw - 24px)); max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display:none; flex-direction:column; user-select:text; -webkit-user-select:text; touch-action:pan-y; }
  #panel header { display:flex; align-items:stretch; border-bottom:2px solid var(--ink); }
  #panel header .h { flex:1; padding:10px 14px; }
  #panel header .k { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  #panel header h2 { margin:2px 0 0; font:800 clamp(20px,5vw,30px)/1.05 var(--font); letter-spacing:-0.01em; }
  #panel header button { width:56px; border:0; border-left:2px solid var(--ink); background:var(--bg); font-size:22px; text-align:center; }
  #panel .body { overflow:auto; padding:14px; font-size:16px; line-height:1.5; -webkit-overflow-scrolling:touch; }
  #panel .art { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:14px; }
  @media (max-width:640px) { #panel .art { grid-template-columns:1fr; } }
  #panel .art img { width:100%; max-height:62dvh; object-fit:contain; border:2px solid var(--ink); background:#ddd; display:block; }
  #panel .lab { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:12px 0 4px; }
  #panel .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  #panel .row button, #panel .row a { min-height:44px; padding:10px 14px; border:2px solid var(--ink); background:#fff; font:800 12px var(--font); letter-spacing:.08em; text-transform:uppercase; text-decoration:none; color:var(--ink); display:inline-flex; align-items:center; }
  #panel .row .on { background:var(--ink); color:var(--bg); }
  #panel details { border-top:2px solid var(--ink); }
  #panel details:last-child { border-bottom:2px solid var(--ink); }
  #panel summary { min-height:48px; padding:12px 4px; font-weight:800; cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:8px; }
  #panel summary::after { content:'+'; font-size:20px; line-height:1; } #panel details[open] summary::after { content:'–'; }
  #panel details .a { padding:0 4px 12px; }
  #panel video { width:100%; border:2px solid var(--ink); background:#000; margin-top:8px; }
  .people { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .people .p { border:2px solid var(--ink); background:#fff; }
  .people img { width:100%; aspect-ratio:1; object-fit:cover; display:block; border-bottom:2px solid var(--ink); }
  .people .p div { padding:8px; font-size:13px; } .people .p b { display:block; font-size:14px; }
  #menu { position:fixed; z-index:21; left:12px; top:calc(70px + env(safe-area-inset-top)); width:min(340px,calc(100vw - 24px)); display:none; padding:12px; max-height:calc(100dvh - 90px); overflow:auto; }
  #menu .lab { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:10px 0 6px; color:var(--accent); }
  #menu .opts { display:flex; flex-wrap:wrap; gap:6px; }
  #menu button { min-height:44px; padding:8px 12px; border:2px solid var(--ink); background:#fff; font:800 12px var(--font); letter-spacing:.06em; text-transform:uppercase; }
  #menu button.on { background:var(--ink); color:var(--bg); }
  #menu a { display:block; margin-top:12px; padding:12px; border:2px solid var(--ink); background:var(--accent); color:var(--bg); font-weight:800; text-decoration:none; letter-spacing:.06em; text-transform:uppercase; font-size:13px; }
  #load { position:fixed; inset:0; z-index:30; background:#0b0a12; color:var(--bg); display:flex; flex-direction:column; justify-content:center; padding:24px; }
  #load .k { font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#ff9783; }
  #load h1 { font:800 clamp(40px,10vw,88px)/0.9 var(--font); letter-spacing:-0.04em; margin:8px 0 18px; }
  #load .bar { height:12px; border:2px solid var(--bg); max-width:420px; } #load .bar i { display:block; height:100%; width:0; background:var(--accent); }
  #load p { max-width:520px; color:#cfcaca; line-height:1.5; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="load"><div class="k">8 GATES · 3D · Ben Fox</div><h1>Blind Canvas<br>Project</h1><div class="bar"><i id="lb"></i></div><p id="lt">Opening the gallery…</p></div>
<div id="place"><div class="t box"><div class="w">Blind Canvas Project</div><div class="c">The Gallery</div></div><button id="menuBtn" aria-label="Menu">☰</button></div>
<button id="act" aria-live="polite"></button>
<button id="jump" class="box" aria-label="Jump">JUMP</button>
<div id="hint" class="box">Drag the left side to walk · drag the right side to look</div>
<div id="panel" class="box" role="dialog" aria-modal="true" aria-labelledby="pt"><header><div class="h"><div class="k" id="pk"></div><h2 id="pt"></h2></div><button id="px" aria-label="Close">✕</button></header><div class="body" id="pb"></div></div>
<div id="menu" class="box" role="dialog" aria-label="Menu">
  <div class="lab">Your fox</div>
  <div class="opts" id="looks"><button data-l="male">Fox</button><button data-l="female">Vixen</button></div>
  <div class="lab">Gear</div>
  <div class="opts" id="extras"><button data-x="none">None</button><button data-x="glasses">Glasses</button><button data-x="cane">White cane</button><button data-x="chair">Wheelchair</button></div>
  <div class="lab">Reading</div>
  <div class="opts"><button id="autoRead">Read aloud when I open art</button><button id="big">Larger text</button></div>
  <div class="lab">Lost?</div>
  <div class="opts"><button id="home">Back to the entrance</button></div>
  <a href="index.html">← Back to the galaxy</a>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<script type="module">
import { createGallery } from './engine/gallery-game.js';
const $ = id => document.getElementById(id);
const pref = (() => { try { return JSON.parse(localStorage.getItem('8gates.gallery.v1') || '{}'); } catch (e) { return {}; } })();
const savePref = () => { try { localStorage.setItem('8gates.gallery.v1', JSON.stringify(pref)); } catch (e) {} };
let G;
try {
  G = await createGallery({ container: $('stage'), onProgress: f => { $('lb').style.width = Math.round(f * 100) + '%'; }, onNear, onZone: z => { document.querySelector('#place .c').textContent = z; } });
} catch (e) { $('lt').textContent = 'The gallery could not open: ' + e.message; throw e; }
window.G = G;
$('load').style.display = 'none';
if (pref.look || pref.extra) G.setLook(pref.look || 'male', pref.extra || 'none');
const touch = matchMedia('(pointer:coarse)').matches;
$('hint').textContent = touch ? 'Drag the left side to walk · drag the right side to look' : 'W A S D to walk · Shift to run · drag to look · E to view';
setTimeout(() => $('hint').style.display = 'none', 9000);
if (!touch) $('jump').style.display = 'none';
$('jump').addEventListener('pointerdown', e => { e.preventDefault(); G.jump(); });

// ------------------------------------------------ near things
let near = null;
function onNear(n) {
  near = n; const b = $('act');
  if (!n) { b.style.display = 'none'; return; }
  b.innerHTML = '<small>' + (n.kind === 'art' ? 'Artwork' : 'Learn') + (touch ? '' : ' · press E') + '</small>' + esc(n.label.replace(/^VIEW · /, ''));
  b.style.display = 'block'; $('live').textContent = n.label;
}
$('act').addEventListener('click', () => near && open(near));
addEventListener('keydown', e => { if (e.code === 'KeyE' && near && $('panel').style.display !== 'flex') open(near); if (e.code === 'Escape') close(); });

// ------------------------------------------------ speech
const synth = window.speechSynthesis; let speaking = null;
function say(text, btn) {
  if (!synth) return;
  if (speaking === btn) { synth.cancel(); speaking = null; btn && btn.classList.remove('on'); return; }
  synth.cancel(); document.querySelectorAll('#pb .on').forEach(b => b.classList.remove('on'));
  const u = new SpeechSynthesisUtterance(text); u.rate = 0.98; u.onend = () => { if (speaking === btn) { speaking = null; btn && btn.classList.remove('on'); } };
  speaking = btn; btn && btn.classList.add('on'); synth.speak(u);
}
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const para = s => esc(s).split(/\s*\/\s*|\n+/).filter(Boolean).map(p => '<p style="margin:0 0 10px">' + p + '</p>').join('');

// ------------------------------------------------ panels
function open(n) {
  const pb = $('pb'); pb.innerHTML = '';
  if (n.kind === 'art') {
    const a = n.item; $('pk').textContent = 'Artwork'; $('pt').textContent = a.title || 'Untitled';
    pb.innerHTML = '<div class="art"><div>' + (a.img ? '<img src="' + a.img + '" alt="' + esc(a.imgDesc || a.title) + '">' : '') + '</div><div>' + para(a.desc) +
      (a.imgDesc ? '<div class="lab">Image description</div>' + para(a.imgDesc) : '') +
      '<div class="row"><button id="rd">🔊 Read aloud</button>' + (a.imgDesc ? '<button id="rdd">🔊 Describe the image</button>' : '') + '</div></div></div>';
    const rd = $('rd'); rd.onclick = () => say((a.title ? a.title + '. ' : '') + a.desc.replace(/\//g, '. '), rd);
    if ($('rdd')) $('rdd').onclick = () => say(a.imgDesc, $('rdd'));
    if (pref.autoRead) setTimeout(() => rd.click(), 200);
  } else {
    const e = n.item; const titles = { blindnessTools: 'Tools for the blind', blindnessAllyTips: 'Tips to be loved by the blind', blindnessEducation: 'Blindness is a spectrum', wallOfWhy: 'The Wall of Why' };
    $('pk').textContent = 'Learn'; $('pt').textContent = titles[e.kind] || e.prompt;
    let h = '';
    if (e.people && e.people.length) {
      h += '<div class="people">' + e.people.map(p => '<div class="p">' + (p.img ? '<img src="' + p.img + '" alt="' + esc(p.n) + '">' : '') + '<div><b>' + esc(p.n) + '</b>' + esc(p.t) + (p.s && !/^Share your story here/i.test(p.s) ? '<br>' + esc(p.s) : '') + '</div></div>').join('') + '</div>';
      if (e.form) h += '<div class="row"><a href="' + esc(e.form.replace('embedded=true', '')) + '" target="_blank" rel="noopener">' + esc(e.formBtn || 'Submit your why') + ' ↗</a></div>';
    }
    if (e.qa && e.qa.length) h += e.qa.map((q, i) => '<details><summary>' + esc(q.q) + '</summary><div class="a">' + para(q.a) + '<div class="row"><button data-say="' + i + '">🔊 Read aloud</button>' + (q.v ? '<button data-vid="' + i + '">▶ Watch the video</button>' : '') + '</div><div id="v' + i + '"></div></div></details>').join('');
    pb.innerHTML = h;
    pb.querySelectorAll('[data-say]').forEach(b => b.onclick = () => { const q = e.qa[+b.dataset.say]; say(q.q + '. ' + q.a, b); });
    pb.querySelectorAll('[data-vid]').forEach(b => b.onclick = () => playIn($('v' + b.dataset.vid), e.qa[+b.dataset.vid].v));
  }
  $('panel').style.display = 'flex'; $('px').focus();
}
async function playIn(host, url) {
  host.innerHTML = '<video controls playsinline></video>'; const v = host.querySelector('video');
  if (v.canPlayType('application/vnd.apple.mpegurl')) v.src = url;
  else { if (!window.Hls) await new Promise(r => { const s = document.createElement('script'); s.src = 'vendor/hls/hls.light.min.js'; s.onload = r; document.head.appendChild(s); }); const h = new Hls(); h.loadSource(url); h.attachMedia(v); }
  v.play().catch(() => {});
}
function close() { $('panel').style.display = 'none'; if (synth) synth.cancel(); speaking = null; $('pb').querySelectorAll('video').forEach(v => v.pause()); $('menu').style.display = 'none'; }
$('px').onclick = close;

// ------------------------------------------------ menu
const syncMenu = () => {
  document.querySelectorAll('#looks button').forEach(b => b.classList.toggle('on', b.dataset.l === (pref.look || 'male')));
  document.querySelectorAll('#extras button').forEach(b => b.classList.toggle('on', b.dataset.x === (pref.extra || 'none')));
  $('autoRead').classList.toggle('on', !!pref.autoRead); $('big').classList.toggle('on', !!pref.big);
  document.documentElement.style.fontSize = pref.big ? '120%' : ''; $('pb').style.fontSize = pref.big ? '20px' : '';
};
$('menuBtn').onclick = () => { const m = $('menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; syncMenu(); };
document.querySelectorAll('#looks button').forEach(b => b.onclick = () => { pref.look = b.dataset.l; savePref(); G.setLook(pref.look, pref.extra); syncMenu(); });
document.querySelectorAll('#extras button').forEach(b => b.onclick = () => { pref.extra = b.dataset.x; savePref(); G.setLook(pref.look || 'male', pref.extra); syncMenu(); });
$('autoRead').onclick = () => { pref.autoRead = !pref.autoRead; savePref(); syncMenu(); };
$('big').onclick = () => { pref.big = !pref.big; savePref(); syncMenu(); };
$('home').onclick = () => { G.respawn(); $('menu').style.display = 'none'; };
syncMenu();
window.READY = true;
</script>
</body>
</html>
