function openMap(forcePark) {

// SHOWTIME: a minute before each show, everyone who isn't already in the cinema gets a nudge (at most every half hour)
(() => {
  const el = document.createElement('div'); el.id = 'showToast'; el.setAttribute('role', 'status'); document.body.appendChild(el);
  let lastShown = 0, hideT = 0, warnedIn = 0;
  const hide = () => { el.style.display = 'none'; clearTimeout(hideT); };
  setInterval(() => {
    if (!window.READY || !G || !G.campus) return; const S = G.campus.showtime(), inCinema = G.campus.zone() === 'cinema';
    if (!S.on && S.nextIn <= 60 && S.nextIn > 50) {
      if (inCinema) { if (warnedIn !== S.next) { warnedIn = S.next; $('live').textContent = 'The show starts in one minute.'; } return; }
      if (!(window.TOG && window.TOG.host() === 'me')) { if (warnedIn !== S.next) { warnedIn = S.next; $('live').textContent = 'Showtime in one minute at BLIND CAN Cinema.'; } return; }   // (22 Oct) the pop-up is the host's; guests just hear it
      if (Date.now() - lastShown < 25 * 60000) return; lastShown = Date.now();
      const time = new Date(S.next).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      el.innerHTML = '<b>🎬 SHOWTIME IN 1 MINUTE · ' + time + '</b>' + esc(G.campus.filmTitle()) + ' at BLIND CAN Cinema<div class="row"><button id="stGo">Take me there</button><button class="x" id="stX">Not now</button></div>';
      el.style.display = 'block'; $('live').textContent = 'Showtime in one minute at BLIND CAN Cinema: ' + G.campus.filmTitle() + '.';
      $('stGo').onclick = () => { hide(); if (G.campus.zone()) walkWith(G.campus.dests.find(d => d.to === 'cinema')); else G.campus.go('cinema'); };
      $('stX').onclick = hide; clearTimeout(hideT); hideT = setTimeout(hide, 30000);
    }
  }, 1000);
})();
function walkWith(D) {
  const name = D.label.charAt(0) + D.label.slice(1).toLowerCase();
  $('hint').textContent = 'Walking to ' + name + ' · move the joystick to stop'; $('hint').style.display = 'block'; $('live').textContent = 'Walking you to ' + name + '.';
  G.campus.walk(D.to, why => { $('hint').style.display = 'none'; $('live').textContent = why === 'arrived' ? 'You have arrived: ' + name + '.' : 'Stopped walking.'; });
}

document.querySelectorAll('#menu .fold').forEach(b => b.onclick = () => { const body = document.getElementById(b.getAttribute('aria-controls')), open = body.hidden; body.hidden = !open; b.setAttribute('aria-expanded', String(open)); });   // (29 Oct, Ben) SOUNDS + MULTIPLAYER OPTIONS open when pressed
$('menuBack').onclick = e => { e.preventDefault(); $('menu').style.display = 'none'; $('menuBtn').focus(); };   // (29 Oct, Ben: it went to the old galaxy game) just closes the menu: you stay where you were standing

const NETREADY = import('./engine/gallery-net.js').then(async ({ connectGallery }) => {

    const sig = (pref.name || '') + '|' + G.remote.list().map(p => p.id + p.name + p.placed + (G.following() === p.id) + (window.VOICE && window.VOICE.isOn(p.id)) + (window.TOG && window.TOG.host() === p.id)).join(',');

  };

  // takes the oldest clock in the room; when the gallery is empty the next fox starts a fresh one
  window.GSES = { e: Date.now(),
    slot(ms) { return (Math.floor(this.e / 1000) % 100000) * 100 + Math.floor((Date.now() - this.e) / ms); },
    left(ms) { return ms - ((Date.now() - this.e) % ms); },
    onEvent(id, d) { if (!d || d.k !== 'ses') return; if (d.a === 'ask') net.event({ k: 'ses', e: this.e }, id); else if (d.e > 0 && d.e < this.e) this.e = d.e; } };
  net = await connectGallery({
    onJoin: id => { if (net) net.event({ k: 'ses', e: window.GSES.e }, id); if (window.BINGO) window.BINGO.onJoin(id); },
    onLeave: id => { if (window.BINGO) window.BINGO.onLeave(id); if (window.CHESS) window.CHESS.onLeave(id); const nm = names.get(id); if (G.following() === id) G.unfollow(); G.remote.remove(id); names.delete(id); if (window.TOG) window.TOG.onLeave(id); if (window.LIVE) window.LIVE.onLeave(id); if (window.CAMHEAD) window.CAMHEAD.onLeave(id); if (nm) announce(nm + ' left the gallery'); if (window.VOICE) window.VOICE.onLeave(id); refresh(); },
    onState: (id, st, prof) => { if (prof && !prof.name) prof = null; if (!prof && !names.has(id) && !st) return; const isNew = !names.has(id) && prof; G.remote.upsert(id, st, prof); if (prof) { names.set(id, prof.name); if (isNew) { announce(prof.name + ' joined the gallery'); if (entered) { net && net.hello(me()); if (window.TOG) window.TOG.onNewPeer(id); if (window.VOICE) window.VOICE.onNewPeer(id); if (window.LIVE) window.LIVE.onNewPeer(id); if (window.CAMHEAD) window.CAMHEAD.onNewPeer(id); } } } refresh(); },
    onEvent: (id, d) => { window.GSES.onEvent(id, d); if (window.BINGO) window.BINGO.onEvent(id, d); if (window.HUNT) window.HUNT.onEvent(id, d); if (window.PAINT) window.PAINT.onEvent(id, d); if (window.PUZZLE) window.PUZZLE.onEvent(id, d); if (window.CHESS) window.CHESS.onEvent(id, d); if (window.PIANO) window.PIANO.onEvent(id, d); if (window.BAND) window.BAND.onEvent(id, d); if (window.CAMHEAD) window.CAMHEAD.onEvent(id, d); if (window.LIVE) window.LIVE.onEvent(id, d); if (window.FACE) window.FACE.onEvent(id, d); if (window.TOG) window.TOG.onEvent(id, d); if (window.VOICE) window.VOICE.onEvent(id, d); if (window.NOTES) window.NOTES.onEvent(id, d); },
    onStream: (id, stream, meta) => { if (window.CAMHEAD) window.CAMHEAD.onStream(id, stream, meta); if (window.LIVE) window.LIVE.onStream(id, stream, meta); if (window.VOICE) window.VOICE.onStream(id, stream); },
    onEmote: (id, e) => { if (e === 'wave') { G.remote.wave(id); const nm = names.get(id); if (nm) announce(nm + ' waves'); } },
    onStatus: s => { status = s; refresh(); },
  });
  const { setupTogether } = await import('./engine/gallery-together.js');
  window.TOG = setupTogether({ G, net, esc, announce, nameOf: id => names.get(id) || 'A visitor',
    onSev: (v, who) => { const W = G.simwall(); if (W) W.setSeverity(v / 100); const sv = $('simSev'); if (sv) { sv.value = v; $('simP').textContent = v + '%'; } announce(who + ' set the Six Views wall to ' + v + ' percent'); } });
  const { setupVoice } = await import('./engine/gallery-voice.js');
  if (window.PUZZLE) window.PUZZLE.setNet(net); else setTimeout(() => window.PUZZLE && window.PUZZLE.setNet(net), 3000);
  import('./engine/gallery-bingo.js').then(({ setupBingo }) => { window.BINGO = setupBingo({ G, net, announce, nameOf: id => names.get(id) || 'A friend' }); for (const id of names.keys()) window.BINGO.onJoin(id); }).catch(e => console.warn('bingo', e));
  import('./engine/gallery-hunt.js').then(({ setupHunt }) => { window.HUNT = setupHunt({ G, net, announce, nameOf: id => names.get(id) || 'A friend' }); }).catch(e => console.warn('hunt', e));
  import('./engine/gallery-paint.js').then(({ setupPaint }) => { window.PAINT = setupPaint({ G, net, announce, nameOf: id => names.get(id) || 'A visitor' }); }).catch(e => console.warn('paint', e));
  window.VOICE = setupVoice({ G, net, button: $('micBtn'), announce, nameOf: id => names.get(id) || 'A visitor' });
  if (G.campus) import('./engine/gallery-piano.js').then(({ setupPiano }) => { window.PIANO = setupPiano({ G, net, announce, nameOf: id => names.get(id) || 'Someone' }); });
  if (G.chess) import('./engine/gallery-chess.js').then(({ setupChess }) => { window.CHESS = setupChess({ G, net, announce, nameOf: id => names.get(id) || 'A visitor' }); }).catch(e => console.warn('chess unavailable', e));   // (27 Oct) fox chess
  if (G.campus) import('./engine/gallery-band.js').then(({ setupBand }) => { window.BAND = setupBand({ G, net, announce, nameOf: id => names.get(id) || 'Someone' }); });
  import('./engine/gallery-notes.js').then(async ({ setupNotes }) => {
    window.NOTES = await setupNotes({ G, net, cfg: G.notesConfig, myName: () => pref.name, announce, esc, readAloud: () => !pref.quietNotes, showPanel });
  }).catch(e => console.warn('notes unavailable', e));
  $('noteBtn').onclick = () => { if (!window.NOTES) return; if (G.comments && G.comments.here()) window.NOTES.openCompose(); else openCommentSpots(); };   // comments only go on the comment spots (yellow pads)
  const [{ setupLive }, { setupFace }] = await Promise.all([import('./engine/gallery-live.js'), import('./engine/gallery-face.js')]);
  window.LIVE = setupLive({ G, net, announce, nameOf: id => names.get(id) || 'A visitor', invite: (...a) => window.TOG && window.TOG.invite(...a) });
  window.FACE = setupFace({ G, net, announce, onState: st => { const b = $('faceBtn'); b.classList.toggle('on', st === 'on'); b.setAttribute('aria-pressed', st === 'on'); b.textContent = st === 'loading' ? '🦊 Starting camera…' : st === 'on' ? '🦊 Fox copies my face · ON' : '🦊 Fox copies my face (camera)'; } });
  if (!window.FACE.supported) $('faceBtn').style.display = 'none';
  $('faceBtn').onclick = () => { const was = window.FACE.on(); if (!was && window.CAMHEAD) window.CAMHEAD.stop(true); window.FACE.toggle(); if (was) $('camPop').style.display = 'none'; else camStarting('Fox copies my face'); };
  // wear your camera: a screen for a head, or your face as a mask (both are seen by everyone here)
  const { setupCamHead } = await import('./engine/gallery-camhead.js');
  const camLabel = { screen: ['📺 Screen head', 'tvHeadBtn'], mask: ['🎭 Face mask', 'maskBtn'] };
  window.CAMHEAD = setupCamHead({ G, net, announce, nameOf: id => names.get(id) || 'A visitor', onState: (st, m) => {
    for (const [k, [txt, id]] of Object.entries(camLabel)) { const b = $(id), on = st === 'on' && window.CAMHEAD && window.CAMHEAD.mode() === k, ld = st === 'loading' && m === k; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.textContent = ld ? txt + ' · starting…' : on ? txt + ' · ON' : txt; }
  } });
  if (!window.CAMHEAD.supported) { $('tvHeadBtn').style.display = $('maskBtn').style.display = 'none'; }
  for (const k of ['screen', 'mask']) $(camLabel[k][1]).onclick = () => { const was = window.CAMHEAD.mode() === k; if (window.FACE.on()) window.FACE.stop(); window.CAMHEAD.start(k); if (was) $('camPop').style.display = 'none'; else camStarting(camLabel[k][0].replace(/^\S+\s/, '')); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && window.CAMHEAD.mode()) window.CAMHEAD.stop(); });   // never send your camera from a background tab
  $('hostBtn').onclick = () => { window.TOG.claimHost(window.TOG.host() !== 'me'); $('menu').style.display = 'none'; refresh(); syncHost(); };
  $('tourBtn').onclick = () => { window.TOG.leadTour(!window.TOG.leading()); $('menu').style.display = 'none'; refresh(); };
  const me = () => ({ name: pref.name, look: pref.look || 'male', extra: pref.extra || 'none', ...G.style() });
  refresh();
  await ENTERED; entered = true;
  // the first visitor in the room is Ben's fox; everyone after gets their own fur colours and a different artwork on their shirt
  // (28 Oct, Ben) every visit: a new shirt artwork that no other fox in the gallery is wearing (checked again once everyone's arrived)
  pref.style = G.randomStyle(G.remote.arts()); G.setStyle(pref.style); savePref();
  net.hello(me()); refresh(); net.event({ k: 'ses', a: 'ask' });
  setTimeout(() => { if (G.remote.arts().includes(G.style().art)) { pref.style = G.randomStyle(G.remote.arts()); G.setStyle(pref.style); savePref(); net.hello(me()); } }, 3500);
  // send where we are: 10 times a second while moving, once a second while standing still
  let lastSent = '', lastT = 0;
  setInterval(() => { const st = G.localState(), k = st.join(','); const now = performance.now(); if (k !== lastSent || now - lastT > 1000) { net.send(st); lastSent = k; lastT = now; } }, 100);
  const sendProfile = () => net.hello(me());
  document.querySelectorAll('#looks button, #extras button, #who button').forEach(b => b.addEventListener('click', sendProfile));
  // the Fox Studio on the plaza: dress your fox (look, shirt art, gear, fur, camera)
  import('./engine/gallery-studio.js').then(({ setupStudio }) => {
    // (27 Oct, Ben) CHOOSE YOUR SHIRT: moved to the middle of the entry hall's north wall, turned to the wall's angle; the
    // step-and-repeat (left) and the tall BCP banner (right, standing on the floor) beside it get ink backings
    // (27 Oct, Ben, s13) the whole group slides west along the north wall's foot, into the empty stretch, so you see it ahead of you
    // coming down the ramp: step-and-repeat, then the tall banner, then CHOOSE YOUR SHIRT (board standing on the floor, mannequins out front)
    window.STUDIO = setupStudio({ G, announce, at: { x: -57.831, z: 9.625 }, face: 2.9800, lay: { bz: -3.05, by: 0.25, BH: 3.6, mz: -1.75 },
      backings: [{"x":-47.733,"z":14.482,"y":-0.808,"w":8.35,"h":5.1,"d":0.12,"ry":-0.1616},{"x":-54.033,"z":13.455,"y":-0.19,"w":3.66,"h":6.42,"d":0.06,"ry":-0.1616}],
      getPrefs: () => ({ look: pref.look || 'male', extra: pref.extra || 'none', style: G.style() }),
      apply: ({ look, extra, style }) => {
        if (look) pref.look = look; if (extra) pref.extra = extra;
        if (style) { pref.style = { pal: style.pal | 0, art: style.art }; G.setStyle(pref.style); }
        if (look || extra) G.setLook(pref.look || 'male', pref.extra || 'none');
        savePref(); sendProfile(); syncMenu();
      },
      cams: { state: () => window.FACE && window.FACE.on() ? 'fox' : window.CAMHEAD && window.CAMHEAD.mode(),
        pick: k => { if (k === 'fox') { if (window.CAMHEAD) window.CAMHEAD.stop(true); window.FACE.toggle(); } else { if (window.FACE.on()) window.FACE.stop(); window.CAMHEAD.start(k); } } } });
  }).catch(e => console.warn('studio unavailable', e));
  $('rename').onclick = () => { const n = prompt('Your name', pref.name); if (n && n.trim()) { pref.name = n.trim().slice(0, 20); savePref(); sendProfile(); refresh(); } };
  $('invite').onclick = async () => { const room = new URLSearchParams(location.search).get('room') || ('bcp-' + Math.random().toString(36).slice(2, 7)); const url = location.origin + location.pathname + '?room=' + room; try { await navigator.clipboard.writeText(url); $('invite').textContent = 'Link copied ✓'; } catch (e) { prompt('Share this link', url); } if (!new URLSearchParams(location.search).get('room')) setTimeout(() => location.href = url, 600); };
  $('waveBtn').onclick = () => { G.wave(); net.emote('wave'); };
  window.NET = net;
});
// one tap to enter: this tap is what lets the room videos (and read-aloud) play with sound from then on
$('lt').style.display = 'none';   // (28 Oct, Ben) no text under the name / button
{ const b = document.querySelector('#load .bar'); if (b) { $('lb').style.width = '100%'; b.style.transition = 'opacity .4s'; setTimeout(() => { b.style.opacity = '0'; setTimeout(() => { b.style.display = 'none'; }, 420); }, 350); } }   // (28 Oct, Ben) the bar fills, then fades away once the gallery is ready
$('nameRow').style.display = 'block'; $('nameIn').value = pref.name || '';
// (28 Oct, Ben) no avatar choice: every visit you're given Joe or Jane at random (more looks in ☰ and the Fox Studio)
// (28 Oct, Ben) every fox starts as a cane fox in the ART SUIT (the art square on the front, the BCP logo on the back, a different art per fox); the chair is in ☰ later
pref.look = 'suit'; WHO('joe');
$('enter').style.display = 'block'; $('enter').focus();
await new Promise(res => $('enter').addEventListener('click', () => {
  pref.name = ($('nameIn').value || '').trim().slice(0, 20) || ('Fox ' + Math.floor(100 + Math.random() * 900)); savePref();
  G.unlockAudio();
  try { if (!window.SOUND) { const mkSound = ({ setupSound }) => { window.SOUND = setupSound({ getState: () => G.localState(), inside: (x, y, z) => x < -44 || ['why', 'amb', 'cinema'].includes(G.campus && G.campus.zone()), zone: () => G.campus && G.campus.zone(), filmPlaying: () => !!G.film.url(), chair: () => (pref.extra || '') === 'chair' }); if (window.SOUND) { window.SOUND.resume(); window.SOUND.set(!pref.quietAmb); } }; if (window.__soundMod) mkSound(window.__soundMod); else SOUND_MOD.then(m => m && !window.SOUND && mkSound(m)); } } catch (e) {}   /* (29 Oct) made inside the Enter tap */
  try { if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
  res();
}, { once: true }));
$('load').style.display = 'none';
ENTER_RES();

window.READY = true;
</script>
