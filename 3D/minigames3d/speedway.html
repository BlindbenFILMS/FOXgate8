}
const infield = new THREE.Mesh(new THREE.CircleGeometry(1, 64), toon('#4f8a3a')); infield.scale.set(RX - TW / 2 - 1, RZ - TW / 2 - 1, 1); infield.rotation.x = -Math.PI / 2; infield.position.y = 0.03; scene.add(infield);
const desert = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), toon('#c8925a')); desert.rotation.x = -Math.PI / 2; scene.add(desert);
for (let i = 0; i < 40; i++) { const a = rr(0, 6.28), r = rr(260, 600); M(new THREE.ConeGeometry(rr(30, 80), rr(30, 80), 5), toon(['#b0643a', '#9a5a3a', '#c8805a'][i % 3]), Math.cos(a) * r, 15, Math.sin(a) * r, null, 0.3); }
for (let i = 0; i < 30; i++) { const a = rr(0, 6.28), r = rr(160, 240); const g = new THREE.Group(); g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r * 0.7); scene.add(g); M(new THREE.CapsuleGeometry(0.5, 3, 4, 8), toon('#4f8a45'), 0, 2, 0, g, 0.04); M(new THREE.CapsuleGeometry(0.3, 1.2, 4, 8), toon('#4f8a45'), 0.8, 2.4, 0, g, 0.03).rotation.z = Math.PI / 2; }
// grandstand with the crowd
{ const g = new THREE.Group(); g.position.set(0, 0, RZ + TW / 2 + 6); scene.add(g); for (let r = 0; r < 9; r++) M(BOX(110, 0.7, 1.4), toon(r % 2 ? '#5a6276' : '#4a5262'), 0, 0.4 + r * 0.7, r * 1.4, g, 0.03); const cols = ['#c42d3c', '#2f5f9e', '#e8cf4a', '#3f8a46', '#f2f0ea', '#ff8a3a'].map(c => new THREE.Color(c)); const n = 9 * 120, im = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.25, 0.4, 3, 6), toon('#ffffff'), n); const m4 = new THREE.Matrix4(); let k = 0; for (let r = 0; r < 9; r++) for (let i = 0; i < 120; i++) { m4.makeTranslation(-54 + i * 0.9, 1.2 + r * 0.7, r * 1.4); im.setMatrixAt(k, m4); im.setColorAt(k, cols[(k * 7) % 6]); k++; } g.add(im); window.__crowd = im; M(BOX(112, 1, 14), toon('#3a3a42'), 0, 9, 6, g, 0.03); }
for (const [x, z] of [[-RX - 14, 0], [RX + 14, 0], [0, -RZ - 14]]) { M(BOX(0.6, 22, 0.6), toon('#5a5560'), x, 11, z, null, 0.02); glow(x, 22, z, 0xfff6d8, 18); }
G.sun.color.set('#ffb08a'); G.sun.position.set(-80, 40, -60);
glow(-600, 60, -500, 0xffb070, 300, null, 1);
// ---------------------------------------------------------------- the cars
const COLS = ['#ff8a3a', '#c42d3c', '#2f5f9e', '#e8cf4a', '#3f8a46', '#7a3fb0'];

  const t = G.canvasTex(64, 64, k => { k.fillStyle = '#fff'; k.beginPath(); k.arc(32, 32, 30, 0, 7); k.fill(); k.fillStyle = '#111'; k.font = '900 40px Archivo, Arial'; k.textAlign = 'center'; k.textBaseline = 'middle'; k.fillText(num, 32, 34); }); for (const s of [-1, 1]) { const d = new THREE.Mesh(new THREE.CircleGeometry(0.42, 20), new THREE.MeshBasicMaterial({ map: t })); d.position.set(s * 1.11, 0.85, 0); d.rotation.y = s * Math.PI / 2; g.add(d); }
  for (const [x, z] of [[-1.1, -1.5], [1.1, -1.5], [-1.1, 1.5], [1.1, 1.5]]) M(new THREE.CylinderGeometry(0.45, 0.45, 0.4, 14), toon('#1b1830'), x, 0.45, z, g, 0).rotation.z = Math.PI / 2;
  const fl = glow(0, 0.7, -2.6, 0x7fd8ff, 0.1, g); g.userData.fl = fl; return g; }
const me = racer(COLS[0], '8'); const fox = G.makeFox({ torso: ['#ffffff', '#e7edf4', '#6b7d93'], crest: '8', mood: 'determined', look: G.PLAYER_MALE, outfit: 'armor' }); scene.remove(fox); me.add(fox); fox.position.set(0, 0.6, -0.4); fox.scale.setScalar(0.6);
const AI = []; for (let i = 0; i < 5; i++) AI.push({ g: racer(COLS[i + 1], String(i + 2)), u: 0.006 + 0.0045 * i, lane: (i % 2 ? 1 : -1) * 3.5, skill: rr(0.92, 1.02), v: 0 });
// ---------------------------------------------------------------- state
const S = {}; const LAPS = 3;
function reset() { Object.assign(S, { u: 0.001, off: 0, v: 0, yaw: 0, boost: 1, laps: 0, prevU: 0.001, count: 3, finished: false, draft: 0, time: 0 }); AI.forEach((a, i) => { a.u = 0.006 + 0.0045 * i; a.lane = (i % 2 ? 1 : -1) * 3.5; a.v = 0; a.lap = 0; a.done = false; }); S.shown = 4; }
reset(); G.onStart(() => { reset(); S.count = 3; });
const totalOf = (lap, u) => lap + u;
G.onFrame((dt, t, running) => {
  if (running && !S.finished) {
    if (S.count > 0) { S.count -= dt; const c1 = Math.max(0, Math.ceil(S.count)); if (c1 !== S.shown) { S.shown = c1; popup(c1 > 0 ? String(c1) : 'GO!', c1 > 0 ? '#f3f2f2' : '#7dff9a'); audio.tone(c1 > 0 ? 440 : 880, 0.2, 0.06, 'square', 1); } }
    else {

      // drafting: right behind another car
      S.draft = 0; for (const a of AI) { const du = (a.u + a.lap) - (S.u + S.laps); if (du > 0 && du < 0.02 && Math.abs(a.lane - S.off) < 2.2) S.draft = 1; }
      const top = 62 + (boosting ? 22 : 0) + S.draft * 8, curve = Math.abs(Math.cos(S.u * Math.PI * 2)); const grip = top - curve * (Math.abs(S.off - -TW / 2 + 1) < 4 ? 4 : 10);
      S.v += ((input.y > 0 ? 1 : input.y < 0 ? -1.6 : -0.3) * 26 - (S.v > grip ? (S.v - grip) * 2 : 0)) * dt; S.v = clamp(S.v, 0, top);

      const circ = Math.PI * 2 * Math.sqrt((RX * RX + RZ * RZ) / 2); S.prevU = S.u; S.u += S.v * dt / circ; if (S.u >= 1) { S.u -= 1; S.laps++; if (S.laps < LAPS) popup(S.laps === LAPS - 1 ? 'FINAL LAP!' : 'LAP ' + (S.laps + 1), '#ffd23a'); }
      // AI

        const du = (a.u + a.lap) - (S.u + S.laps); if (Math.abs(du) < 0.004 && Math.abs(a.lane - S.off) < 2.0) { S.off += Math.sign(S.off - a.lane || 1) * 0.4; S.v *= 0.97; audio.burst(0.08, 200, 0.2); } }
      if (S.laps >= LAPS) { S.finished = true; const pos = 1 + AI.filter(a => a.done).length; popup(pos === 1 ? 'YOU WIN!' : 'P' + pos, pos === 1 ? '#ffd23a' : '#f3f2f2'); cheer = 3; setTimeout(() => G.end({ score: [0, 1000, 700, 500, 350, 250, 150][pos], unit: 'POINTS', lines: ['Finished P' + pos + ' of 6', 'Time ' + S.time.toFixed(1) + 's'], credits: [0, 60, 40, 25, 15, 10, 5][pos] }), 1500); }
    }
