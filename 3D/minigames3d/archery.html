<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Kyoto Archery</title></head>
<body>
<script type="module">
import { shell, THREE, rr, clamp, damp } from './shell.js';
const G = await shell({ title: 'Kyoto Archery', world: 'KYOTO', bestKey: 'archery', sky: ['#7fa8e0', '#ffd8e2'], fog: 0.006,
  intro: 'Ten arrows at the mountain road range. Hold DRAW to pull the bow, aim with your thumb, read the wind flag, and let go. Bullseye scores ten; the far target counts double.',
  how: ['Arrow keys / WASD aim · hold Space to draw, release to shoot', 'Thumb aims · hold DRAW, release to shoot'],
  buttons: [{ id: 'draw', label: 'DRAW', keys: ['Space', 'KeyJ'], hot: true }],
  keysHelp: ['<b>WASD</b> aim', '<b>hold Space</b> draw · release to shoot'], stats: ['SCORE', 'ARROWS', 'WIND'] });
const { scene, camera, M, BOX, toon, glowing, glow, input, popup, msg, audio } = G;
// ---------------------------------------------------------------- the range
const grass = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), toon('#7a9a5a')); grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; scene.add(grass);
const lane = new THREE.Mesh(new THREE.PlaneGeometry(14, 90), toon('#cfc9bb')); lane.rotation.x = -Math.PI / 2; lane.position.set(0, 0.02, -40); scene.add(lane);
for (let z = 4; z > -88; z -= 3) for (const s of [-1, 1]) { M(new THREE.CylinderGeometry(0.08, 0.08, 2.2, 6), toon('#8aa84a'), s * 8 + rr(-0.2, 0.2), 1.1, z, null, 0); }
const VERM = toon('#c8322a'), INK = toon('#1d1a20');
function torii(z, w = 9, h = 6) { const g = new THREE.Group(); g.position.set(0, 0, z); scene.add(g); for (const s of [-1, 1]) M(new THREE.CylinderGeometry(0.3, 0.36, h, 12), VERM, s * w / 2, h / 2, 0, g, 0.04, 0.36); M(BOX(w + 1, 0.32, 0.42), VERM, 0, h - 1.1, 0, g, 0.03); M(BOX(w + 2.6, 0.36, 0.6), INK, 0, h + 0.3, 0, g, 0.03); }
torii(6); torii(-20); torii(-48);
for (let i = 0; i < 30; i++) { const s = i % 2 ? 1 : -1, z = -i * 3.2 + rr(-1, 1), x = s * rr(11, 26); const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g); M(new THREE.CylinderGeometry(0.22, 0.32, 2.2, 7), toon('#4a3530'), 0, 1.1, 0, g, 0.03); const pink = ['#f4b6c8', '#f7c9d6', '#eaa0b8'][i % 3]; for (let k = 0; k < 3; k++) M(new THREE.IcosahedronGeometry(1.4, 1), toon(pink), rr(-0.8, 0.8), 3 + rr(0, 0.8), rr(-0.8, 0.8), g, 0.04, 1.4).scale.y = 0.75; }
{ const fuji = new THREE.Group(); fuji.position.set(30, -20, -420); scene.add(fuji); fuji.add(new THREE.Mesh(new THREE.ConeGeometry(240, 170, 40, 1, true), new THREE.MeshToonMaterial({ color: '#5a6a8a', gradientMap: G.grad, fog: false }))); const cap = new THREE.Mesh(new THREE.ConeGeometry(70, 50, 40, 1, true), new THREE.MeshToonMaterial({ color: '#f4f6fa', gradientMap: G.grad, fog: false })); cap.position.y = 60; fuji.add(cap); fuji.children[0].position.y = 0; }
// petals
const PN = 160, pg = new THREE.BufferGeometry(), pa = new Float32Array(PN * 3), ps = []; for (let i = 0; i < PN; i++) ps.push([rr(-20, 20), rr(0, 12), rr(-70, 6), rr(0, 9)]); pg.setAttribute('position', new THREE.BufferAttribute(pa, 3)); scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffc8d8, size: 0.14 })));
// targets: straw butts with the rings
const TARGETS = [];
function target(x, z, r, mult) { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g); M(new THREE.CylinderGeometry(r + 0.4, r + 0.4, 0.8, 32), toon('#c9a46a'), 0, r + 0.6, 0, g, 0.04, r + 0.4).rotation.x = Math.PI / 2;
  const face = G.canvasTex(256, 256, c => { const cols = ['#ffffff', '#1d1a20', '#ffffff', '#1d1a20', '#ffffff', '#c8322a', '#ffd23a']; for (let i = 0; i < 7; i++) { c.fillStyle = cols[i]; c.beginPath(); c.arc(128, 128, 126 - i * 18, 0, 7); c.fill(); } });
  const f = new THREE.Mesh(new THREE.CircleGeometry(r, 48), new THREE.MeshToonMaterial({ map: face, gradientMap: G.grad })); f.position.set(0, r + 0.6, 0.41); g.add(f); for (const s of [-1, 1]) M(BOX(0.18, r * 2 + 1, 0.18), toon('#6b4a35'), s * (r + 0.5), (r * 2 + 1) / 2, -0.4, g, 0.02);
  TARGETS.push({ x, z: z + 0.41, y: r + 0.6, r, mult, g }); }
target(-2.5, -22, 1.2, 1); target(2.8, -42, 1.4, 1.5); target(0, -68, 1.7, 2);
// wind flag
const flagPole = M(new THREE.CylinderGeometry(0.06, 0.06, 6, 6), INK, 6, 3, -10, null, 0); const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.9), toon('#c8322a', { side: THREE.DoubleSide })); flag.position.set(6.8, 5.5, -10); scene.add(flag);
// the archer
const fox = G.makeFox({ torso: ['#f4f1ea', '#26305a', '#1b1830'], crest: '8', mood: 'determined', look: G.PLAYER_MALE, outfit: 'robe' }); fox.position.set(-0.3, 0, 3.0); fox.rotation.y = Math.PI;
const bow = new THREE.Group(); scene.add(bow); { const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, -1.2, 0), new THREE.Vector3(0, 0, -0.45), new THREE.Vector3(0, 1.2, 0)); bow.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.04, 6), INK)); }
const string = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -1.2, 0), new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1.2, 0)]), new THREE.LineBasicMaterial({ color: 0xf4f1ea })); bow.add(string);
const arrowGeo = new THREE.CylinderGeometry(0.025, 0.025, 1.0, 6); arrowGeo.rotateX(Math.PI / 2);
function makeArrow() { const g = new THREE.Group(); g.add(new THREE.Mesh(arrowGeo, toon('#8a6a46'))); const tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 6), toon('#cbd5e1')); tip.rotation.x = -Math.PI / 2; tip.position.z = -0.55; g.add(tip); for (let k = 0; k < 3; k++) { const f = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.08), toon('#c8322a', { side: THREE.DoubleSide })); f.position.z = 0.42; f.rotation.z = k * 2.1; g.add(f); } scene.add(g); return g; }
const nocked = makeArrow();
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.18, 24), new THREE.MeshBasicMaterial({ color: 0xffd23a, depthTest: false, transparent: true, opacity: 0.85 })); reticle.renderOrder = 10; scene.add(reticle);
// ---------------------------------------------------------------- state
const S = {}, FLY = [];
function reset() { Object.assign(S, { yaw: 0, pitch: 0.04, draw: 0, arrows: 10, score: 0, wind: rr(-1, 1), wasDrawing: false, done: false }); for (const a of FLY) scene.remove(a.m); FLY.length = 0; }
reset(); G.onStart(() => { reset(); msg('Hold DRAW, aim, release.', 2.2); });
function shoot() { const p = S.draw; if (p < 0.15) return; const m = makeArrow(); const dir = new THREE.Vector3(-Math.sin(S.yaw) * Math.cos(S.pitch), Math.sin(S.pitch), -Math.cos(S.yaw) * Math.cos(S.pitch)); const start = new THREE.Vector3(0.35, 1.75, 2.2); m.position.copy(start); FLY.push({ m, v: dir.multiplyScalar(30 + p * 34), t: 0, stuck: false }); S.arrows--; audio.tone(240, 0.12, 0.04, 'triangle', 2.2); S.draw = 0; }
G.onFrame((dt, t, running) => {
  if (running && !S.done) {
    S.yaw = clamp(S.yaw - input.x * dt * 0.35, -0.35, 0.35); S.pitch = clamp(S.pitch + input.y * dt * 0.25, -0.1, 0.35);
    const drawing = input.held.draw && S.arrows > 0; if (drawing) S.draw = Math.min(1, S.draw + dt * 0.9); if (S.wasDrawing && !drawing) shoot(); S.wasDrawing = drawing;
  }
  for (const a of FLY) { if (a.stuck) continue; a.t += dt; a.v.y -= 9.8 * dt; a.v.x += S.wind * 1.6 * dt; const prev = a.m.position.clone(); a.m.position.addScaledVector(a.v, dt); a.m.lookAt(a.m.position.clone().sub(a.v));
    for (const T of TARGETS) { if (prev.z > T.z && a.m.position.z <= T.z) { const k = (prev.z - T.z) / (prev.z - a.m.position.z), hx = prev.x + (a.m.position.x - prev.x) * k, hy = prev.y + (a.m.position.y - prev.y) * k, d = Math.hypot(hx - T.x, hy - T.y); if (d <= T.r) { a.stuck = true; a.m.position.set(hx, hy, T.z + 0.3); const ring = Math.max(1, 10 - Math.floor(d / T.r * 7) * 1.5 | 0), pts = Math.round(ring * T.mult); S.score += pts; popup(ring >= 10 ? 'BULLSEYE! +' + pts : '+' + pts, ring >= 10 ? '#ffd23a' : '#f3f2f2'); audio.tone(ring >= 10 ? 1100 : 600, 0.1, 0.05, 'triangle', 1.4); S.wind = rr(-1, 1); break; } } }
    if (!a.stuck && (a.m.position.y < 0 || a.m.position.z < -90)) { a.stuck = true; if (a.m.position.y < 0) a.m.position.y = 0.05; popup('MISS', '#ff8a7a'); S.wind = rr(-1, 1); } }
  if (running && S.arrows <= 0 && FLY.every(a => a.stuck) && !S.done) { S.done = true; setTimeout(() => G.end({ score: S.score, lines: ['Ten arrows at the Kyoto range'], credits: Math.round(S.score / 3) }), 900); }
  // archer pose, bow, nocked arrow
  G.animFox(fox, dt, 0); const P = fox.userData.P; P.arms[0].rotation.x = -1.55; P.arms[0].rotation.z = -0.1; P.arms[1].rotation.x = -1.4 + S.draw * 0.2; P.arms[1].rotation.z = 0.5 + S.draw * 0.4; fox.rotation.y = Math.PI - S.yaw;
  const bp = new THREE.Vector3(0.35 - Math.sin(S.yaw) * 0.9, 1.75 + Math.sin(S.pitch) * 0.9, 2.2 - Math.cos(S.yaw) * 0.9); bow.position.copy(bp); bow.rotation.set(0, S.yaw + Math.PI / 2, 0);
  string.geometry.setFromPoints([new THREE.Vector3(0, -1.2, 0), new THREE.Vector3(0, 0, S.draw * 0.75), new THREE.Vector3(0, 1.2, 0)]);
  nocked.visible = S.arrows > 0; nocked.position.copy(bp).add(new THREE.Vector3(Math.sin(S.yaw) * (S.draw * 0.6 - 0.1), 0, Math.cos(S.yaw) * (S.draw * 0.6 - 0.1))); nocked.rotation.set(S.pitch, -S.yaw, 0);
  // reticle where the arrow would go with no wind at the middle target distance
  const dir = new THREE.Vector3(-Math.sin(S.yaw), Math.sin(S.pitch), -Math.cos(S.yaw)); reticle.position.set(0.35, 1.75, 2.2).addScaledVector(dir, 30); reticle.lookAt(camera.position); reticle.scale.setScalar(1 + (1 - S.draw) * 1.2);
  flag.rotation.y = S.wind > 0 ? 0 : Math.PI; flag.position.x = 6 + Math.sign(S.wind) * 0.8; flag.scale.x = 0.4 + Math.abs(S.wind) * 0.8; flag.rotation.z = Math.sin(t * 8) * 0.08;
  for (let i = 0; i < PN; i++) { const s = ps[i]; const y = 12 - ((t * 0.8 + s[3] * 1.4) % 12); pa.set([s[0] + Math.sin(t + s[3]) + S.wind * (12 - y) * 0.4, y, s[2]], i * 3); } pg.attributes.position.needsUpdate = true;
  const port = innerWidth < innerHeight; camera.position.set(2.4 + (port ? 0.4 : 0), 2.5, 6.8 + (port ? 2.5 : 0)); camera.lookAt(0.2 - Math.sin(S.yaw) * 10, 1.6 + Math.sin(S.pitch) * 10, 2.2 - Math.cos(S.yaw) * 10); camera.fov = port ? 70 : 52; camera.updateProjectionMatrix();
  G.hud.set(S.score, S.arrows, (S.wind > 0 ? '→ ' : '← ') + Math.abs(S.wind * 10).toFixed(0));
});
</script>
</body></html>
