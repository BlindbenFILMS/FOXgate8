<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;background:#201e1d}a{color:#f3f2f2}a:hover{color:#ec3013}button:focus-visible,input:focus-visible{outline:2px solid #ec3013;outline-offset:2px}input[type=range]{accent-color:#ec3013}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;font-family:var(--font-body);color:#f3f2f2;background:#201e1d" data-screen-label="Human Hand Lab">
  <div style="display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px;padding:12px 16px;border-bottom:2px solid #f3f2f2">
    <div style="font-family:var(--font-heading);font-weight:800;font-size:22px">HUMAN HAND LAB</div>
    <div style="font-size:14px;color:#c9c6c4">{{ status }}</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));border-bottom:2px solid #f3f2f2">
    <sc-for list="{{ who }}" as="w" hint-placeholder-count="3">
      <button onClick="{{ w.pick }}" style="min-height:52px;padding:0 14px;text-align:left;font:800 15px var(--font-heading);background:{{ w.bg }};color:{{ w.fg }};border:0;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;margin:0 -2px -2px 0;cursor:pointer" style-hover="background:#5c1a0e;color:#f3f2f2">{{ w.label }}</button>
    </sc-for>
  </div>
  <div style="flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start">
    <div style="position:sticky;top:0;height:min(76vh,720px);min-height:420px;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;position:relative">
      <div ref="{{ stage }}" style="position:absolute;inset:0;touch-action:none"></div>
    </div>
    <div style="display:flex;flex-direction:column">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));border-bottom:2px solid #f3f2f2">
        <sc-for list="{{ presets }}" as="p" hint-placeholder-count="5">
          <button onClick="{{ p.pick }}" style="min-height:48px;padding:0 12px;text-align:left;font:800 13px var(--font-heading);background:transparent;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;margin:0 -2px -2px 0;cursor:pointer" style-hover="background:#5c1a0e">{{ p.label }}</button>
        </sc-for>
      </div>
      <sc-for list="{{ sides }}" as="sd" hint-placeholder-count="2">
        <div style="border-bottom:2px solid #f3f2f2;padding:10px 16px 6px">
          <div style="font:800 13px var(--font-heading);letter-spacing:0.08em;color:#ec3013;margin-bottom:4px">{{ sd.title }}</div>
          <sc-for list="{{ sd.rows }}" as="s" hint-placeholder-count="4">
            <label style="display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:5px 0">
              <span style="font:700 15px var(--font-body)">{{ s.label }}</span><span style="font:700 15px var(--font-body)">{{ s.txt }}</span>
              <input type="range" min="0" max="1" step="0.01" value="{{ s.v }}" onInput="{{ s.set }}" style="grid-column:1 / span 2;width:100%;height:32px;margin:0">
            </label>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { who: 'bensumo', n: 0, ready: false };
  stage = React.createRef();
  H = { L: { curl: 0.35, point: 0, thumb: 0.45, spread: 0.15 }, R: { curl: 0.35, point: 0, thumb: 0.45, spread: 0.15 } };
  async componentDidMount() {
    const kit = await import(new URL('engine/human-kit.js?v=s687c', document.baseURI).href), lab = await import(new URL('human-lab.js?v=s688d', document.baseURI).href);
    this.kit = kit; this.lab = await lab.createHumanLab({ container: this.stage.current, cfg: { ...kit.HUMAN_PRESETS.bensumo } }); window.__handLab = this.lab;
    this.push(); this.setState({ ready: true });
  }
  componentWillUnmount() { this.lab && this.lab.destroy && this.lab.destroy(); }
  push() { this.lab && this.lab.hands({ L: { ...this.H.L }, R: { ...this.H.R } }); }
  setAll(v) { this.H = { L: { ...v }, R: { ...v } }; this.push(); this.setState({ n: this.state.n + 1 }); }
  renderVals() {
    const S = this.state, pc = v => Math.round(v * 100) + '%';
    const P = { OPEN: { curl: 0, point: 0, thumb: 0, spread: 0.8 }, RELAXED: { curl: 0.35, point: 0, thumb: 0.45, spread: 0.15 }, FIST: { curl: 1, point: 0, thumb: 1, spread: 0 }, POINT: { curl: 1, point: 1, thumb: 0.9, spread: 0 }, GRIP: { curl: 0.82, point: 0, thumb: 0.75, spread: 0 } };
    return {
      stage: this.stage,
      status: !S.ready ? 'Loading…' : 'Drag to turn · the hands ease to each setting',
      who: [['bensumo', 'BEN · SUMO'], ['katesumo', 'KATE · ONNA-ZUMO'], ['ben', 'BEN']].map(([k, l]) => ({ label: l, bg: S.who === k ? '#f3f2f2' : 'transparent', fg: S.who === k ? '#201e1d' : '#f3f2f2', pick: () => { if (!this.lab) return; this.lab.set({ ...this.kit.HUMAN_PRESETS[k] }); setTimeout(() => this.push(), 50); this.setState({ who: k }); } })),
      presets: [...Object.entries(P).map(([k, v]) => ({ label: k, pick: () => this.setAll(v) })), { label: 'SEE LEFT HAND', pick: () => this.lab && this.lab.handCam('L') }, { label: 'SEE RIGHT HAND', pick: () => this.lab && this.lab.handCam('R') }, { label: 'WHOLE BODY', pick: () => this.lab && this.lab.handCam(null) }],
      sides: [['L', 'LEFT HAND'], ['R', 'RIGHT HAND']].map(([sd, title]) => ({ title, rows: [['curl', 'Curl (open … fist)'], ['point', 'Point (index out)'], ['thumb', 'Thumb (out … across)'], ['spread', 'Spread']].map(([q, label]) => ({ label, v: this.H[sd][q], txt: pc(this.H[sd][q]), set: e => { this.H[sd] = { ...this.H[sd], [q]: +e.target.value }; this.push(); this.setState({ n: S.n + 1 }); } })) })),
    };
  }
}
</script>
</body>
</html>
