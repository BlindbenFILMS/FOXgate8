<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap">
<style>html,body{margin:0;height:100%;background:#201e1d;color:#f3f2f2;font-family:Archivo,'Arial Black',Arial,sans-serif;-webkit-text-size-adjust:100%}a{color:#f3f2f2}a:hover{color:#ec3013}button:focus-visible,select:focus-visible{outline:2px solid #ec3013;outline-offset:2px}</style>
</helmet>
<div style="display:flex;flex-direction:column;height:100vh;height:100dvh;background:#201e1d;color:#f3f2f2;font-family:Archivo,'Arial Black',Arial,sans-serif">
  <div style="display:flex;flex-wrap:wrap;align-items:stretch;gap:0;border-bottom:2px solid #f3f2f2">
    <div style="display:flex;flex-direction:column;justify-content:center;padding:8px 16px;border-right:2px solid #f3f2f2;min-height:44px">
      <div style="font-size:11px;font-weight:800;letter-spacing:0.08em;color:#ec3013">8 GATES · WORLD KIT</div>
      <div style="font-size:18px;font-weight:900;letter-spacing:0.02em">LAYOUT VIEWER</div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;padding:0 12px;border-right:2px solid #f3f2f2;min-height:48px;font-size:13px;font-weight:800">
      WORLD
      <select value="{{ world }}" onChange="{{ onWorld }}" style="font:inherit;font-size:16px;font-weight:800;background:#201e1d;color:#f3f2f2;border:2px solid #f3f2f2;border-radius:0;padding:6px 8px;min-height:40px">
        <sc-for list="{{ worlds }}" as="w" hint-placeholder-count="3"><option value="{{ w.id }}">{{ w.label }}</option></sc-for>
      </select>
    </label>
    <button onClick="{{ onReload }}" style="font:inherit;font-size:14px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">RELOAD</button>
    <button onClick="{{ onOpen }}" style="font:inherit;font-size:14px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">OPEN FILE</button>
    <input ref="{{ fileRef }}" type="file" accept=".json,application/json" onChange="{{ onFile }}" style="display:none">
    <button onClick="{{ onFit }}" style="font:inherit;font-size:14px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">FIT MAP</button>
    <button onClick="{{ onWalk }}" style="font:inherit;font-size:14px;font-weight:900;text-align:left;background:#ec3013;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 20px;min-height:48px;cursor:pointer" style-hover="background:#c42410" style-active="background:#9a1c0c">WALK IT →</button>
  </div>
  <div style="display:flex;flex-direction:{{ bodyDir }};flex-wrap:nowrap;flex:1 1 0;min-height:0;overflow:{{ bodyOver }}">
    <div ref="{{ mapRef }}" style="position:relative;flex:{{ mapFlex }};height:{{ mapH }};min-height:0;min-width:0;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;overflow:hidden;background:#2b2928">
      <canvas ref="{{ canRef }}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab"></canvas>
      <div style="position:absolute;left:0;bottom:0;right:0;display:flex;flex-wrap:wrap;gap:0;background:#201e1d;border-top:2px solid #f3f2f2;font-size:13px;font-weight:700;pointer-events:none">
        <div style="padding:8px 12px;min-height:20px;text-wrap:pretty">{{ pick }}</div>
      </div>
    </div>
    <div style="flex:{{ panelFlex }};min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden">
      <div style="padding:12px 16px;border-bottom:2px solid #f3f2f2">
        <div style="font-size:12px;font-weight:800;letter-spacing:0.06em;opacity:0.8">FILE</div>
        <div style="font-size:15px;font-weight:800;word-break:break-all">{{ src }}</div>
        <div style="font-size:13px;margin-top:2px">{{ sub }}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:2px solid #f3f2f2">
        <div style="padding:10px 16px;border-right:2px solid #f3f2f2"><div style="font-size:12px;font-weight:800">FAIL</div><div style="font-size:34px;font-weight:900;color:#ec3013;line-height:1">{{ counts.fail }}</div></div>
        <div style="padding:10px 16px;border-right:2px solid #f3f2f2"><div style="font-size:12px;font-weight:800">WARN</div><div style="font-size:34px;font-weight:900;color:#ffd23a;line-height:1">{{ counts.warn }}</div></div>
        <div style="padding:10px 16px"><div style="font-size:12px;font-weight:800">PASS</div><div style="font-size:34px;font-weight:900;line-height:1">{{ counts.pass }}</div></div>
      </div>
      <sc-if value="{{ allOk }}" hint-placeholder-val="{{ false }}">
        <div style="padding:12px 16px;background:#f3f2f2;color:#201e1d;font-size:15px;font-weight:900;border-bottom:2px solid #f3f2f2">CHECKER PASSES · READY TO HAND BACK</div>
      </sc-if>
      <div style="flex:1 1 0;overflow:auto;min-height:0;max-height:{{ listMax }}">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
          <button onClick="{{ it.go }}" style="display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;width:100%;box-sizing:border-box;text-align:left;font:inherit;background:transparent;color:#f3f2f2;border:0;border-bottom:2px solid #3d3b3a;padding:10px 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">
            <span style="font-size:12px;font-weight:900;color:{{ it.col }}">{{ it.tag }}</span>
            <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:11px;font-weight:800;letter-spacing:0.06em;opacity:0.75">{{ it.rule }}</span><span style="font-size:14px;font-weight:600;text-wrap:pretty">{{ it.msg }}</span></span>
          </button>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px 14px;padding:10px 16px;border-top:2px solid #f3f2f2;font-size:12px;font-weight:800">
        <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:6px;background:#e8b923"></span>PATH</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:6px;background:#77736f"></span>ROAD</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;background:#f3f2f2;border:2px solid #201e1d"></span>BUILDING</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;background:#ec3013"></span>DOOR</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#38bdf8"></span>NPC SPOT</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;background:#5d7a3e"></span>WILD</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border:2px solid #ec3013;border-radius:50%"></span>GATE / DOCK</span>
      </div>
    </div>
  </div>
  <sc-if value="{{ walking }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:50;background:#201e1d;display:flex;align-items:center;justify-content:center">
      <div ref="{{ frameRef }}" style="position:relative;width:{{ frameW }};height:{{ frameH }};max-width:100%;max-height:100%;overflow:hidden;background:#000;outline:2px solid #f3f2f2;touch-action:none">
        <div style="position:absolute;left:0;top:0;z-index:2;display:flex;flex-direction:column;background:#201e1d;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;padding:8px 12px;pointer-events:none;max-width:60%">
          <div style="font-size:16px;font-weight:900;letter-spacing:0.02em">{{ zone }}</div>
          <div style="font-size:12px;font-weight:700;opacity:0.85">{{ zoneKey }}</div>
          <div style="font-size:12px;font-weight:800;color:{{ pathCol }}">{{ onPath }}</div>
        </div>
        <div style="position:absolute;right:0;top:0;z-index:2;display:flex;flex-direction:column;border-left:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2">
          <button onClick="{{ onExit }}" style="font:inherit;font-size:14px;font-weight:900;text-align:left;background:#ec3013;color:#f3f2f2;border:0;border-bottom:2px solid #f3f2f2;padding:0 16px;min-height:48px;min-width:110px;cursor:pointer" style-hover="background:#c42410" style-active="background:#9a1c0c">← MAP</button>
          <button onClick="{{ onPhone }}" style="font:inherit;font-size:13px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;padding:0 16px;min-height:48px;min-width:110px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">{{ phoneLabel }}</button>
        </div>
        <div style="position:absolute;left:0;bottom:0;z-index:2;background:#201e1d;border-top:2px solid #f3f2f2;border-right:2px solid #f3f2f2;padding:6px 10px;font-size:12px;font-weight:700;pointer-events:none">{{ walkHint }}</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { world: 'example', src: '', sub: '', items: [], counts: { fail: 0, warn: 0, pass: 0 }, ok: false, pick: 'Tap the map to see what is there. Drag to move, pinch or wheel to zoom.', walking: false, phone: 'full', zone: '', zoneKey: '', onPath: '', walkHint: '' };
  mapRef = React.createRef(); canRef = React.createRef(); fileRef = React.createRef(); frameRef = React.createRef();
  WORLDS = [['example', 'EXAMPLE · MERU 2'], ['gaya', 'GAYA'], ['kyoto', 'KYOTO'], ['jidda', 'JIDDA'], ['kufa', 'KUFA'], ['luxor', 'LUXOR'], ['nebo', 'NEBO'], ['ur', 'UR'], ['zion', 'ZION'], ['shasta', 'SHASTA'], ['player', 'PLAYER PLANET'], ['home', 'HOME'], ['earth', 'EARTH'], ['dsf', 'DEEP SPACE FOX'], ['meru', 'MERU']];
  url = p => new URL(p, location.href).href;
  componentDidMount() {
    const q = new URLSearchParams(location.search); let w = q.get('world') || localStorage.getItem('layoutViewer.world') || 'example';
    if (!this.WORLDS.some(a => a[0] === w)) w = 'example'; this.useDraft = q.get('draft') === '1';
    this.onRs = () => { const n = innerWidth < 760; if (n !== this.state.narrow) this.setState({ narrow: n }); }; addEventListener('resize', this.onRs); this.onRs();
    this.setupMap(); this.load(w); this.poll = setInterval(() => this.refresh(), 3000);
  }
  componentWillUnmount() { clearInterval(this.poll); removeEventListener('resize', this.onRs); this.stopWalk(); if (this.ro) this.ro.disconnect(); }
  pathFor(w) { return w === 'example' ? 'kit/example.meru.layout.json' : 'layout/' + w + '.layout.json'; }
  async checker() { if (!this.C) this.C = await import(this.url('./kit/layout-check.js?v=348v')); return this.C; }
  async load(w) { this.world = w; this.text = null; this.view = null; this.userMoved = false; this.hl = null; try { localStorage.setItem('layoutViewer.world', w); } catch (e) {} this.setState({ world: w }); await this.fetchLayout(true); }
  async fetchLayout(first) { const p = this.pathFor(this.world);
    if (this.useDraft && this.world !== 'example') { let d = null; try { d = localStorage.getItem(this.world + '.layoutDraft'); } catch (e) {} if (d) { if (!first && d === this.text) return; this.text = d; await this.apply(d, 'DRAFT from the Map Workshop (' + this.world + ')'); return; } }
    try { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error('missing'); const t = await r.text(); if (!first && t === this.text) return; this.text = t; await this.apply(t, p); }
    catch (e) { if (!first) return; this.L = null; this.setState({ src: p, sub: 'Not written yet.', items: [{ level: 'fail', rule: 'FILE', msg: p + ' does not exist yet. Ask Claude to write it (PARALLEL_WORLDS.md section 2), then tap RELOAD.' }], counts: { fail: 1, warn: 0, pass: 0 }, ok: false }); this.draw(); } }
  refresh() { if (this.world && this.world !== 'file' && !document.hidden) this.fetchLayout(false); }
  async apply(text, label) {
    const C = await this.checker(); let L;
    try { L = JSON.parse(text); } catch (e) { this.L = null; this.setState({ src: label, sub: 'JSON error', items: [{ level: 'fail', rule: 'JSON', msg: 'The file is not valid JSON: ' + e.message }], counts: { fail: 1, warn: 0, pass: 0 }, ok: false }); this.draw(); return; }
    this.L = L; const w = (L.meta || {}).world;
    if (this.roomsWorld !== w) { this.roomsWorld = w; this.rooms2d = null; try { const r = await fetch('uploads/surface_' + w + '.html'); if (r.ok) this.rooms2d = C.rooms2dFrom(await r.text(), w); } catch (e) {} }
    const res = C.checkLayout(L, { rooms2d: this.rooms2d }), m = L.meta || {};
    if (!this.view) this.fit();
    const d = new Date(); this.setState({ src: label, sub: `${(w || '?').toUpperCase()} · version ${m.version ?? '?'} · checked ${d.toLocaleTimeString()}${this.rooms2d ? ' · ' + this.rooms2d.length + ' rooms in the 2D file' : ''}`, items: res.items, counts: res.counts, ok: res.ok });
    this.draw(); if (this.W) this.rebuildWalk();
  }
  // ---------- top-down map ----------
  setupMap() {
    const cv = this.canRef.current, host = this.mapRef.current; if (!cv || !host) return;
    this.ro = new ResizeObserver(() => { const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = Math.max(1, Math.min(4096, host.clientWidth * dpr)); cv.height = Math.max(1, Math.min(4096, host.clientHeight * dpr)); this.dpr = dpr; if (!this.view || !this.userMoved) this.fit(); this.draw(); }); this.ro.observe(host);
    const P = new Map(); let moved = 0, pinch = null;
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); P.set(e.pointerId, [e.offsetX, e.offsetY]); moved = 0; if (P.size === 2) { const [a, b] = [...P.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: this.view.s }; } });
    cv.addEventListener('pointermove', e => { const p = P.get(e.pointerId); if (!p || !this.view) return; const dx = e.offsetX - p[0], dy = e.offsetY - p[1]; P.set(e.pointerId, [e.offsetX, e.offsetY]); moved += Math.abs(dx) + Math.abs(dy);
      if (P.size === 2 && pinch) { const [a, b] = [...P.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); this.view.s = Math.max(0.05, Math.min(40, pinch.s * d / pinch.d)); }
      else if (P.size === 1) { this.userMoved = true; this.view.cx -= dx / this.view.s; this.view.cz -= dy / this.view.s; } this.draw(); });
    const up = e => { if (P.size === 1 && moved < 6) this.tapAt(e.offsetX, e.offsetY); P.delete(e.pointerId); if (P.size < 2) pinch = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { P.delete(e.pointerId); pinch = null; });
    cv.addEventListener('wheel', e => { e.preventDefault(); if (!this.view) return; this.userMoved = true; const [wx, wz] = this.toW(e.offsetX, e.offsetY); this.view.s = Math.max(0.05, Math.min(40, this.view.s * Math.exp(-e.deltaY * 0.0015))); const [nx, nz] = this.toW(e.offsetX, e.offsetY); this.view.cx += wx - nx; this.view.cz += wz - nz; this.draw(); }, { passive: false });
  }
  fit() { const host = this.mapRef.current; if (!host) return; const half = (this.L && this.L.map && this.L.map.half) || 300, W = host.clientWidth, H = host.clientHeight - 40; if (W < 50 || H < 50) return; this.view = { cx: 0, cz: 0, s: Math.max(0.05, Math.min(W, H) / (2 * half * 1.06)) }; }
  toW(sx, sy) { const host = this.mapRef.current, v = this.view; return [v.cx + (sx - host.clientWidth / 2) / v.s, v.cz + (sy - (host.clientHeight - 40) / 2) / v.s]; }
  focus(at) { if (!at || !this.view) return; this.userMoved = true; this.view.cx = at[0]; this.view.cz = at[1]; this.view.s = Math.max(this.view.s, 3); this.hl = at; this.draw(); }
  tapAt(sx, sy) { const L = this.L; if (!L) return; const [x, z] = this.toW(sx, sy), tol = 10 / this.view.s, C = this.C; let t = null;
    const near = (p, r) => p && Math.hypot(p[0] - x, p[1] - z) < r;
    for (const s of L.spots || []) if (near(s.at, tol)) { t = `SPOT ${s.key} · ${s.kind || 'npc'}${s.from2d ? ' · 2D key' : ''}${s.draft ? ' · draft' : ''}`; break; }
    if (!t) for (const g of L.gates || []) if (near(g.at, Math.max(tol, g.r || 6))) { t = `GATE ${g.key} · ${g.kind || ''}`; break; }
    if (!t && L.dock && near(L.dock.pad, Math.max(tol, L.dock.r || 10))) t = `DOCK ${L.dock.key}`;
    if (!t) for (const b of L.buildings || []) if (near(b.door, tol)) { t = `DOOR ${b.key} · faces ${b.face}`; break; }
    if (!t) for (const b of L.buildings || []) if (b.f && x > b.f[0] && x < b.f[1] && z > b.f[2] && z < b.f[3]) { t = `BUILDING ${b.key} · ${b.label || ''} · ${Math.round(b.f[1] - b.f[0])} x ${Math.round(b.f[3] - b.f[2])} m · h ${b.h || '?'}${b.interior ? ' · has an interior' : ''}`; break; }
    if (!t) for (const p of L.paths || []) if (p.p && C.polyD(x, z, p.p) < (p.w || 4) / 2 + tol) { t = `PATH ${p.key} · ${p.label || ''} · ${p.lining} every ${p.every} m`; break; }
    if (!t) for (const w of L.wild || []) if (w.r && x > w.r[0] && x < w.r[1] && z > w.r[2] && z < w.r[3]) { t = `WILD ${w.key} · for ${w.for || '?'}`; break; }
    if (!t) { const Z = C.zoneAt(L, x, z); t = Z ? `ZONE ${Z.key} · ${Z.label}` : 'Nothing here.'; }
    this.setState({ pick: `${t}   (x ${Math.round(x)}, z ${Math.round(z)})` });
  }
  draw() {
    const cv = this.canRef.current, host = this.mapRef.current; if (!cv || !host) return; const g = cv.getContext('2d'), dpr = this.dpr || 1;
    g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#2b2928'; g.fillRect(0, 0, cv.width, cv.height); const L = this.L; if (!L || !this.view) return;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); const v = this.view, W = host.clientWidth, H = host.clientHeight - 40, S = v.s;
    const X = x => (x - v.cx) * S + W / 2, Z = z => (z - v.cz) * S + H / 2, rect = (r, fill, stroke, lw = 2) => { const x = X(r[0]), y = Z(r[2]), w = (r[1] - r[0]) * S, h = (r[3] - r[2]) * S; if (fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.strokeRect(x, y, w, h); } };
    const line = (p, w, col) => { if (!p || p.length < 2) return; g.strokeStyle = col; g.lineWidth = Math.max(1.5, w * S); g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); p.forEach(([x, z], i) => i ? g.lineTo(X(x), Z(z)) : g.moveTo(X(x), Z(z))); g.stroke(); };
    const text = (s, x, y, col = '#201e1d', size = 12, bg) => { g.font = `800 ${size}px Archivo, Arial, sans-serif`; if (bg) { const w = g.measureText(s).width; g.fillStyle = bg; g.fillRect(x - 3, y - size, w + 6, size + 5); } g.fillStyle = col; g.fillText(s, x, y); };
    const half = (L.map && L.map.half) || 300, SURF = { stone: '#d3cdc2', grass: '#a9c48a', sand: '#eadcb4', wood: '#b48a5c', dirt: '#bea27c', snow: '#f4f6f8', tile: '#d8d2d8', metal: '#b9bec4' };
    rect([-half, half, -half, half], '#bcd3a0', '#f3f2f2', 2);
    for (const s of L.surfaces || []) if (s.r) rect(s.r, SURF[s.s] || '#cfcac2');
    for (const w of L.wild || []) if (w.r) { rect(w.r, 'rgba(70,100,45,0.55)', '#3f5a2a', 2); }
    { const T = L.terrain || {}; g.setLineDash([4, 4]); for (const f of T.forests || []) if (f.r) rect(f.r, 'rgba(47,95,42,0.18)', '#2f5f2a', 1.5); for (const c of T.clearings || []) if (c.r) rect(c.r, 'rgba(243,242,242,0.25)', '#f3f2f2', 1.5); g.setLineDash([]); }
    for (const w of L.water || []) { g.fillStyle = '#7fb8de'; if (w.e) { g.beginPath(); g.ellipse(X(w.e[0]), Z(w.e[1]), w.e[2] * S, w.e[3] * S, 0, 0, 7); g.fill(); } else if (w.r) rect(w.r, '#7fb8de'); }
    for (const o of L.islands || []) if (o.r) { const pts = this.C && this.C.islandOutline ? this.C.islandOutline(o, 72) : []; g.fillStyle = '#e8d8a8'; g.beginPath(); pts.forEach(([x, z], i) => i ? g.lineTo(X(x), Z(z)) : g.moveTo(X(x), Z(z))); g.closePath(); g.fill(); }
    for (const w of L.water || []) if (w.canal && w.r) rect(w.r, '#7fb8de');
