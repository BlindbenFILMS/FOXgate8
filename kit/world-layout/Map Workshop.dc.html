<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap">
<style>html,body{margin:0;height:100%;background:#201e1d;color:#f3f2f2;font-family:Archivo,'Arial Black',Arial,sans-serif;-webkit-text-size-adjust:100%}a{color:#f3f2f2}a:hover{color:#ec3013}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ec3013;outline-offset:2px}</style>
</helmet>
<div style="display:flex;flex-direction:column;height:100vh;height:100dvh;background:#201e1d;color:#f3f2f2;font-family:Archivo,'Arial Black',Arial,sans-serif">
  <div style="display:flex;flex-wrap:wrap;align-items:stretch;border-bottom:2px solid #f3f2f2">
    <div style="display:flex;flex-direction:column;justify-content:center;padding:8px 16px;border-right:2px solid #f3f2f2;min-height:44px">
      <div style="font-size:11px;font-weight:800;letter-spacing:0.08em;color:#ec3013">8 GATES · WORLD KIT</div>
      <div style="font-size:18px;font-weight:900">MAP WORKSHOP</div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;padding:0 12px;border-right:2px solid #f3f2f2;min-height:48px;font-size:13px;font-weight:800">
      WORLD
      <select key="{{ world }}" value="{{ world }}" onChange="{{ onWorld }}" style="font:inherit;font-size:16px;font-weight:800;background:#201e1d;color:#f3f2f2;border:2px solid #f3f2f2;border-radius:0;padding:6px 8px;min-height:40px">
        <sc-for list="{{ worlds }}" as="w" hint-placeholder-count="3"><option value="{{ w.id }}" selected="{{ w.sel }}">{{ w.label }}</option></sc-for>
      </select>
    </label>
    <button onClick="{{ onUndo }}" style="font:inherit;font-size:14px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">UNDO</button>
    <button onClick="{{ onExport }}" style="font:inherit;font-size:14px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">DOWNLOAD JSON</button>
    <button onClick="{{ onCopy }}" style="font:inherit;font-size:14px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">COPY JSON</button>
    <button onClick="{{ onFromFile }}" style="font:inherit;font-size:14px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12" style-active="background:#7a2614">RELOAD FROM FILE</button>
    <a href="{{ walkUrl }}" style="display:flex;align-items:center;font-size:14px;font-weight:900;text-decoration:none;background:#ec3013;color:#f3f2f2;border-right:2px solid #f3f2f2;padding:0 20px;min-height:48px" style-hover="background:#c42410">WALK IT →</a>
  </div>
  <div style="display:flex;flex-direction:{{ bodyDir }};flex:1 1 0;min-height:0;overflow:{{ bodyOver }}">
    <div ref="{{ mapRef }}" style="position:relative;flex:{{ mapFlex }};height:{{ mapH }};min-height:0;min-width:0;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;overflow:hidden;background:#2b2928">
      <canvas ref="{{ canRef }}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas>
      <div style="position:absolute;left:0;bottom:0;right:0;background:#201e1d;border-top:2px solid #f3f2f2;padding:8px 12px;font-size:13px;font-weight:700;pointer-events:none;text-wrap:pretty">{{ hint }}</div>
      <sc-if value="{{ drawing }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;right:0;top:0;display:flex;border-left:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2">
          <button onClick="{{ onUndoPoint }}" style="font:inherit;font-size:14px;font-weight:800;text-align:left;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;padding:0 16px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12">← POINT</button>
          <button onClick="{{ onDone }}" style="font:inherit;font-size:14px;font-weight:900;text-align:left;background:#ec3013;color:#f3f2f2;border:0;padding:0 18px;min-height:48px;cursor:pointer" style-hover="background:#c42410">DONE</button>
        </div>
      </sc-if>
    </div>
    <div style="flex:{{ panelFlex }};min-width:0;display:flex;flex-direction:column;min-height:0;overflow:auto">
      <div style="padding:10px 16px;border-bottom:2px solid #f3f2f2;font-size:13px;font-weight:700">{{ status }}</div>
      <div style="padding:10px 16px 12px;border-bottom:2px solid #f3f2f2">
        <div style="font-size:12px;font-weight:800;letter-spacing:0.06em;margin-bottom:6px">TOOL</div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid #f3f2f2">
          <sc-for list="{{ tools }}" as="t" hint-placeholder-count="6">
            <button onClick="{{ t.pick }}" style="font:inherit;font-size:14px;font-weight:900;text-align:left;background:{{ t.bg }};color:{{ t.fg }};border:0;border-right:2px solid #f3f2f2;border-bottom:2px solid #f3f2f2;padding:0 10px;min-height:48px;cursor:pointer" style-hover="background:#4a1a12">{{ t.label }}</button>
          </sc-for>
        </div>
        <sc-if value="{{ hasSubs }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
            <sc-for list="{{ subs }}" as="o"><button onClick="{{ o.pick }}" style="font:inherit;font-size:13px;font-weight:800;text-align:left;background:{{ o.bg }};color:{{ o.fg }};border:2px solid #f3f2f2;padding:0 10px;min-height:44px;cursor:pointer">{{ o.label }}</button></sc-for>
          </div>
        </sc-if>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12px;font-weight:800">
          GRID
          <sc-for list="{{ grids }}" as="o"><button onClick="{{ o.pick }}" style="font:inherit;font-size:13px;font-weight:800;text-align:left;background:{{ o.bg }};color:{{ o.fg }};border:2px solid #f3f2f2;padding:0 10px;min-height:44px;min-width:52px;cursor:pointer">{{ o.label }}</button></sc-for>
        </div>
      </div>
      <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
        <div style="padding:10px 16px 12px;border-bottom:2px solid #f3f2f2;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div style="font-size:15px;font-weight:900">{{ selTitle }}</div>
            <button onClick="{{ onDelete }}" style="font:inherit;font-size:13px;font-weight:900;text-align:left;background:#201e1d;color:#ec3013;border:2px solid #ec3013;padding:0 12px;min-height:44px;cursor:pointer" style-hover="background:#4a1a12">DELETE</button>
          </div>
          <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
            <div style="display:flex;flex-direction:column;gap:4px">
              <div style="font-size:11px;font-weight:800;letter-spacing:0.06em;opacity:0.8">{{ f.label }}</div>
              <sc-if value="{{ f.isText }}"><input value="{{ f.value }}" onChange="{{ f.onChange }}" style="font:inherit;font-size:16px;font-weight:700;background:#201e1d;color:#f3f2f2;border:2px solid #f3f2f2;border-radius:0;padding:8px 10px;min-height:28px"></sc-if>
              <sc-if value="{{ f.isNum }}">
                <div style="display:flex;align-items:stretch;border:2px solid #f3f2f2;width:max-content">
                  <button onClick="{{ f.dec }}" style="font:inherit;font-size:20px;font-weight:900;background:#201e1d;color:#f3f2f2;border:0;border-right:2px solid #f3f2f2;min-width:48px;min-height:44px;cursor:pointer" style-hover="background:#4a1a12">−</button>
                  <div style="display:flex;align-items:center;padding:0 14px;font-size:16px;font-weight:800;min-width:56px">{{ f.value }}</div>
                  <button onClick="{{ f.inc }}" style="font:inherit;font-size:20px;font-weight:900;background:#201e1d;color:#f3f2f2;border:0;border-left:2px solid #f3f2f2;min-width:48px;min-height:44px;cursor:pointer" style-hover="background:#4a1a12">+</button>
                </div>
              </sc-if>
              <sc-if value="{{ f.isChoice }}">
                <div style="display:flex;flex-wrap:wrap;gap:6px">
                  <sc-for list="{{ f.options }}" as="o"><button onClick="{{ o.pick }}" style="font:inherit;font-size:13px;font-weight:800;text-align:left;background:{{ o.bg }};color:{{ o.fg }};border:2px solid #f3f2f2;padding:0 10px;min-height:44px;cursor:pointer">{{ o.label }}</button></sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <div style="padding:10px 16px 4px;display:flex;justify-content:space-between;align-items:baseline">
        <div style="font-size:12px;font-weight:800;letter-spacing:0.06em">EVERY WORLD HAS</div>
        <div style="font-size:13px;font-weight:900">{{ reqDone }}</div>
      </div>
      <div style="padding:0 0 12px">
        <sc-for list="{{ req }}" as="r" hint-placeholder-count="6">
          <button onClick="{{ r.go }}" style="display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;box-sizing:border-box;text-align:left;font:inherit;background:transparent;color:#f3f2f2;border:0;border-bottom:2px solid #3d3b3a;padding:6px 16px;min-height:44px;cursor:pointer" style-hover="background:#4a1a12">
            <span style="font-size:16px;font-weight:900;color:{{ r.col }}">{{ r.mark }}</span>
            <span style="font-size:14px;font-weight:700;text-wrap:pretty">{{ r.label }}</span>
            <span style="font-size:12px;font-weight:900;color:{{ r.col }}">{{ r.act }}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { world: 'gaya', tool: 'move', sub: 'npc', area: 'zone', grid: 2, sel: null, drawing: false, ver: 0, narrow: false };
  mapRef = React.createRef(); canRef = React.createRef();
  WORLDS = [['gaya', 'GAYA'], ['kyoto', 'KYOTO'], ['jidda', 'JIDDA'], ['kufa', 'KUFA'], ['luxor', 'LUXOR'], ['nebo', 'NEBO'], ['ur', 'UR'], ['zion', 'ZION'], ['shasta', 'SHASTA'], ['player', 'PLAYER PLANET'], ['home', 'HOME'], ['earth', 'EARTH'], ['dsf', 'DEEP SPACE FOX'], ['meru', 'MERU']];
  HINTS = { move: 'MOVE: drag a building, spot or area. Drag the RED door square along the walls. Drag the WHITE corner to resize. Drag empty ground to pan.', path: 'PATH: tap to add points (they snap to other paths). DONE when finished.', road: 'ROAD: tap to add points. DONE when finished.', area: 'AREA: drag a box on the map.', place: 'PLACE: tap the map to drop it.', erase: 'ERASE: tap something to remove it.' };
  url = p => new URL(p, location.href).href;
  componentDidMount() {
    this.onRs = () => { const n = innerWidth < 760; if (n !== this.state.narrow) this.setState({ narrow: n }); }; addEventListener('resize', this.onRs); this.onRs();
    const q = new URLSearchParams(location.search); let w = q.get('world') || (localStorage.getItem('mapWorkshop.v') === '348j' ? localStorage.getItem('mapWorkshop.world') : 'jidda') || 'jidda'; try { localStorage.setItem('mapWorkshop.v', '348j'); } catch (e) {} if (!this.WORLDS.some(a => a[0] === w)) w = 'gaya';
    this.undo = []; this.setupMap(); this.open(w);
    this.onKey = e => { if (e.target && /INPUT|SELECT/.test(e.target.tagName)) return; if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); this.doUndo(); } if (e.key === 'Delete' || e.key === 'Backspace') this.delSel(); if (e.key === 'Enter' && this.state.drawing) this.endDraw(); if (e.key === 'Escape') { if (this.state.drawing) this.endDraw(); this.setState({ sel: null }, () => this.draw()); } };
    addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { removeEventListener('resize', this.onRs); removeEventListener('keydown', this.onKey); if (this.ro) this.ro.disconnect(); }
  key() { return this.world + '.layoutDraft'; }
  blank(w) { return { meta: { world: w, version: 1, date: new Date().toISOString().slice(0, 10), from: 'uploads/surface_' + w + '.html', notes: '' }, map: { half: 300, spawn: [0, 24], spawnFace: 'N' }, palette: { path: '#e8c35a', wall: '#ddd5c8', roof: '#7a3b2a' },
    zones: [{ key: w + 'Town', label: 'Town', r: [-70, 70, -70, 70], music: 'town', depth: 140 }], surfaces: [{ s: 'stone', r: [-30, 30, -30, 30] }], water: [], roads: [], paths: [], buildings: [], spots: [], gates: [], wild: [], props: [] }; }
  async open(w) {
    this.C = this.C || await import(this.url('./kit/layout-check.js?v=348v')); this.world = w; if (this.state.world !== w) this.setState({ world: w }); this.undo = []; this.view = null; this.userMoved = false; this.state.drawing = false;
    try { localStorage.setItem('mapWorkshop.world', w); } catch (e) {}
    let L = null, src = '';
    let F = null; try { const r = await fetch('layout/' + w + '.layout.json', { cache: 'no-store' }); if (r.ok) F = JSON.parse(await r.text()); } catch (e) {}
    try { const d = localStorage.getItem(this.key()); if (d) { L = JSON.parse(d); src = 'draft'; } } catch (e) {}
    if (F && (!L || ((F.meta && F.meta.version) || 0) > ((L.meta && L.meta.version) || 0))) { L = F; src = 'file'; }   // a newer file (Claude bumped meta.version) wins over an older draft
    if (!L) { L = this.blank(w); src = 'new'; }
    this.L = this.norm(L); this.src = src; this.fit(); this.setState({ world: w, sel: null, drawing: false }); this.recheck(); this.draw();
  }
  norm(L) { for (const k of ['zones', 'surfaces', 'water', 'islands', 'roads', 'paths', 'buildings', 'spots', 'gates', 'wild', 'props']) if (!Array.isArray(L[k])) L[k] = []; L.map = L.map || { half: 300, spawn: [0, 24] }; L.meta = L.meta || { world: this.world, version: 1 }; L.palette = L.palette || {}; return L; }
  snap(v) { const g = this.state.grid; return Math.round(v / g) * g; }
  push() { this.undo.push(JSON.stringify(this.L)); if (this.undo.length > 60) this.undo.shift(); }
  save() { try { localStorage.setItem(this.key(), JSON.stringify(this.L)); this.savedAt = new Date(); this.src = 'draft'; } catch (e) {} }
  commit() { this.save(); this.recheck(); this.draw(); this.setState({ ver: this.state.ver + 1 }); }
  recheck() { clearTimeout(this._rc); this._rc = setTimeout(() => { if (!this.L) return; this.res = this.C.checkLayout(this.L, {}); this.wl = this.C.worldList(this.L); this.setState({ ver: this.state.ver + 1 }); }, 250); }
  doUndo() { const s = this.undo.pop(); if (!s) return; this.L = JSON.parse(s); this.state.sel = null; this.state.drawing = false; this.setState({ sel: null, drawing: false }); this.commit(); }
  uniq(base) { const used = new Set(); for (const a of ['zones', 'paths', 'roads', 'buildings', 'spots', 'gates', 'wild']) for (const o of this.L[a]) if (o.key) used.add(o.key); if (this.L.dock) used.add(this.L.dock.key); if (!used.has(base)) return base; let i = 2; while (used.has(base + i)) i++; return base + i; }
  cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  setupMap() {
    const cv = this.canRef.current, host = this.mapRef.current; if (!cv || !host) return;
    this.ro = new ResizeObserver(() => { const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = Math.max(1, Math.min(4096, host.clientWidth * dpr)); cv.height = Math.max(1, Math.min(4096, host.clientHeight * dpr)); this.dpr = dpr; if (!this.userMoved) this.fit(); this.draw(); }); this.ro.observe(host);
    const P = new Map(); let pinch = null; const pt = e => [e.offsetX, e.offsetY];
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); P.set(e.pointerId, pt(e)); if (!this.view) return;
      if (P.size === 2) { this.drag = null; const [a, b] = [...P.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, s: this.view.s }; return; }
      this.down(e.offsetX, e.offsetY); });
    cv.addEventListener('pointermove', e => { const p = P.get(e.pointerId); if (!p || !this.view) return; const dx = e.offsetX - p[0], dy = e.offsetY - p[1]; P.set(e.pointerId, pt(e));
      if (P.size === 2 && pinch) { const [a, b] = [...P.values()]; this.view.s = Math.max(0.1, Math.min(40, pinch.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d)); this.userMoved = true; this.draw(); return; }
      this.move(e.offsetX, e.offsetY, dx, dy); });
    const up = e => { if (P.size === 1 && P.has(e.pointerId) && this.view) this.up(e.offsetX, e.offsetY); P.delete(e.pointerId); if (P.size < 2) pinch = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { P.delete(e.pointerId); pinch = null; this.drag = null; });
    cv.addEventListener('wheel', e => { e.preventDefault(); if (!this.view) return; this.userMoved = true; const [wx, wz] = this.toW(e.offsetX, e.offsetY); this.view.s = Math.max(0.1, Math.min(40, this.view.s * Math.exp(-e.deltaY * 0.0015))); const [nx, nz] = this.toW(e.offsetX, e.offsetY); this.view.cx += wx - nx; this.view.cz += wz - nz; this.draw(); }, { passive: false });
  }
  fit() { const host = this.mapRef.current; if (!host || !this.L) return; const half = this.L.map.half || 300, W = host.clientWidth, H = host.clientHeight - 40; if (W < 50 || H < 50) return; this.view = { cx: 0, cz: 0, s: Math.max(0.1, Math.min(W, H) / (2 * half * 1.04)) }; }
  toW(sx, sy) { const host = this.mapRef.current, v = this.view; return [v.cx + (sx - host.clientWidth / 2) / v.s, v.cz + (sy - (host.clientHeight - 40) / 2) / v.s]; }
  hit(sx, sy) { const L = this.L, [x, z] = this.toW(sx, sy), tol = 14 / this.view.s, near = (p, r = tol) => p && Math.hypot(p[0] - x, p[1] - z) < r, sel = this.state.sel;
    const inR = r => r && x > r[0] && x < r[1] && z > r[2] && z < r[3];
    if (sel && sel.a === 'buildings') { const b = L.buildings[sel.i]; if (b) { if (near(b.door)) return { ...sel, part: 'door' }; if (near([b.f[1], b.f[3]])) return { ...sel, part: 'size' }; } }
    if (sel && ['zones', 'wild', 'water', 'islands', 'surfaces'].includes(sel.a)) { const o = L[sel.a][sel.i]; if (o && o.r && near([o.r[1], o.r[3]])) return { ...sel, part: 'size' }; }
    if (sel && (sel.a === 'paths' || sel.a === 'roads')) { const o = L[sel.a][sel.i]; if (o) for (let k = 0; k < o.p.length; k++) if (near(o.p[k])) return { ...sel, part: 'pt', k }; }
    if (near(L.map.spawn)) return { a: 'spawn' };
    for (let i = L.spots.length - 1; i >= 0; i--) if (near(L.spots[i].at)) return { a: 'spots', i };
    for (let i = L.gates.length - 1; i >= 0; i--) if (near(L.gates[i].at, Math.max(tol, L.gates[i].r || 6))) return { a: 'gates', i };
    if (L.dock && near(L.dock.pad, Math.max(tol, L.dock.r || 12))) return { a: 'dock' };
    for (let i = L.buildings.length - 1; i >= 0; i--) if (inR(L.buildings[i].f)) return { a: 'buildings', i };
    for (const a of ['paths', 'roads']) for (let i = L[a].length - 1; i >= 0; i--) { const o = L[a][i]; if (o.p && o.p.length > 1 && this.C.polyD(x, z, o.p) < (o.w || 4) / 2 + tol * 0.6) return { a, i }; }
    let best = null, ba = Infinity; for (const a of ['wild', 'islands', 'water', 'surfaces', 'zones']) L[a].forEach((o, i) => { if (inR(o.r)) { const ar = (o.r[1] - o.r[0]) * (o.r[3] - o.r[2]); if (ar < ba) { ba = ar; best = { a, i }; } } }); return best; }
  posOf(h) { const L = this.L; return JSON.parse(JSON.stringify(h.a === 'spawn' ? L.map.spawn : h.a === 'dock' ? L.dock : L[h.a][h.i])); }
  down(sx, sy) { const t = this.state.tool, [x, z] = this.toW(sx, sy); this.dn = { moved: 0 };
    if (t === 'move') { const h = this.hit(sx, sy); if (h) { this.drag = { h, x, z, orig: this.posOf(h), pushed: false }; if (!h.part && h.a !== 'spawn') this.setState({ sel: { a: h.a, i: h.i } }, () => this.draw()); } else this.drag = { pan: true }; return; }
    if (t === 'area') { this.drag = { area: true, x0: this.snap(x), z0: this.snap(z), x1: this.snap(x), z1: this.snap(z) }; return; }
    this.drag = { pan: true }; }
  move(sx, sy, dx, dy) { const d = this.drag; if (!d || !this.dn) return; this.dn.moved += Math.abs(dx) + Math.abs(dy); const [x, z] = this.toW(sx, sy), L = this.L;
    if (d.pan) { if (this.dn.moved < 4) return; this.userMoved = true; this.view.cx -= dx / this.view.s; this.view.cz -= dy / this.view.s; this.draw(); return; }
    if (d.area) { d.x1 = this.snap(x); d.z1 = this.snap(z); this.draw(); return; }
    if (this.dn.moved < 3) return; if (!d.pushed) { this.push(); d.pushed = true; }

  renderVals() {

          else { const m = { cave: ['place', 'cave'], battle: ['place', 'battle'], relicFind: ['place', 'relicFind'], vehicle: ['place', 'vehicle'], helipad: ['place', 'helipad'], telepad: ['place', 'telepad'], dock: ['place', 'dock'], monsters: ['area', 'wild'], creatures: ['area', 'wild'], robots: ['area', 'wild'] }[x.id]; if (m) this.setState(m[0] === 'place' ? { tool: 'place', sub: m[1] } : { tool: 'area', area: m[1] }); } } }; });

      status: `${st}${res ? ` · checker: ${res.counts.fail} FAIL · ${res.counts.warn} WARN` : ''}`, hint: this.HINTS[s.tool],

      hasSel: !!sel, selTitle: sel ? (titles[s.sel.a] || '') + (sel.key ? ' · ' + sel.key : '') : '', fields: sel ? this.fieldsFor(sel, s.sel.a) : [], onDelete: () => this.delSel(),

      walkUrl: 'Layout Viewer.dc.html?world=' + (s.world || 'gaya') + '&draft=1'
