<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;background:#201e1d}a{color:#ffd23a}a:hover{color:#ec3013}</style>
</helmet>
<div style="min-height:100vh;background:#201e1d;color:#fff;font-family:var(--font-body);padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px" data-screen-label="Speedboat Bay World Phone Preview">
  <div style="display:flex;flex-direction:column;gap:4px;border-bottom:2px solid #ffd23a;padding-bottom:12px">
    <div style="font:800 12px var(--font-heading);letter-spacing:0.12em;color:#ffd23a">MERU 2 · SPEEDBOAT BAY IN WORLD</div>
    <div style="font:900 28px var(--font-heading);letter-spacing:-0.01em">Phone preview</div>
    <div style="font:600 14px var(--font-body);color:#cfcac4;text-wrap:pretty">Pick a frame. It loads Meru and opens the bay game by itself (?start=baygame), about 1 to 2 minutes. Only one frame loads at a time, so the two Meru builds never run together.</div>
  </div>
  <div style="display:flex;gap:0">
    <button onClick="{{ showP }}" style="min-height:48px;padding:0 18px;border:2px solid #ffd23a;border-radius:0;background:{{ pBg }};color:{{ pFg }};font:900 13px var(--font-heading);letter-spacing:0.1em;cursor:pointer;text-align:left" style-hover="background:#ec3013;color:#fff">PORTRAIT 390 × 844</button>
    <button onClick="{{ showL }}" style="min-height:48px;padding:0 18px;border:2px solid #ffd23a;border-left:0;border-radius:0;background:{{ lBg }};color:{{ lFg }};font:900 13px var(--font-heading);letter-spacing:0.1em;cursor:pointer;text-align:left" style-hover="background:#ec3013;color:#fff">LANDSCAPE 844 × 390</button>
  </div>
  <sc-if value="{{ pOn }}" hint-placeholder-val="{{ true }}">
    <iframe src="FOXGATE8-PLAYABLE.dc.html?start=baygame" title="Bay portrait" style="width:390px;height:844px;border:2px solid #fff;display:block;background:#000"></iframe>
  </sc-if>
  <sc-if value="{{ lOn }}" hint-placeholder-val="{{ false }}">
    <iframe src="FOXGATE8-PLAYABLE.dc.html?start=baygame" title="Bay landscape" style="width:844px;height:390px;border:2px solid #fff;display:block;background:#000"></iframe>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { m: 'p' };
  renderVals() { const p = this.state.m === 'p';
    return { pOn: p, lOn: !p, showP: () => this.setState({ m: 'p' }), showL: () => this.setState({ m: 'l' }),
      pBg: p ? '#ffd23a' : '#000', pFg: p ? '#201e1d' : '#fff', lBg: p ? '#000' : '#ffd23a', lFg: p ? '#fff' : '#201e1d' }; }
}
</script>
</body>
</html>
