<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#201e1d}a{color:#f3f2f2}a:hover{color:var(--color-accent)}button:focus-visible,input:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}input::placeholder{color:#8a8786}</style>
</helmet>
<div data-screen-label="8 GATES Start" style="position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#201e1d;color:#f3f2f2;font-family:var(--font-body);display:flex;flex-direction:{{ dir }}">
  <div style="position:{{ vidPos }};inset:0;flex:{{ vidFlex }};min-height:0;background:#000;overflow:hidden">
    <video ref="{{ vidRef }}" style="width:100%;height:100%;object-fit:{{ fit }};display:{{ vidDisp }}"></video>
    <sc-if value="{{ noVideo }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;padding:max(24px,env(safe-area-inset-top)) 24px 24px;gap:8px;background:#201e1d;box-sizing:border-box">
        <div style="font-family:var(--font-heading);font-weight:900;font-size:clamp(56px,16vw,150px);line-height:0.85;letter-spacing:-0.02em">8 GATES</div>
        <div style="font-size:14px;letter-spacing:0.08em;color:#c9c6c4">INTRO FILM GOES HERE · MERU/videos/8GATES-OPEN.mp4</div>
      </div>
    </sc-if>
  </div>
  <div style="position:{{ panelPos }};left:0;bottom:0;width:{{ panelW }};max-width:100%;box-sizing:border-box;background:#201e1d;border-top:2px solid #f3f2f2;border-right:{{ panelRule }};padding:20px 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;z-index:2">
    <sc-if value="{{ onTitle }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:10px">
        <button onClick="{{ newGame }}" style-hover="background:var(--color-accent-600)" style="min-height:56px;padding:0 18px;border:0;border-radius:0;background:var(--color-accent);color:#f3f2f2;font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:0.04em;text-align:left;cursor:pointer">NEW GAME</button>
        <sc-if value="{{ hasSave }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ cont }}" style-hover="background:var(--color-accent-900)" style="min-height:56px;padding:0 18px;border:2px solid #f3f2f2;border-radius:0;background:transparent;color:#f3f2f2;font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:0.04em;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px"><span>CONTINUE</span><span style="font-size:14px;font-weight:600;color:#c9c6c4">{{ saveName }}</span></button>
        </sc-if>
        <button onClick="{{ toggleSound }}" style-hover="background:var(--color-accent-900)" style="min-height:48px;padding:0 18px;border:2px solid #f3f2f2;border-radius:0;background:transparent;color:#f3f2f2;font-family:var(--font-heading);font-weight:700;font-size:16px;letter-spacing:0.06em;text-align:left;cursor:pointer">{{ soundLabel }}</button>
      </div>
    </sc-if>
    <sc-if value="{{ onName }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <div style="font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:0.02em">NAME YOUR PLANET</div>
          <div style="font-size:16px;color:#c9c6c4">Every map, sign and ship log will use it.</div>
        </div>
        <input value="{{ name }}" onChange="{{ onType }}" onKeyDown="{{ onKey }}" maxlength="18" placeholder="EPHRAIM" autocomplete="off" style="min-height:56px;padding:0 14px;border:2px solid #f3f2f2;border-radius:0;background:#201e1d;color:#f3f2f2;font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:0.04em;text-transform:uppercase;box-sizing:border-box;width:100%"></input>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ ideas }}" as="idea" hint-placeholder-count="4">
            <button onClick="{{ idea.pick }}" style-hover="background:var(--color-accent-900)" style="min-height:44px;padding:0 14px;border:2px solid #f3f2f2;border-radius:0;background:transparent;color:#f3f2f2;font-family:var(--font-heading);font-weight:700;font-size:15px;letter-spacing:0.04em;cursor:pointer">{{ idea.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex;gap:10px">
          <button onClick="{{ back }}" style-hover="background:var(--color-accent-900)" style="min-height:56px;padding:0 18px;border:2px solid #f3f2f2;border-radius:0;background:transparent;color:#f3f2f2;font-family:var(--font-heading);font-weight:700;font-size:18px;text-align:left;cursor:pointer">BACK</button>
          <button onClick="{{ go }}" style-hover="background:var(--color-accent-600)" style="flex:1;min-height:56px;padding:0 18px;border:0;border-radius:0;background:var(--color-accent);color:#f3f2f2;font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:0.04em;text-align:left;cursor:pointer">START</button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;video&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MERU/videos/8GATES-OPEN.mp4&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { step: 'title', name: '', noVideo: false, muted: true, vw: 800, vh: 600, save: null };
  vidRef = React.createRef();
  onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });
  componentDidMount() {
    window.addEventListener('resize', this.onResize); this.onResize();
    const v = this.vidRef.current;
    if (v) { v.muted = true; v.loop = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.addEventListener('error', () => this.setState({ noVideo: true })); v.src = this.props.video ?? 'MERU/videos/8GATES-OPEN.mp4'; v.play().catch(() => {}); }
    import(new URL('engine/save.js', document.baseURI).href).then(m => { this.saveMod = m.save; this.setState({ save: m.save.data }); }).catch(() => {});
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  planetName() { const d = this.state.save, n = d && d.stats && d.stats.ppName; if (n) return n; try { const o = JSON.parse(localStorage.getItem('space.planetNames.v1') || '{}'); return o && o.p1 ? String(o.p1).toUpperCase() : null; } catch (e) { return null; } }
  start() {
    const n = String(this.state.name || '').trim().toUpperCase().slice(0, 18) || 'EPHRAIM', S = this.saveMod;
    try { const o = JSON.parse(localStorage.getItem('space.planetNames.v1') || '{}') || {}; o.p1 = n; localStorage.setItem('space.planetNames.v1', JSON.stringify(o)); localStorage.removeItem('pp.shipment'); } catch (e) {}
    if (S) { S.setStat('ppName', n); S.setFlag('ppNamed'); S.setFlag('ppOpenDone', false); }
    window.location.href = encodeURI('Player Planet.dc.html');
  }
  renderVals() {
    const S = this.state, portrait = S.vh >= S.vw, d = S.save, done = !!(d && d.flags && d.flags.ppOpenDone), pn = this.planetName();
    return {
      vidRef: this.vidRef, noVideo: S.noVideo, vidDisp: S.noVideo ? 'none' : 'block',
      dir: portrait ? 'column' : 'row', vidPos: portrait ? 'relative' : 'absolute', vidFlex: portrait ? '1 1 auto' : 'none', fit: portrait ? 'contain' : 'cover',
      panelPos: portrait ? 'relative' : 'absolute', panelW: portrait ? '100%' : 'min(420px, 46vw)', panelRule: portrait ? '0' : '2px solid #f3f2f2',
      onTitle: S.step === 'title', onName: S.step === 'name', hasSave: !!pn, saveName: pn ? pn + (done ? ' · MERU' : '') : '',
      soundLabel: S.muted ? 'SOUND ON' : 'SOUND OFF',
      toggleSound: () => { const v = this.vidRef.current, m = !S.muted; if (v) { v.muted = m; if (!m) { v.currentTime = 0; v.play().catch(() => {}); } } this.setState({ muted: m }); },
      newGame: () => this.setState({ step: 'name', name: pn || '' }),
      cont: () => { window.location.href = encodeURI(done ? 'FOXGATE8-PLAYABLE.dc.html' : 'Player Planet.dc.html'); },
      name: S.name, onType: e => this.setState({ name: e.target.value.toUpperCase().slice(0, 18) }), onKey: e => { if (e.key === 'Enter') this.start(); },
      ideas: ['EPHRAIM', 'NEW HAVEN', 'TERRA NOVA', 'EMBERFALL'].map(label => ({ label, pick: () => this.setState({ name: label }) })),
      back: () => this.setState({ step: 'title' }), go: () => this.start()
    };
  }
}
</script>
</body>
</html>
