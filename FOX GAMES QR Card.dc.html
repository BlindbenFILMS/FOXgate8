<div data-screen-label="QR Card" style="width:1920px;height:1080px;background:#f3f2f2;color:#201e1d;font-family:var(--font-heading);display:grid;grid-template-columns:minmax(0,1fr) 760px;overflow:hidden;box-sizing:border-box">
  <div style="display:flex;flex-direction:column;justify-content:space-between;padding:96px 0 96px 112px;border-right:2px solid #201e1d">
    <div style="display:flex;align-items:center;gap:20px">
      <div style="width:56px;height:56px;background:#ec3013"></div>
      <span style="font-weight:900;font-size:44px;letter-spacing:0.04em">FOX GAMES</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:28px">
      <span style="font-weight:800;font-size:32px;letter-spacing:0.16em;color:#ec3013">NOW PLAYING · WORLD 1 · MERU</span>
      <span style="font-weight:900;font-size:220px;line-height:0.86;letter-spacing:-0.035em">FOXGATE8</span>
      <div style="width:640px;height:4px;background:#201e1d"></div>
      <span style="font-weight:700;font-size:44px;line-height:1.2;max-width:900px;text-wrap:pretty">Scan with your phone camera to start in Town Square.</span>
    </div>
    <div style="display:flex;gap:48px;font-weight:800;font-size:28px;letter-spacing:0.1em">
      <span>1 · SCAN</span><span>2 · PLAY</span><span>3 · EXPLORE MERU</span>
    </div>
  </div>
  <div style="background:#ec3013;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 110px;gap:36px">
    <div style="width:540px;height:540px;background:#ffffff;border:4px solid #201e1d;box-sizing:border-box;padding:28px">
      <img src="{{ qr }}" alt="QR code to play FOXGATE8" style="display:block;width:100%;height:100%;image-rendering:pixelated">
    </div>
    <span style="font-weight:900;font-size:40px;letter-spacing:0.08em;color:#ffffff">SCAN TO PLAY</span>
  </div>
</div>
</x-dc>

  }
}
